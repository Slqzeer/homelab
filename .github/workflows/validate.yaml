# Validates every manifest before Argo CD can apply it.
#
# This repository is reconciled into the cluster from `main` with
# selfHeal: true. Before this workflow existed there was nothing at all
# between `git push` and the cluster. This narrows that window; it does not close it. CI runs on a
# GitHub-hosted runner that cannot reach the cluster, so this validates
# schema, not semantics -- see the known gaps in the root README.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Install yamllint
        run: pip install --quiet yamllint==1.38.0 PyYAML==6.0.3
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1

      - name: Lint
        # --strict makes warnings fail. .yamllint.yaml is tuned so the tree
        # is clean under it; see the argument in that file's header.
        run: yamllint --strict -c .yamllint.yaml apps bootstrap environments infrastructure observability platform .github

      - name: Validate Grafana OAuth routing
        run: python3 observability/monitoring/test_oauth_routing.py

      - name: Validate application onboarding contract
        run: python3 -m unittest -v tests.test_application_onboarding

      - name: Validate Keycloak client registration
        run: python3 platform/keycloak/test_client_registration.py -v

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Install kubeconform
        # Pinned by version AND checksum. An unpinned linter is a supply-chain
        # hole in the very job whose purpose is to be trusted.
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kc.tgz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform

      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1

      - name: Render application configs
        run: |
          mkdir -p rendered
          kustomize build apps/portal/config > rendered/portal-config.yaml
          # tle-dev renders into the same directory so the kubeconform steps
          # below schema-check it; cross-namespace objects (databases,
          # keycloak) are expected and kept as-is (see its kustomization).
          kustomize build apps/tle-dev/config > rendered/tle-dev-config.yaml

      - name: Validate manifests
        # -strict rejects unknown fields. Without it a typo like `replicaz:`
        # is accepted and this job is decorative.
        #
        # -ignore-filename-pattern excludes Helm values files, which are not
        # manifests and have no apiVersion/kind. The rule is by FILENAME
        # rather than by directory because every values file here is named
        # values.yaml, and a filename rule needs no maintenance as components
        # are added -- a directory list would need editing every phase and
        # would fail open when someone forgot.
        #
        # It also excludes platform/nexus/registries.yaml: containerd's mirror
        # configuration, read by k3s from the host at startup. Nothing in
        # the cluster applies it, so like values.yaml it is not a manifest
        # and has no kind. This one is matched by PATH rather than by bare
        # filename, because there is exactly one such file and the
        # no-maintenance argument above does not apply: a bare
        # `registries\.yaml$` would also silently exempt any future file of
        # that name anywhere in the tree, including a real manifest.
        #
        # The second -schema-location supplies CRD schemas. The CRDs this
        # repository uses are all in the datreeio catalog: Application,
        # VaultAuth, VaultConnection, VaultStaticSecret, ProxyClass, and as
        # of phase 22 ServiceMonitor, PrometheusRule (monitoring.coreos.com)
        # and HelmChartConfig (helm.cattle.io). All three of the phase-22
        # kinds were checked against the catalog before being used; none
        # needs an exemption, and none should be given one.
        run: |
          ./kubeconform -strict -summary \
            -kubernetes-version 1.36.0 \
            -ignore-filename-pattern 'values\.yaml$' \
            -ignore-filename-pattern 'platform/nexus/registries\.yaml$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            bootstrap environments infrastructure observability platform rendered

      - name: Fail if any resource was skipped
        # A skipped resource is an UNVALIDATED resource. kubeconform exits 0
        # when it skips, so without this check a CRD schema that failed to
        # fetch would turn this job green while checking nothing.
        run: |
          ./kubeconform -summary -kubernetes-version 1.36.0 \
            -ignore-filename-pattern 'values\.yaml$' \
            -ignore-filename-pattern 'platform/nexus/registries\.yaml$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            bootstrap environments infrastructure observability platform rendered \
            | tee summary.txt
          grep -q 'Skipped: 0' summary.txt
