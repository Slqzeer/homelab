# Single source of truth for Argo CD configuration.
# Read by bootstrap/argocd/bootstrap.sh AND by
# environments/homelab/apps/argocd.yaml (self-management).
# Chart: argo-cd 10.5.0 (Argo CD v3.5.2)

configs:
  cm:
    # Argo CD's own external URL, used to build redirects and links.
    # Must match the tailnet hostname from
    # infrastructure/ingress/config/argocd-ingress.yaml.
    url: https://argocd.taildf6cd4.ts.net
  params:
    # TLS terminates at the Tailscale proxy, which forwards plain HTTP to
    # this Service inside the cluster. This is the intended steady state,
    # not a temporary port-forward workaround.
    server.insecure: true

# No SSO in scope; local admin only.
dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # This node is a workstation, homelab and game host simultaneously, so
  # health endpoints can be slow to answer under load. The upstream probe
  # defaults (timeoutSeconds 1, failureThreshold 3) kill repo-server during
  # ordinary memory pressure even though the process is healthy. These
  # values tolerate a loaded host without masking a genuinely dead pod.
  # Invariant: readiness must trip before liveness. failureThreshold and
  # timeoutSeconds are equal on both probes below, so the only margin comes
  # from periodSeconds (20 vs 30) -- change both probes together, or a
  # "faster" liveness periodSeconds can pull liveness ahead of readiness and
  # the pod gets killed instead of just taken out of rotation.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 15
    failureThreshold: 6

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
