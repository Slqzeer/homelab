# Namespaces for components managed from this repository.
# Add a namespace here when the component that needs it is planned, not before.
#
# The `namespaces` Application has prune: true. Removing an entry from this
# file DELETES the Namespace and cascades to every resource inside it,
# including PVCs, once Vault lands. Retire the component first.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
# Tailscale Kubernetes operator and the proxy pods it creates.
# Also holds the hand-created `operator-oauth` Secret, which exists in no
# repository -- see infrastructure/ingress/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
# Chart default namespace for the Vault Secrets Operator. Created here at
# wave 0 rather than by CreateNamespace=true, so that every namespace in this
# cluster has exactly one origin.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-secrets-operator-system
---
# Stateful data services, and the cache that sits beside them. PostgreSQL
# (phase 18) is the stateful one; Redis (phase 19) is deliberately ephemeral
# and holds no volume at all. They share this namespace, and therefore share
# its VaultConnection -- see platform/databases/redis/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: databases
---
# Applications built and published by this homelab's own CI. Holds the
# GHCR pull credential (platform/registry/) and its consumers.
#
# NOTE: this namespace and the top-level `apps/` DIRECTORY in this repository
# are unrelated. That directory is not watched by anything -- an Application
# placed there is silently ignored, as the root README explains -- and it stays
# empty because application manifests live in their own repositories. The
# shared name is a coincidence worth knowing about, not a connection.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
# The Prometheus agent, its operator and the cluster exporters --
# workstation-plan phases 22 and 23. Storage, dashboards and queries are in
# Grafana Cloud since 2026-10-05. See docs/superpowers/specs/
# 2026-09-18-monitoring-stack-design.md for the original design.
#
# The exporters for PostgreSQL and Redis do NOT live here: they sit in
# `databases`, beside what they scrape, because each needs that namespace's
# credential Secret and a VaultAuth ServiceAccount must reside in the
# consuming Secret's namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# The Grafana Alloy DaemonSet that ships pod logs to Grafana Cloud Loki --
# workstation-plan phase 24. The in-cluster Loki was removed 2026-10-05. See
# docs/superpowers/specs/2026-09-19-logging-stack-design.md.
#
# Separate from `monitoring` on purpose: this is a different chart pair with a
# different lifecycle, and phase 22 already set the precedent of putting a
# component outside `monitoring` when ownership argued for it (the PostgreSQL
# and Redis exporters live in `databases`).
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
# Keycloak, the homelab's OIDC identity provider -- workstation-plan phase
# 25. See docs/superpowers/specs/2026-09-20-keycloak-design.md.
#
# Keycloak holds NO volume. All of its state -- realms, clients, users,
# TOTP seeds -- lives in the `keycloak` database inside the PostgreSQL in
# `databases`. The pod is disposable; the database is not.
#
# Not in `apps`: that namespace is for workloads this homelab's own CI
# builds. Not in `platform/databases`: Keycloak is a consumer of that
# namespace, not a member of it. A separate namespace is also a
# REQUIREMENT, not a preference -- the VaultAuth CRD states its
# ServiceAccount "must reside in the consuming secret's namespace", and
# this phase has consuming Secrets in three namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
# Homelab Portal, the first conforming personal application. Its generic
# package deliberately deletes its own Namespace in the homelab overlay so
# bootstrap remains the sole namespace owner.
apiVersion: v1
kind: Namespace
metadata:
  name: portal
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# The Last Exam dev environment (issue #2). Single restricted namespace
# holding the dedicated edge plus all dev services, Valkey and NATS.
# PostgreSQL lives in the shared `databases` namespace via a dedicated
# database + Job; this namespace owns nothing outside itself.
apiVersion: v1
kind: Namespace
metadata:
  name: tle-dev
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# OmniRoute LLM gateway: the single model gateway for Hermes and its workers.
# Holds OmniRoute and its SQLite PVC only; provider credentials never leave it.
apiVersion: v1
kind: Namespace
metadata:
  name: omniroute
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# Allowlisting HTTPS egress proxy (platform/egress-proxy): the only pods with
# broad internet egress. Application namespaces reach providers through it.
apiVersion: v1
kind: Namespace
metadata:
  name: egress
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# Hermes agent platform: the read-only infra identity today, worker Jobs in
# Stage 4 (/srv/projects/agent-platform/docs/architecture.md).
apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# Penpot, the design platform, and its MCP server. A dedicated namespace
# because the onboarding contract requires one, and because this component
# owns an assets PVC that must not share a lifecycle with anything else.
#
# Its database is NOT here: `penpot` lives in the shared PostgreSQL in
# `databases` via a dedicated database and Job, the same arrangement as
# Keycloak and tle-dev. See docs/runbooks/penpot-recovery.md.
apiVersion: v1
kind: Namespace
metadata:
  name: penpot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
