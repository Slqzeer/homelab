# The Vault -> Kubernetes Secret path for the Grafana Cloud logs
# credential, read by Alloy's loki.write endpoint through two environment variables.
#
# Vault path homelab/grafana-cloud holds three keys: metrics-username and
# logs-username (the stack's Prometheus and Loki instance IDs) and token (an
# access-policy token with logs:write scope). See the "Grafana Cloud" section of
# observability/monitoring/README.md for issuing and seeding it.
#
# platform/vault/configure-vault.sh seeds PLACEHOLDERS when the path is
# absent, so this Secret always exists on a cold rebuild. A placeholder
# degrades to 401s at the push endpoint and Alloy retries with backoff -- never to a pod stuck in
# CreateContainerConfigError that would hold back every later sync wave.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-cloud
  namespace: logging
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: grafana-cloud
  namespace: logging
spec:
  # Plain HTTP in-cluster: single node, so pod traffic never leaves the host.
  # skipTLSVerify is required by the CRD even when the address is http, where
  # it has no effect.
  address: http://vault.vault.svc:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana-cloud
  namespace: logging
spec:
  vaultConnectionRef: grafana-cloud
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Must match `vault write auth/kubernetes/role/vso-grafana-cloud-logs` in
    # platform/vault/configure-vault.sh exactly. A mismatch in the role, the
    # ServiceAccount or the audience is a permission denial that names
    # neither side, while Argo CD reports everything Synced.
    role: vso-grafana-cloud-logs
    serviceAccount: grafana-cloud
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-cloud
  namespace: logging
spec:
  vaultAuthRef: grafana-cloud
  mount: homelab
  type: kv-v2
  path: grafana-cloud
  refreshAfter: 300s
  # Alloy reads the credential as environment variables, fixed at container
  # start, so a rotated token only takes effect after a restart. VSO does
  # that restart itself when the Secret changes.
  rolloutRestartTargets:
    - kind: DaemonSet
      name: alloy
  destination:
    name: grafana-cloud
    create: true
    transformation:
      # Under destination.transformation, NOT under spec: spec is a
      # structural schema, so an unknown field there is pruned silently.
      excludeRaw: true
      # Drop every source field and keep only the two templated keys, so
      # this namespace never holds the Prometheus instance ID. Filters are
      # "never applied to templated fields" (CRD), so the templates can
      # still read the source keys.
      excludes:
        - ".*"
      templates:
        username:
          text: '{{ get .Secrets "logs-username" }}'
        password:
          text: '{{ get .Secrets "token" }}'
