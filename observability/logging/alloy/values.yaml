# Grafana Alloy -- workstation-plan phase 24, the log collector.
#
# Ships to GRAFANA CLOUD Loki since 2026-10-05; the in-cluster Loki is gone.
# The push URL is below, the instance ID and token come from Secret
# `grafana-cloud` (config/vault-secrets.yaml) as environment variables.
# Chart: grafana/alloy 1.12.1 (Alloy v1.19.2)
# Repo:  https://grafana.github.io/helm-charts
#
# Design: docs/superpowers/specs/2026-09-19-logging-stack-design.md
#
# NOT Promtail. grafana/promtail is marked deprecated in the Helm index, its
# last real release was 2025-05, and upstream Promtail reached end of life on
# 2026-03-02.
#
# Three of the overrides below exist because the chart default fails
# SILENTLY: the DaemonSet starts, passes its probes, reports Healthy, and
# either collects nothing (securityContext) or replays every log file on
# every restart (storagePath). A green pod is not evidence here.

# Decision L13. The chart's `crds` subchart installs a monitoring.grafana.com
# PodLogs CRD. This pipeline uses discovery.kubernetes and file tailing, not
# PodLogs, and an unused CRD is a kind in this cluster that CI has never
# validated.
crds:
  create: false

# Decision L20. The chart's default `rbac.rules` grants cluster-wide
# get/list/watch on configmaps AND secrets, plus pods/log, replicasets, and
# six monitoring.coreos.com kinds -- bound to a ServiceAccount whose pod runs
# as runAsUser: 0. That reaches vault-*, grafana-cloud, ghcr-pull
# and every database credential in this cluster. This pipeline
# uses discovery.kubernetes with role = "pod" plus file tailing; it needs
# none of it. Overriding `rules` replaces that grant with just the two verbs
# this pipeline actually uses.
#
# Do NOT set `clusterRules: []`. The template renders invalid YAML when you
# do ("did not find expected '-' indicator") -- override `rules` only and
# leave `clusterRules` at its chart default, which grants `nodes`,
# `nodes/pods` and `nodes/metrics`. Those are harmless (no Secret is a node)
# and are not touched here.
#
# `namespaces` stays alongside `pods` even though this pipeline only paths
# into pods. Dropping it is the exact silent failure L11 exists to prevent,
# reintroduced by a security fix: if discovery.kubernetes needs namespace
# metadata and doesn't have it, the DaemonSet comes up Healthy and collects
# nothing. Namespace metadata is a cheap read; a cluster-wide Secrets grant
# is not -- that asymmetry is the whole decision.
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces"]
      verbs: ["get", "list", "watch"]

controller:
  # The chart default, restated so a future chart default cannot quietly
  # turn one pod per node into one pod per cluster.
  type: daemonset

  # Decision L12. Where the positions file actually lives. See storagePath
  # below for why this volume has to exist at all.
  volumes:
    extra:
      - name: positions
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

# Decision L19, the same defect class. Verified on the live pod:
# config-reloader carries `requests: {cpu: 10m, memory: 50Mi}` and no
# limits -- configReloader.resources has no limits in the chart default,
# only requests. This sidecar shares the pod with Alloy, which has its own
# 256Mi limit above; an unbounded sidecar can push total pod usage past
# that budget while `kubectl top pod` still reports a plausible-looking
# figure for the pod as a whole -- exactly how a previous phase's Grafana
# OOMKill hid behind a 408Mi pod total. The numbers match
# observability/monitoring/values.yaml's prometheusConfigReloader block,
# which bounds the identical image (quay.io/prometheus-operator/
# prometheus-config-reloader v0.91.0) for the same reason; the chart's own
# default request here is 50Mi, so this also lowers the request to match
# that precedent, not just adds the limit.
configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

alloy:
  # Decision L9. Adds --disable-reporting. Alloy phones home to Grafana Labs
  # by default.
  enableReporting: false
  # basic_auth for loki.write below. `optional` is NOT set: configure-vault.sh
  # seeds placeholders so the Secret always exists, and a missing Secret
  # should fail loudly at pod start rather than ship anonymously.
  extraEnv:
    - name: GRAFANA_CLOUD_LOGS_USERNAME
      valueFrom:
        secretKeyRef:
          name: grafana-cloud
          key: username
    - name: GRAFANA_CLOUD_TOKEN
      valueFrom:
        secretKeyRef:
          name: grafana-cloud
          key: password

  # Decision L12. The chart starts the container with
  # --storage.path=/tmp/alloy and MOUNTS NO VOLUME THERE -- verified in
  # templates/containers/_agent.yaml, whose volumeMounts block carries only
  # `config` and `varlog`. That path holds loki.source.file's positions, so
  # at the default they die with the pod and Alloy re-reads every log file
  # from byte zero on every restart -- including every restart caused by
  # editing this file.
  storagePath: /var/lib/alloy

  # Decision L11. Measured on this host: /var/log/pods is drwxr-x--- root:root.
  # The chart sets securityContext: {} and the image does not run as root, so
  # WITHOUT THIS LINE the DaemonSet comes up Healthy and tails nothing at all.
  # This is the single most important line in this file.
  securityContext:
    runAsUser: 0

  mounts:
    # hostPath /var/log, mounted readOnly. One mount covers both trees:
    # /var/log/containers/*.log are symlinks INTO /var/log/pods/... , so they
    # resolve inside it.
    varlog: true
    # This cluster runs containerd 2.3.4-k3s1.36. There is no /var/lib/docker.
    dockercontainers: false
    extra:
      - name: positions
        mountPath: /var/lib/alloy

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  configMap:
    create: true
    # The whole collector pipeline. Validated by `alloy validate` against
    # v1.19.2 before this file was committed -- see the plan's Task 3.
    #
    # K8S_NODE_NAME is supplied BY THE CHART from spec.nodeName (alongside
    # HOSTNAME and ALLOY_DEPLOY_MODE); this file deliberately does not add a
    # duplicate NODE_NAME of its own.
    #
    # On one node the node filter changes nothing. It costs six lines and
    # keeps the pipeline correct if a second node ever appears.
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      // Decision L14. EXACTLY FOUR LABELS: namespace, pod, container, app.
      // Not the pod's labels wholesale. Every distinct combination is a
      // separate stream, index entry and chunk set, and relabelling pod
      // labels in is the standard way a small Loki falls over. It is also
      // the one mistake here that cannot be undone, because the cardinality
      // is written into blocks already on disk. Everything else about a pod
      // stays searchable as log CONTENT, which is what Loki is good at.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        // Builds /var/log/pods/*<uid>/<container>/*.log. The separator joins
        // the two source labels into "<uid>/<container>", and the default
        // regex (.*) captures the pair as $1.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // stage.cri is NOT optional. containerd writes each line as
      // "<RFC3339Nano> <stream> <F|P> <text>"; without this stage every log
      // line in Loki carries that prefix as content and is stamped with the
      // ingest time rather than the time it was emitted.
      loki.process "pod_logs" {
        stage.cri {}

        // Decision L14, amended. loki.source.file attaches `filename` on
        // its own -- it is not produced by any rule above -- and the value
        // is the full hostPath INCLUDING THE POD UID, so without this
        // stage every pod restart anywhere in the cluster mints a
        // permanent new stream. stage.cri also adds `stream` (stdout vs
        // stderr). Do not delete this as redundant: the relabel rules
        // above already look like they produce exactly four labels, but
        // they don't stop these two from being attached afterward.
        stage.label_keep {
          values = ["namespace", "pod", "container", "app"]
        }

        forward_to = [loki.write.default.receiver]
      }

      // `cluster` is the label Grafana Cloud's Kubernetes app groups by,
      // and the same value the Prometheus agent sets as an external label.
      // One constant label adds no streams.
      loki.write "default" {
        endpoint {
          // REPLACE_ME: the stack's Loki push endpoint, from grafana.com ->
          // stack -> Loki -> Details, with /loki/api/v1/push appended.
          url = "https://REPLACE_ME.grafana.net/loki/api/v1/push"
          basic_auth {
            username = sys.env("GRAFANA_CLOUD_LOGS_USERNAME")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
        external_labels = {
          cluster = "homelab",
        }
      }
