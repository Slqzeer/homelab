# The Vault -> Kubernetes Secret path for Grafana's admin credential.
#
# This file is in config/ rather than targets/ because it needs NO CRD that
# the chart installs. It is a source of the `monitoring` Application at wave
# 23, so the Secret is created in the same sync as the Grafana Deployment
# that mounts it. VSO materialises it asynchronously, so Grafana may restart
# once or twice before the Secret exists; it recovers without intervention.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: grafana
  namespace: monitoring
spec:
  # Plain HTTP in-cluster: single node, so pod traffic never leaves the host.
  # skipTLSVerify is required by the CRD even when the address is http, where
  # it has no effect.
  address: http://vault.vault.svc:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: grafana
  namespace: monitoring
spec:
  vaultConnectionRef: grafana
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Must match `vault write auth/kubernetes/role/vso-grafana` in
    # platform/vault/configure-vault.sh exactly. A mismatch in the role, the
    # ServiceAccount or the audience is a permission denial that names
    # neither side, while Argo CD reports everything Synced.
    role: vso-grafana
    serviceAccount: grafana
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  vaultAuthRef: grafana
  mount: homelab
  type: kv-v2
  path: grafana
  refreshAfter: 60s
  destination:
    name: grafana-admin
    create: true
    transformation:
      # Under destination.transformation, NOT under spec. spec is a
      # structural schema, so an unknown field there is pruned silently --
      # the Secret would still be created, Argo CD would still report
      # Healthy, and it would carry a _raw key anyway.
      excludeRaw: true
      # Drop EVERY source field. Vault stores username/password; the
      # templates below RENAME them to admin-user/admin-password rather than
      # replacing them, so without this the Secret would carry the admin
      # password twice -- once as `admin-password` and once as the untouched
      # `password` key. Verified against the live redis-credentials Secret,
      # which shows templates ADD keys, not replace them.
      #
      # Per the CRD, these filters are "never applied to templated fields",
      # so the templates below can still read `username` and `password` even
      # though neither reaches the destination Secret.
      excludes:
        - ".*"
      templates:
        admin-user:
          text: '{{ get .Secrets "username" }}'
        admin-password:
          text: '{{ get .Secrets "password" }}'
---
# The OIDC client secret Grafana presents to Keycloak. Phase 25.
#
# Reuses the `grafana` ServiceAccount and VaultAuth above: the
# vso-grafana-read policy grants both homelab/grafana and
# homelab/keycloak-grafana, so this needs no new identity.
#
# The value in Vault is a PLACEHOLDER until a human overwrites it with the
# secret Keycloak generated at realm import -- see
# platform/keycloak/README.md. The placeholder exists so this Secret always
# exists: Grafana reads it through envValueFrom, and a missing Secret would
# leave the pod in CreateContainerConfigError, so `monitoring` would never
# go Healthy, so NOTHING AT WAVE 24 would sync -- including the Keycloak
# that is the only thing able to produce the real value.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-grafana
  namespace: monitoring
spec:
  vaultAuthRef: grafana
  mount: homelab
  type: kv-v2
  path: keycloak-grafana
  refreshAfter: 60s
  destination:
    name: keycloak-grafana
    create: true
    transformation:
      # No templates: the Secret must carry Vault's own `clientSecret` key
      # verbatim, because the Grafana chart's envValueFrom names it.
      excludeRaw: true
