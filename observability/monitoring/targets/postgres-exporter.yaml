# postgres_exporter, and the least-privilege login it uses. Phase 22.
#
# Reusing the `postgres` superuser already in Vault would have been one line
# and would have handed read-everything to a metrics sidecar. Instead a
# dedicated `exporter` login is granted pg_monitor -- the role PostgreSQL
# provides for exactly this -- and its password is generated in Vault by
# platform/vault/configure-vault.sh.
#
# The role is created by an Argo CD Sync HOOK, not a plain Job: a Job is
# immutable, so re-applying an unchanged one does nothing at all, and a
# changed script would never reach the cluster. BeforeHookCreation deletes
# the previous Job so each sync genuinely re-runs it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-exporter
  namespace: databases
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: postgres-exporter
  namespace: databases
spec:
  # Reuses the VaultConnection PostgreSQL created in this namespace, the
  # way redis does.
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-postgres-exporter
    serviceAccount: postgres-exporter
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: postgres-exporter
  namespace: databases
spec:
  vaultAuthRef: postgres-exporter
  mount: homelab
  type: kv-v2
  path: postgres-exporter
  refreshAfter: 300s
  destination:
    name: postgres-exporter
    create: true
    transformation:
      # No `excludes: [".*"]` here, deliberately, unlike
      # observability/monitoring/config/vault-secrets.yaml. That file's
      # templates RENAME username/password into admin-user/admin-password,
      # so it must drop the source keys or the Secret carries the password
      # twice. This VaultStaticSecret has no templates at all: the Secret
      # must carry Vault's own `username`/`password` keys verbatim, because
      # two consumers read `password` by that exact name -- the role Job
      # above (`EXPORTER_PASSWORD`) and the Deployment below
      # (`DATA_SOURCE_PASS`). Adding `excludes: [".*"]` to "match the other
      # file" would empty this Secret; VSO and Argo CD would both stay
      # green while `pg_up` silently dropped to 0.
      excludeRaw: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-exporter-role
  namespace: databases
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Above the Deployment's default 0 -- a higher wave runs LATER, so this
    # Job creates the role AFTER the Deployment already started, not before
    # it. There is no ordering guarantee here: the exporter comes up, fails
    # to authenticate, and retries until this hook lands. It converges
    # (`pg_up` = 1 confirms it), but only because the Deployment has NO
    # readiness probe, so Argo CD calls wave 0 Healthy immediately and
    # proceeds to wave 1 regardless of whether the exporter can actually
    # log in yet. A connectivity-gated readiness probe added to that
    # Deployment would deadlock this sync: wave 0 would never go Healthy,
    # so this wave-1 Job that creates the role would never run.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  # A Sync hook that never ends stalls the whole Argo CD sync.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        # Selected by the NetworkPolicy in
        # platform/databases/postgres/config/networkpolicy.yaml. This Job
        # predates that policy and had no labels; without this it can no
        # longer reach 5432, and the failure appears at the NEXT sync of
        # monitoring-config, arbitrarily far from the commit that caused it.
        job: postgres-client
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:18.6-alpine
          env:
            - name: PGHOST
              value: postgres.databases.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Idempotent by construction: CREATE ROLE is guarded by a
              # probe, and the ALTER runs unconditionally so a rotated
              # password in Vault reaches the database on the next sync.
              until pg_isready -q; do
                echo "waiting for postgres"; sleep 2
              done
              if psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='exporter'" | grep -q 1; then
                echo "role exporter exists"
              else
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE exporter LOGIN"
                echo "role exporter created"
              fi
              # The password is passed through a psql variable, never
              # interpolated into the SQL text, so it cannot reach a log or
              # the process list.
              #
              # This goes through stdin, not -c: psql does not expand -v
              # variables inside a -c command string, so `-c "... :'pw'"`
              # sends the six literal characters `:'pw'` to the server and
              # fails with a syntax error -- proved against this database,
              # not assumed. Piped via a quoted heredoc, the shell leaves
              # :'pw' untouched and psql itself expands it before sending
              # the statement, which is what -v is for.
              psql -v ON_ERROR_STOP=1 -v pw="$EXPORTER_PASSWORD" <<'SQL'
              ALTER ROLE exporter WITH PASSWORD :'pw';
              SQL
              psql -v ON_ERROR_STOP=1 -c "GRANT pg_monitor TO exporter"
              echo "done"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      serviceAccountName: postgres-exporter
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            - name: DATA_SOURCE_URI
              value: postgres.databases.svc.cluster.local:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: exporter
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter
                  key: password
          ports:
            - name: metrics
              containerPort: 9187
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: databases
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: databases
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
    - port: metrics
      metricRelabelings:
        # BEGIN metric allowlist (scripts/sync_metric_allowlist.py)
        - action: keep
          sourceLabels: [__name__]
          regex: "up|node_cpu_seconds_total|node_load1|node_load5|node_load15\
            |node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes\
            |node_filesystem_(size|avail)_bytes|node_network_(receive\
            |transmit)_bytes_total|node_disk_(read|written)_bytes_total\
            |node_disk_io_time_seconds_total|node_pressure_(cpu|memory\
            |io)_waiting_seconds_total|container_cpu_usage_seconds_total\
            |container_memory_working_set_bytes|container_network_(receive\
            |transmit)_bytes_total|container_oom_events_total\
            |kubelet_volume_stats_(capacity|available)_bytes\
            |kube_pod_status_phase|kube_pod_container_status_restarts_total\
            |kube_pod_container_status_waiting_reason\
            |kube_pod_container_status_last_terminated_reason\
            |kube_pod_container_resource_(requests|limits)\
            |kube_deployment_(spec_replicas|status_replicas_available)\
            |kube_statefulset_(replicas|status_replicas_ready)\
            |kube_daemonset_status_(desired_number_scheduled|number_ready)\
            |kube_node_status_(condition|allocatable|capacity)\
            |kube_persistentvolumeclaim_status_phase|kube_job_status_failed\
            |argocd_app_info|argocd_app_sync_total|vault_core_unsealed|pg_up\
            |pg_database_size_bytes|pg_stat_database_(numbackends|xact_commit\
            |xact_rollback|deadlocks)|redis_up|redis_memory_(used|max)_bytes\
            |redis_connected_clients|redis_(keyspace_hits|keyspace_misses\
            |evicted_keys)_total|keycloak_user_events_total\
            |jvm_memory_used_bytes|traefik_open_connections\
            |traefik_(entrypoint|service)_requests_total|portal_.+\
            |loki_write_(sent_bytes|sent_entries|dropped_entries\
            |dropped_bytes)_total|loki_source_file_files_active_total\
            |prometheus_remote_storage_(samples_failed|samples_dropped\
            |samples_retried)_total\
            |prometheus_remote_storage_(highest_timestamp_in_seconds\
            |queue_highest_sent_timestamp_seconds)"
