# redis_exporter -- Redis has no Prometheus endpoint of its own. Phase 22.
#
# In `databases`, beside what it scrapes, because it mounts that namespace's
# redis-credentials Secret. No new Vault path: that Secret already carries a
# bare `password` key alongside the requirepass.conf template, because a VSO
# transformation template ADDS keys rather than replacing the source ones.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.91.1-alpine
          env:
            - name: REDIS_ADDR
              value: redis://redis.databases.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 59000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: databases
  labels:
    app: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: databases
spec:
  selector:
    matchLabels:
      app: redis-exporter
  endpoints:
    - port: metrics
