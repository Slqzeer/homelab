# TLE dev -- ServiceMonitors. Shipped by `monitoring-config` (wave 24),
# not by the `tle-dev` Application (wave 25): they need the CRDs the
# kube-prometheus-stack chart installs at wave 23. A ServiceMonitor with
# no matching Service yet is valid and simply has no targets until one
# appears. All scrape the in-cluster metrics port (9000), never the
# tailnet Ingress.
#
# No Valkey target: Valkey ships no metrics endpoint without an exporter
# sidecar (deferred to the workload rollout); scraping a dead port would
# only add a permanently red target.
#
# No NATS target either, for the same reason. nats-server's monitor port
# (8222) serves JSON (/varz, /connz), not Prometheus text -- /metrics is a
# 404 -- and the tle-dev-metrics NetworkPolicy only admits port 9000.
# A tle-dev-nats ServiceMonitor existed and was permanently down; removed
# 2026-10-05. Add prometheus-nats-exporter as a sidecar on 9000 (the
# tle-dev-nats Service already maps a `metrics` port there) and restore
# the ServiceMonitor once the TLE services actually use NATS.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tle-dev-edge
  namespace: tle-dev
  labels:
    app: tle-dev-edge
spec:
  selector:
    matchLabels:
      app: tle-dev-edge
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
