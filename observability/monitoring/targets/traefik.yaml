# Traefik's metrics, and the k3s HelmChartConfig that enables them. Phase 22.
#
# Measured on the live cluster before writing this: the Traefik pod already
# runs with --metrics.prometheus=true, --metrics.prometheus.entrypoint=metrics
# and --entryPoints.metrics.address=:9100/tcp, already declares containerPort
# metrics=9100, and scraping http://127.0.0.1:9100/metrics from inside the
# pod returns 6 traefik_* metric families right now. Only the Service side
# is missing -- `kubectl -n kube-system get svc traefik` shows web=80 and
# websecure=443, no metrics. So this HelmChartConfig applies a Service
# mutation, not a pod redeploy: the helm-controller upgrade creates a
# separate `traefik-metrics` Service (ClusterIP, port `metrics` = 9100) and
# leaves the existing `traefik` Service and the pod spec untouched --
# confirmed both by rendering chart 40.1.0 with these values and on the live
# cluster, where `traefik-metrics` now exists and is scraped successfully.
# The payoff is immediate because the endpoint is already live and only
# needed a Service in front of it to be scrapable.
#
# The ServiceMonitor below selects on app.kubernetes.io/name: traefik, which
# matches both Services, but only traefik-metrics has a port named `metrics`
# -- traefik itself exposes web/websecure -- so only traefik-metrics yields
# a target. That's the intended behavior, not a selector bug to "fix".
#
# Deliberately the only thing in this file so that `git revert` of the commit
# that added it is a complete rollback.
#
# Traefik carries NO tailnet traffic today: every published URL here uses
# ingressClassName: tailscale and reaches its backend through a Tailscale
# proxy pod, never through Traefik. What this buys is edge metrics for a path
# nothing currently takes -- which becomes worth having the moment anything
# does.
---
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  # NOT this Application's destination namespace. k3s' helm-controller only
  # reads a HelmChartConfig that sits in the same namespace as the HelmChart
  # it modifies, and k3s puts both in kube-system. Elsewhere it is silently
  # ignored: no error, no metrics, and a green Argo CD.
  namespace: kube-system
spec:
  valuesContent: |-
    metrics:
      prometheus:
        service:
          enabled: true
        entryPoint: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  endpoints:
    - port: metrics
      metricRelabelings:
        # BEGIN metric allowlist (scripts/sync_metric_allowlist.py)
        - action: keep
          sourceLabels: [__name__]
          regex: "up|node_cpu_seconds_total|node_load1|node_load5|node_load15\
            |node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes\
            |node_filesystem_(size|avail)_bytes|node_network_(receive\
            |transmit)_bytes_total|node_disk_(read|written)_bytes_total\
            |node_disk_io_time_seconds_total|node_pressure_(cpu|memory\
            |io)_waiting_seconds_total|container_cpu_usage_seconds_total\
            |container_memory_working_set_bytes|container_network_(receive\
            |transmit)_bytes_total|container_oom_events_total\
            |kubelet_volume_stats_(capacity|available)_bytes\
            |kube_pod_status_phase|kube_pod_container_status_restarts_total\
            |kube_pod_container_status_waiting_reason\
            |kube_pod_container_status_last_terminated_reason\
            |kube_pod_container_resource_(requests|limits)\
            |kube_deployment_(spec_replicas|status_replicas_available)\
            |kube_statefulset_(replicas|status_replicas_ready)\
            |kube_daemonset_status_(desired_number_scheduled|number_ready)\
            |kube_node_status_(condition|allocatable|capacity)\
            |kube_persistentvolumeclaim_status_phase|kube_job_status_failed\
            |argocd_app_info|argocd_app_sync_total|vault_core_unsealed|pg_up\
            |pg_database_size_bytes|pg_stat_database_(numbackends|xact_commit\
            |xact_rollback|deadlocks)|redis_up|redis_memory_(used|max)_bytes\
            |redis_connected_clients|redis_(keyspace_hits|keyspace_misses\
            |evicted_keys)_total|keycloak_user_events_total\
            |jvm_memory_used_bytes|traefik_open_connections\
            |traefik_(entrypoint|service)_requests_total|portal_.+\
            |loki_write_(sent_bytes|sent_entries|dropped_entries\
            |dropped_bytes)_total|loki_source_file_files_active_total\
            |prometheus_remote_storage_(samples_failed|samples_dropped\
            |samples_retried)_total\
            |prometheus_remote_storage_(highest_timestamp_in_seconds\
            |queue_highest_sent_timestamp_seconds)"
