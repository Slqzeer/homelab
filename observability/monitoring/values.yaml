# kube-prometheus-stack -- workstation-plan phases 22 and 23 in one release.
# Chart: prometheus-community/kube-prometheus-stack 91.4.1
#        (prometheus-operator v0.94.0, Grafana subchart 13.2.5)
# Repo:  https://prometheus-community.github.io/helm-charts
#
# Design: docs/superpowers/specs/2026-09-18-monitoring-stack-design.md
#
# Two things here are not defaults and will look wrong to anyone who has run
# this chart elsewhere: Alertmanager is off, and four control-plane scrapers
# are off. Both are argued in the spec, sections 3.1 and 7. Do not "restore"
# them without reading it.

# Decision P3. No notification destination exists, and a router with nowhere
# to route is infrastructure with no consumer. The stack's ~30 default alert
# RULES still load and evaluate in Prometheus -- only delivery is absent.
alertmanager:
  enabled: false

# Decision P6. On k3s these four run as goroutines inside one `k3s server`
# process with their metrics bound to 127.0.0.1. Left enabled they are four
# permanently red targets, and a monitoring system whose own dashboard is
# broken teaches you to ignore it. Turning them on needs
# --kube-scheduler-arg=bind-address=0.0.0.0 and three siblings in the k3s
# systemd unit: a host-root edit, so an operator hand-off, deliberately not
# taken on a single-node cluster with one etcd member.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Cardinality. Measured 2026-10-05: 129k head series, Prometheus at ~800Mi.
# The kubelet and apiserver jobs held 104k of them, and 85k of those were
# read by no rule and no dashboard.
#
# k3s runs the apiserver, etcd (kine), scheduler and controllers in the SAME
# process as the kubelet, with one shared metrics registry. The kubelet's
# /metrics endpoint therefore re-exports the whole control plane, and every
# apiserver_*/etcd_*/workqueue_* series was scraped twice: once here and once
# by the apiserver job. No rule or dashboard selects those families with
# job="kubelet" (checked against every PrometheusRule and Grafana dashboard
# ConfigMap), so they are dropped on the kubelet's /metrics endpoint only.
# rest_client_*, go_*, process_* and storage_* stay: the kubelet dashboard
# reads its own copies of those.
#
# Setting metricRelabelings REPLACES the chart's defaults, so each list
# starts with the chart 91.4.1 default verbatim. Re-check them on upgrade.
kubelet:
  serviceMonitor:
    metricRelabelings:
      # chart default
      - action: drop
        sourceLabels: [__name__, le]
        regex: "(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|\
          600)(\\.0)?"
      # k3s control-plane duplicates, ~53k series
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|kine|lasso|scheduler|workqueue)_.*

# The apiserver job keeps everything the stack's rules and dashboards use
# (the apiserver_request_sli_* SLO histograms, apiserver_request_total and
# friends). Dropped: the large *_bucket histograms nothing references, about
# 23k series. Their _sum and _count stay, so rates and averages still work;
# only quantiles over these specific histograms are lost.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # chart default
      - action: drop
        sourceLabels: [__name__, le]
        regex: "(etcd_request|apiserver_request_slo|apiserver_request_sli|\
          apiserver_request)_duration_seconds_bucket;(0\\.15|0\\.2|0\\.3|0\\.35|0\\.4|0\\.45\
          |0\\.6|0\\.7|0\\.8|0\\.9|1\\.25|1\\.5|1\\.75|2|3|3\\.5|4|4\\.5|6|7|8|9|15|20|40|45\
          |50)(\\.0)?"
      # unreferenced histograms
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver_request_duration_seconds|apiserver_request_body_size_bytes|\
          etcd_request_duration_seconds|apiserver_watch_list_duration_seconds|\
          apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|\
          apiserver_watch_events_sizes|workqueue_work_duration_seconds|\
          scheduler_plugin_execution_duration_seconds|kine_sql_time_seconds|\
          apiserver_admission_controller_admission_duration_seconds|\
          apiserver_flowcontrol_request_execution_seconds|\
          scheduler_event_handling_duration_seconds|lasso_controller_reconcile_time_seconds|\
          apiserver_flowcontrol_priority_level_request_utilization|\
          scheduler_framework_extension_point_duration_seconds)_bucket"

defaultRules:
  # Disabling the scrapers above without disabling their rules leaves alerts
  # that reference series nothing produces. The same is true of Alertmanager
  # itself: its own rules select job="monitoring-kube-prometheus-alertmanager",
  # a job that alertmanager.enabled: false above ensures never exists -- that
  # toggle does not gate these rules, so it is disabled separately below.
  # These six keys are the exact ones chart 91.4.1 exposes for the above --
  # scheduler rules are split across two keys and there is no
  # kubernetesSystemScheduler key.
  #
  # A third instance of the same trap, found FIRING on 2026-09-19: the
  # `defaultRules.rules.prometheus` group carries
  # PrometheusNotConnectedToAlertmanagers, which watches
  # prometheus_notifications_alertmanagers_discovered. With alertmanager.
  # enabled: false above, that gauge is a hard zero forever -- not
  # intermittent, not rate-based, structurally zero -- so the alert cannot
  # ever resolve. Verified: `ALERTS` returns exactly two series, `Watchdog`
  # (by design) and this one, both firing. The rest of the `prometheus`
  # group -- roughly 25 rules covering scrape health, rule-evaluation
  # failures, TSDB and config-reload state -- is genuinely useful on this
  # single Prometheus and stays on, so the fix is the chart's per-rule
  # escape hatch, not `rules.prometheus: false`. Its two siblings,
  # PrometheusErrorSendingAlertsToSomeAlertmanager and
  # ...ToAnyAlertmanager, are rate() based and confirmed inactive (no
  # samples), so they are left alone.
  disabled:
    PrometheusNotConnectedToAlertmanagers: true
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  # Verified on the live Prometheus pod: init-config-reloader and the
  # config-reloader sidecar both carry `{}` -- prometheusConfigReloader.
  # resources has no chart default. Both containers share the pod with
  # Prometheus, which has its own 2Gi limit; an unbounded sidecar can push
  # total pod usage past that budget while `kubectl top pod` still reports a
  # plausible-looking figure for the pod as a whole -- exactly how Task 10's
  # Grafana OOMKill hid behind a 408Mi pod total. This key sets resources for
  # both the init container and the sidecar at once; there is no separate
  # key for each. Applying it restarts the Prometheus pod, which this phase
  # already proved is safe on this PV -- history survives (see README,
  # "The five scrape targets").
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

prometheus:
  prometheusSpec:
    # 30s rather than the chart's default (unset, which resolves to 30s in
    # the operator) -- stated explicitly so a future chart default cannot
    # silently halve the sample rate and double the memory.
    scrapeInterval: 30s

    # Spec section 5.1. The SIZE cap is the one that protects the node;
    # retention by time alone does not bound disk, and disk pressure here
    # evicts pods. 12GiB against a 20Gi volume leaves room for the WAL and
    # for compaction, which retentionSize does not govern.
    retention: 15d
    retentionSize: 12GiB

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        # Exceeding this is an OOMKill that loses the write-ahead log, which
        # is why retentionSize exists above.
        memory: 2Gi

    # Discover ServiceMonitors in every namespace, not only this one. The
    # targets in observability/monitoring/targets/ live in argocd, vault,
    # kube-system and databases. Without these four lines the operator
    # applies a release-label selector and finds none of them -- Prometheus
    # comes up healthy and scrapes nothing, which is the failure mode this
    # chart is most often misconfigured into.
    #
    # probeSelectorNilUsesHelmValues and scrapeConfigSelectorNilUsesHelmValues
    # below close the same hole for Probe and ScrapeConfig objects. Chart
    # 91.4.1's values.yaml carries both (lines 4714 and 4739), defaulting
    # true -- this repo does not currently ship a Probe or ScrapeConfig, but
    # setting them now means all six CRD selectors behave identically, and a
    # future one is picked up the same way a ServiceMonitor already is
    # rather than silently dropped on the operator's default
    # release-scoped label.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # local-path does not enforce capacity -- a PV is a directory
              # on /srv, which has 850G free. Nominal, not a quota. The real
              # bound is retentionSize above.
              storage: 20Gi

grafana:
  # Decision P4. NO PVC. /var/lib/grafana is an emptyDir and the SQLite
  # database is discarded on every restart.
  #
  # THIS MEANS A DASHBOARD EDITED IN THE UI IS LOST ON RESTART. That is the
  # design, not a defect: plan section 26 asks that the configuration be
  # declarative and versioned in git, and a PVC would quietly make the
  # cluster authoritative over git instead. Anything that must survive is
  # provisioned from a file. See this directory's README.
  persistence:
    enabled: false

  # The admin credential comes from Vault via VSO -- see config/
  # vault-secrets.yaml. The two key names below are the chart's defaults and
  # are restated because the VaultStaticSecret must produce exactly these.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Roughly 25 dashboards shipped as ConfigMaps: nodes, pods, namespaces,
  # workloads, kubelet, PV usage. They cover plan section 25's "CPU / RAM /
  # nodes / pods / Kubernetes" list outright, which is why this phase adds
  # no dashboards of its own (decision P7).
  defaultDashboardsEnabled: true

  sidecar:
    dashboards:
      # Label discovery stays on, so a future dashboard is one ConfigMap
      # labelled grafana_dashboard: "1" and nothing else.
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      # The stack provisions the Prometheus datasource itself. This phase
      # writes no datasource manifest.
      enabled: true
      defaultDatasourceEnabled: true
      # The chart's default here is true and is NOT gated by
      # alertmanager.enabled: false above -- the same oversight the
      # defaultRules.rules.alertmanager comment already caught, in the
      # other place this chart makes it. Left on, this provisions a
      # datasource at http://monitoring-kube-prometheus-alertmanager
      # .monitoring:9093/, a Service that does not exist because P3
      # disables Alertmanager. Verified 2026-09-19:
      # `kubectl get svc monitoring-kube-prometheus-alertmanager` ->
      # NotFound. Grafana loads with a datasource pointing at nothing.
      alertmanager:
        enabled: false

    # Measured 2026-09-19: grafana-sc-dashboard at 79Mi, grafana-sc-datasources
    # at 77Mi, with no limit on either -- the chart's default here is `{}`,
    # not a value this phase ever set. That is the same defect class as an
    # Ingress without the tailscale.com/proxy-group annotation, which gets
    # a dedicated proxy pod with the chart default resources: {} -- how
    # this host lost CoreDNS once.
    # Limits below leave roughly 2x headroom over the measured figures;
    # memory-only, no CPU limit, matching every other limits: block in this
    # repository.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 160Mi

  # Phase 25. Grafana is this homelab's first real OIDC client -- the canary
  # for the whole identity plane, chosen because it is the safest place to
  # be wrong: the admin form below stays enabled, Grafana has no PVC, and
  # nothing else depends on a Grafana login.
  grafana.ini:
    server:
      # REQUIRED, not cosmetic. Grafana builds its OIDC redirect_uri from
      # root_url. Without it, it derives one from the request Host header
      # and produces an http:// URI that Keycloak rejects as a redirect
      # mismatch -- an error naming the URI but never the missing setting.
      root_url: https://grafana.taildf6cd4.ts.net
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      # The `groups` scope is what carries group membership into the token.
      # Drop it and role_attribute_path below silently matches nothing.
      scopes: openid profile email groups
      # The browser follows auth_url, so it must use the tailnet hostname.
      # token_url and api_url are Grafana back-channels: cluster DNS cannot
      # resolve Tailscale MagicDNS names, so those use Keycloak's Service.
      auth_url: https://keycloak.taildf6cd4.ts.net/realms/homelab/protocol/openid-connect/auth
      token_url: "http://keycloak.keycloak.svc.cluster.local:8080/realms\
        /homelab/protocol/openid-connect/token"
      api_url: "http://keycloak.keycloak.svc.cluster.local:8080/realms\
        /homelab/protocol/openid-connect/userinfo"
      role_attribute_path: contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'
      # false so a user in neither group lands as Viewer rather than being
      # refused outright.
      role_attribute_strict: false
      # The Grafana SERVER admin role stays reachable only through the local
      # account, which is what keeps this canary abandonable.
      allow_assign_grafana_admin: false

  # The client secret arrives as an env var, not in grafana.ini: an env var
  # overrides the ini file and keeps the secret out of the rendered
  # ConfigMap, where `kubectl get configmap -o yaml` and every Argo CD
  # resource view would otherwise show it.
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: keycloak-grafana
        key: clientSecret

  # NOT SET, deliberately: auth.disable_login_form. The local admin form,
  # backed by homelab/grafana in Vault since phase 23, is the fallback that
  # makes an OIDC misconfiguration recoverable instead of a lockout.

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # Measured 2026-09-19: the grafana container was OOMKilled at the
      # previous 256Mi limit (lastState reason=OOMKilled, exitCode=137) and
      # now runs at 252Mi steady state against that same 256Mi -- 98%, no
      # margin. The mechanism is P4: no PVC means every restart is a cold
      # start that rebuilds SQLite from scratch and re-provisions all 24
      # dashboards from ConfigMaps in one burst, and that burst is the
      # memory peak. So statelessness guarantees a spike on exactly the
      # event the limit is most likely to kill it on, which can loop. Raised
      # to 512Mi; the node has room (limits at 66%, 4Gi available).
      memory: 512Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
