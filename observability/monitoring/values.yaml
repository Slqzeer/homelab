# kube-prometheus-stack -- workstation-plan phases 22 and 23 in one release.
# Chart: prometheus-community/kube-prometheus-stack 91.4.1
#        (prometheus-operator v0.94.0, Grafana subchart 13.2.5)
# Repo:  https://prometheus-community.github.io/helm-charts
#
# Design: docs/superpowers/specs/2026-09-18-monitoring-stack-design.md
#
# Two things here are not defaults and will look wrong to anyone who has run
# this chart elsewhere: Alertmanager is off, and four control-plane scrapers
# are off. Both are argued in the spec, sections 3.1 and 7. Do not "restore"
# them without reading it.
#
# GRAFANA CLOUD (2026-10-05). Storage, queries, dashboards and alerting live
# in Grafana Cloud, not here: Prometheus runs in AGENT MODE (scrape and
# remote_write only, no TSDB, no rules, no UI) and the Grafana subchart is
# off. The operator stays, so every ServiceMonitor in
# observability/monitoring/targets/ keeps working unchanged. What reaches the
# cloud is an ALLOWLIST (remoteWrite below), sized to the free tier's
# ~10k active series: 1.3k measured against the old local TSDB. See
# observability/monitoring/README.md, "Grafana Cloud".

# Decision P3. No notification destination exists here; alerting, when it
# is set up, belongs to Grafana Cloud, which evaluates rules against the
# series this agent ships.
alertmanager:
  enabled: false

# Decision P6. On k3s these four run as goroutines inside one `k3s server`
# process with their metrics bound to 127.0.0.1. Left enabled they are four
# permanently red targets, and a monitoring system whose own dashboard is
# broken teaches you to ignore it. Turning them on needs
# --kube-scheduler-arg=bind-address=0.0.0.0 and three siblings in the k3s
# systemd unit: a host-root edit, so an operator hand-off, deliberately not
# taken on a single-node cluster with one etcd member.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# THE METRIC ALLOWLIST, applied at SCRAPE time on every endpoint.
#
# Defined once here as the YAML anchor &metricAllowlist and reused by alias
# (*metricAllowlist) on every chart ServiceMonitor below and on the
# remote_write. ServiceMonitors in observability/monitoring/targets/ are
# separate manifests and cannot use the alias, so they carry a verbatim copy;
# tests/test_metric_allowlist.py fails CI if any copy differs from this one.
#
# Why at scrape and not only on remote_write: an agent holds every series it
# scrapes in its WAL, shipped or not. Measured 2026-10-05: 24k series scraped
# for 1.3k shipped, agent heap ~250MB and climbing. Dropping at scrape keeps
# only what is shipped. `up` and the other scrape_* series are synthetic and
# are never affected by metric relabelling.
#
# To add a metric: check its cardinality, add its NAME here, done -- every
# alias follows. Never widen it to a job or namespace wildcard: it is the only
# thing between this cluster and the Grafana Cloud free-tier series cap.
#
# Setting a metricRelabelings list REPLACES the chart's defaults. The kubelet
# and cAdvisor defaults that could still match an allowlisted name are kept
# below the keep; the rest only dropped names the keep now drops anyway.
kubelet:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: &metricAllowlist "up|node_cpu_seconds_total|node_load1|node_load5|node_load15\
          |node_memory_(MemTotal|MemAvailable|SwapTotal|SwapFree)_bytes\
          |node_filesystem_(size|avail)_bytes|node_network_(receive\
          |transmit)_bytes_total|node_disk_(read|written)_bytes_total\
          |node_disk_io_time_seconds_total|node_pressure_(cpu|memory\
          |io)_waiting_seconds_total|container_cpu_usage_seconds_total\
          |container_memory_working_set_bytes|container_network_(receive\
          |transmit)_bytes_total|container_oom_events_total\
          |kubelet_volume_stats_(capacity|available)_bytes\
          |kube_pod_status_phase|kube_pod_container_status_restarts_total\
          |kube_pod_container_status_waiting_reason\
          |kube_pod_container_status_last_terminated_reason\
          |kube_pod_container_resource_(requests|limits)\
          |kube_deployment_(spec_replicas|status_replicas_available)\
          |kube_statefulset_(replicas|status_replicas_ready)\
          |kube_daemonset_status_(desired_number_scheduled|number_ready)\
          |kube_node_status_(condition|allocatable|capacity)\
          |kube_persistentvolumeclaim_status_phase|kube_job_status_failed\
          |argocd_app_info|argocd_app_sync_total|vault_core_unsealed|pg_up\
          |pg_database_size_bytes|pg_stat_database_(numbackends|xact_commit\
          |xact_rollback|deadlocks)|redis_up|redis_memory_(used|max)_bytes\
          |redis_connected_clients|redis_(keyspace_hits|keyspace_misses\
          |evicted_keys)_total|keycloak_user_events_total\
          |jvm_memory_used_bytes|traefik_open_connections\
          |traefik_(entrypoint|service)_requests_total|portal_.+\
          |loki_write_(sent_bytes|sent_entries|dropped_entries|dropped_bytes)_total\
          |loki_source_file_files_active_total\
          |prometheus_remote_storage_(samples_failed|samples_dropped\
          |samples_retried)_total\
          |prometheus_remote_storage_(highest_timestamp_in_seconds\
          |queue_highest_sent_timestamp_seconds)"
    probesMetricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: *metricAllowlist
    cAdvisorMetricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: *metricAllowlist
      # chart 91.4.1 defaults that can still match allowlisted container_*:
      # network series of CNI-side interfaces, and cgroups with no pod.
      - action: drop
        sourceLabels: [__name__, interface]
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - action: drop
        sourceLabels: [id, pod]
        regex: '.+;'

coreDns:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: *metricAllowlist

# Not scraped. The apiserver job was 13.5k series, the largest single job,
# and none of it is in the remote_write allowlist below. An agent still pays
# memory for every series it scrapes, even the ones it never ships.
kubeApiServer:
  enabled: false

# An agent evaluates no rules, so PrometheusRule objects would be inert
# config. Grafana Cloud alerting replaces them.
defaultRules:
  create: false

prometheusOperator:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: *metricAllowlist
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  # Verified on the live Prometheus pod: init-config-reloader and the
  # config-reloader sidecar both carry `{}` -- prometheusConfigReloader.
  # resources has no chart default. Both containers share the pod with
  # Prometheus, which has its own limit; an unbounded sidecar can push
  # total pod usage past that budget while `kubectl top pod` still reports a
  # plausible-looking figure for the pod as a whole -- exactly how Task 10's
  # Grafana OOMKill hid behind a 408Mi pod total. This key sets resources for
  # both the init container and the sidecar at once; there is no separate
  # key for each.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

prometheus:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: *metricAllowlist
  # Scrape and remote_write only. The chart renders a PrometheusAgent instead
  # of a Prometheus, and its pods carry app.kubernetes.io/name=prometheus-agent
  # (operator v0.94.0) -- the NetworkPolicies that admit the scraper select
  # that value, not `prometheus`.
  agentMode: true
  prometheusSpec:
    # 30s rather than the chart's default (unset, which resolves to 30s in
    # the operator) -- stated explicitly so a future chart default cannot
    # silently halve the sample rate and double the memory.
    scrapeInterval: 30s

    # Measured locally at ~560Mi as a full server with 47k series. As an
    # agent it holds only the WAL of samples not yet acknowledged by Grafana
    # Cloud. 512Mi leaves room for a backlog after a network outage.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Distinguishes this cluster's series in Grafana Cloud. The Kubernetes
    # Monitoring app in Grafana Cloud groups by this label.
    externalLabels:
      cluster: homelab

    # Discover ServiceMonitors in every namespace, not only this one. The
    # targets in observability/monitoring/targets/ live in argocd, vault,
    # kube-system and databases. Without these four lines the operator
    # applies a release-label selector and finds none of them -- Prometheus
    # comes up healthy and scrapes nothing, which is the failure mode this
    # chart is most often misconfigured into.
    #
    # probeSelectorNilUsesHelmValues and scrapeConfigSelectorNilUsesHelmValues
    # below close the same hole for Probe and ScrapeConfig objects. Chart
    # 91.4.1's values.yaml carries both (lines 4714 and 4739), defaulting
    # true -- this repo does not currently ship a Probe or ScrapeConfig, but
    # setting them now means all six CRD selectors behave identically, and a
    # future one is picked up the same way a ServiceMonitor already is
    # rather than silently dropped on the operator's default
    # release-scoped label.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    # Credentials: Secret `grafana-cloud` in this namespace, written by VSO
    # from Vault path homelab/grafana-cloud (observability/monitoring/config/
    # vault-secrets.yaml). The URL is not secret and lives here.
    #
    # The keep below is the same &metricAllowlist anchor defined at the
    # kubelet block: with every scrape already filtered it is a backstop, and
    # the guard for any future ServiceMonitor that forgets its own keep.
    remoteWrite:
      - name: grafana-cloud
        # The stack's Prometheus remote_write endpoint, from grafana.com ->
        # My Account -> stack -> Prometheus -> Details.
        url: https://prometheus-prod-58-prod-eu-central-0.grafana.net/api/prom/push
        basicAuth:
          username:
            name: grafana-cloud
            key: username
          password:
            name: grafana-cloud
            key: password
        writeRelabelConfigs:
          - action: keep
            sourceLabels: [__name__]
            regex: *metricAllowlist

# Dashboards and Explore are in Grafana Cloud. Login there is a grafana.com
# account, not Keycloak.
grafana:
  enabled: false

kube-state-metrics:
  prometheus:
    monitor:
      http:
        metricRelabelings:
          - action: keep
            sourceLabels: [__name__]
            regex: *metricAllowlist
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  prometheus:
    monitor:
      metricRelabelings:
        - action: keep
          sourceLabels: [__name__]
          regex: *metricAllowlist
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
