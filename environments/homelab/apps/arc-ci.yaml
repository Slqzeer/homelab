# Runner scale set `ci` (platform/arc/ci/values.yaml). Workflows select it
# with `runs-on: ci`. Runners scale from zero; every job gets a fresh
# ephemeral pod on the dedicated runner node.
#
# Wave 26: needs its config Application (25) and the controller (24).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-ci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: ci
        valueFiles:
          - $values/platform/arc/ci/values.yaml
    - repoURL: git@github.com:Slqzeer/homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
