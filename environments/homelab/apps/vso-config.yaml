# The Vault -> Kubernetes Secret path: ServiceAccount, VaultConnection,
# VaultAuth, VaultStaticSecret.
#
# Wave 22 -- AFTER both ingress-config and its own operator, vso-operator,
# which share wave 21 (see environments/homelab/apps/vso-operator.yaml). A
# VaultStaticSecret only becomes Healthy once Vault holds the KV mount, the
# policy and the role, and those come from a script a human runs
# (platform/vault/configure-vault.sh). At an earlier wave this Application
# would gate wave 21, so a rebuild where someone unsealed Vault but forgot
# the script would silently kill every tailnet URL, with nothing naming the
# script as the cause.
#
# That is the failure phase 16 removed by moving ingress to wave 21.
# Re-introducing it one phase later would be an unforced error, and nothing
# consumes the canary, so the late placement costs nothing.
#
# Wave 22 is now the floor for anything that depends on Vault being
# configured, not just unsealed. Any future Application placed at wave 22
# or later inherits a dependency on a human having run
# platform/vault/configure-vault.sh -- the same way everything from wave 21
# on already depends on the unseal ceremony.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vso-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: default
  source:
    repoURL: git@github.com:Slqzeer/homelab.git
    targetRevision: main
    path: platform/vault-secrets-operator/config
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
