# Grafana Alloy -- workstation-plan phase 24, the log collector.
#
# Ships pod logs to Grafana Cloud Loki; there is no in-cluster log store.
#
# Wave 23: at or above 22, the floor vso-config.yaml establishes for anything
# that depends on a human having run platform/vault/configure-vault.sh -- the
# Grafana Cloud credential does. It needs no CRD -- crds.create is false in
# its values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        # Pinned deliberately: it prefixes every object the chart creates, and the ServiceMonitor in
        # observability/monitoring/targets/alloy.yaml selects the resulting
        # Service `alloy` by name.
        releaseName: alloy
        valueFiles:
          - $values/observability/logging/alloy/values.yaml
    - repoURL: git@github.com:Slqzeer/homelab.git
      targetRevision: main
      ref: values
    # The Grafana Cloud credential is not part of the chart. path is
    # .../alloy/config -- NOT .../alloy, which also holds values.yaml, and a
    # Helm values file has no kind. Same split as observability/monitoring/
    # config.
    - repoURL: git@github.com:Slqzeer/homelab.git
      targetRevision: main
      path: observability/logging/alloy/config
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
