# HashiCorp Vault, the homelab secret store.
#
# Wave 10 -- the platform tier. Nothing at an earlier wave depends on it,
# and ingress-config now sits at wave 21 precisely so that ingress health
# cannot block this Application from syncing.
#
# Vault requires a hand-created Secret `vault-unseal-keys` in this namespace
# before it can auto-unseal. That Secret exists only in the cluster and in
# no repository -- see platform/vault/README.md for the init ceremony.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.34.1
      helm:
        releaseName: vault
        valueFiles:
          - $values/platform/vault/values.yaml
    - repoURL: git@github.com:Slqzeer/homelab.git
      targetRevision: main
      ref: values
    # The unsealer is NOT part of the chart, so it needs a source of its own.
    # Without this the manifest sits in git and is applied by nothing: the
    # Application reported Synced/Healthy while Vault stayed sealed forever,
    # because Argo CD only ever knew about the chart.
    #
    # path is platform/vault/config -- NOT platform/vault, which also holds
    # values.yaml. Every YAML under a directory `path` is applied as a
    # Kubernetes manifest, and a Helm values file has no kind. Same split, and
    # the same reason, as infrastructure/ingress/config.
    #
    # It stays a source of this Application rather than an Application of its
    # own so that Vault and the helper that unseals it cannot be deleted
    # independently of each other.
    - repoURL: git@github.com:Slqzeer/homelab.git
      targetRevision: main
      path: platform/vault/config
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
