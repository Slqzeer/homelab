apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
    homelab.io/onboarding-contract: v1
    homelab.io/owner: personal-applications
    homelab.io/state: stateless
    homelab.io/image-tag: "1.30.5-alpine"
    homelab.io/image-digest: >-
      sha256:15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3
spec:
  project: default
  source:
    repoURL: git@github.com:Slqzeer/homelab.git
    targetRevision: main
    path: apps/hermes-dashboard/config
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
