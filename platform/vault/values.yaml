# HashiCorp Vault -- the homelab secret store.
# Chart: hashicorp/vault 0.34.1 (Vault 2.0.4)
# Repo:  https://helm.releases.hashicorp.com
#
# Single replica with Raft integrated storage. Raft rather than the simpler
# `file` backend because only Raft has a native snapshot API
# (`vault operator raft snapshot save`) that produces a consistent backup
# from a running Vault; the workstation plan requires Vault snapshots in
# /backups/vault. With `file` you would be copying a live directory.
#
# Vault comes up SEALED and UNINITIALIZED. Its readiness probe fails until
# the init ceremony runs -- see platform/vault/README.md. That is expected.

# Phase 17 uses the Vault Secrets Operator, not the Agent Injector. The
# chart enables the injector by default via its "-" sentinel, so it must be
# turned off explicitly or it adds a Deployment nothing here uses.
injector:
  enabled: false

csi:
  enabled: false

ui:
  enabled: true

server:
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      # Phase 22. Vault's /v1/sys/metrics requires a token unless the
      # listener says otherwise, and the alternative to this stanza is a
      # Prometheus token whose renewal is a new failure mode -- to protect
      # an endpoint that exposes operational counters and seal status, not
      # secrets, on a ClusterIP reachable only from inside this cluster.
      # Decision P16 in the phase-22 spec.
      #
      # THIS IS chart 0.34.1's default config with three changes: the
      # telemetry stanza in the listener block uncommented, a top-level
      # telemetry block added, and the commented Vault Enterprise
      # redundancy-zone lines under storage "raft" omitted (irrelevant to
      # this single-node OSS deployment).
      # Overriding this key means OWNING the whole HCL: when the chart is
      # bumped, diff this against the new default before assuming it still
      # matches. `helm show values hashicorp/vault --version <v>` prints it.
      #
      # Changing this restarts Vault, which reseals it. That is safe here
      # and only here, because platform/vault/config/unsealer.yaml unseals
      # it automatically from the in-cluster key Secret.
      config: |
        ui = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        storage "raft" {
          path = "/vault/data"
        }

        service_registration "kubernetes" {}

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

  dataStorage:
    enabled: true
    size: 5Gi
    # local-path does not enforce capacity -- a PV is a directory on /srv,
    # which has 853G free. This size is nominal, not a quota.
    storageClass: local-path

  # No audit device yet; nothing consumes Vault until phase 17.
  auditStorage:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
