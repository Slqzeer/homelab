# Allowlisting egress proxy (Squid). The ONE place in the cluster with broad
# internet egress (TCP 443), compensated by an L7 domain allowlist. Clients
# (OmniRoute today) may reach only this proxy, never the internet directly,
# which is what lets them keep the onboarding contract's no-0.0.0.0/0 rule.
#
# Image: Canonical ubuntu/squid 6.6 on Ubuntu 24.04 LTS, tag + digest pinned.
# Its entrypoint expects root; this runs squid directly as `proxy` (UID 13).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-proxy
  namespace: egress
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: egress
  labels:
    app: egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
      annotations:
        # Bump with every configmap.yaml change: plain manifests have no
        # content hash, so this is what rolls the pod onto the new config.
        egress-proxy.homelab.io/config-revision: "4"
    spec:
      serviceAccountName: egress-proxy
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squid
          image: "docker.io/ubuntu/squid:6.6-24.04_beta@sha256:\
            6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029"
          command: ["squid"]
          args: ["-f", "/etc/squid-conf/squid.conf", "-N", "-d", "1"]
          ports:
            - name: proxy
              containerPort: 3128
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 30
          volumeMounts:
            - {name: conf, mountPath: /etc/squid-conf, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap:
            name: egress-proxy
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: egress
  labels:
    app: egress-proxy
spec:
  selector:
    app: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
