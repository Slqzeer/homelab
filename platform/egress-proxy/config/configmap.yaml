# Squid configuration and destination allowlist for the egress proxy.
#
# Editing either key does NOT restart the proxy by itself (plain manifests,
# no kustomize hash): bump egress-proxy.homelab.io/config-revision in
# egress-proxy.yaml in the same commit so the pod rolls.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy
  namespace: egress
data:
  squid.conf: |
    # Allowlisting HTTPS egress proxy. Forwards only CONNECT to port 443 of
    # domains in allowed-domains.txt. No caching, no TLS interception: the proxy
    # sees destination hostnames, never request bodies or credentials.
    #
    # Runs as the unprivileged `proxy` user (UID 13) on a read-only root
    # filesystem, so everything writable points at /tmp and logs go to stdio.
    http_port 3128
    # No PID file: /tmp is an emptyDir that survives container restarts, and a
    # stale file naming PID 1 makes the next start refuse to run.
    pid_filename none
    # The ICMP pinger helper needs raw sockets (CAP_NET_RAW, dropped).
    pinger_enable off
    # Squid sizes per-descriptor tables to the open-files ulimit, which the
    # container inherits from containerd (524288): that alone exceeds the
    # 128Mi limit and gets OOMKilled at startup. 4096 is plenty for one client.
    max_filedescriptors 4096
    coredump_dir /tmp
    cache deny all
    cache_mem 8 MB
    netdb_filename none
    access_log stdio:/dev/stdout
    cache_log /dev/stderr
    cache_store_log none
    logfile_rotate 0
    via off
    forwarded_for delete
    httpd_suppress_version_string on

    acl SSL_ports port 443
    acl CONNECT method CONNECT
    acl allowed_domains dstdomain "/etc/squid-conf/allowed-domains.txt"

    http_access deny !CONNECT
    http_access deny CONNECT !SSL_ports
    http_access allow CONNECT allowed_domains
    http_access deny all
  allowed-domains.txt: |
    # HTTPS destinations the egress proxy will CONNECT to. Squid dstdomain syntax:
    # a leading dot matches the domain and all subdomains. Do not list a host that
    # a dotted entry above already covers (Squid rejects overlapping entries).
    #
    # Add a provider: append its API (+ OAuth token) hosts, bump
    # config-revision in egress-proxy.yaml, push. A blocked host shows up as
    # TCP_DENIED/403 in `kubectl -n egress logs deploy/egress-proxy`.

    # Anthropic (claude)
    .anthropic.com
    .claude.ai
    .claude.com
    # OpenAI (codex)
    .openai.com
    .chatgpt.com
    # Google (gemini, antigravity/agy cloudcode, OAuth refresh)
    .googleapis.com
    accounts.google.com
    gemini.google.com
    # DeepSeek
    .deepseek.com
    # Moonshot / Kimi
    .kimi.com
    .kimi.ai
    .moonshot.ai
    .moonshot.cn
    # xAI (grok-cli)
    .x.ai
    .grok.com
    # GitHub Copilot
    api.github.com
    github.com
    .githubcopilot.com
    # Amazon Q / Kiro
    codewhisperer.us-east-1.amazonaws.com
    oidc.us-east-1.amazonaws.com
    q.us-east-1.amazonaws.com
    .kiro.dev
    # Cline
    .cline.bot
    # LMArena
    .arena.ai
    .lmarena.ai
    # OpenCode
    .opencode.ai
    # Model catalog / pricing metadata used by OmniRoute's auto-routing.
    # raw.githubusercontent.com: pricing sync (src/lib/pricingSync.ts), which
    # cost-aware routing depends on. Deliberately NOT allowed: aihorde.net
    # (keyless free provider OmniRoute probes) and registry.npmjs.org
    # (self-update check; the image is pinned by digest).
    models.dev
    openrouter.ai
    raw.githubusercontent.com
