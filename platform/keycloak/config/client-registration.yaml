# Reconcile only the explicitly allowlisted personal-application clients.
# This PostSync hook runs after Keycloak becomes healthy and is safe to rerun.
# Each allowlist entry carries its own origin and OIDC callback path; they
# are per-entry arguments, never constants inside reconcile_client.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-client-registration
  namespace: keycloak
data:
  reconcile.sh: |
    #!/bin/sh
    set -eu
    KCADM=/opt/keycloak/bin/kcadm.sh
    JQ=/tools/jq

    : "${KC_ADMIN_USERNAME:?missing admin username}"
    : "${KC_CLI_PASSWORD:?missing admin password}"
    : "${PORTAL_CLIENT_SECRET:?missing portal client secret}"
    : "${TLE_ADMIN_DEV_CLIENT_SECRET:?missing TLE admin dev client secret}"
    : "${TLE_ADMIN_PROD_CLIENT_SECRET:?missing TLE admin prod client secret}"
    # PENPOT_CLIENT_SECRET is optional on purpose. Its Secret is projected by
    # the penpot Application (sync wave 25), which syncs after this hook can
    # first run; requiring it would wedge the hook, and the portal with it.
    # Without it the penpot entry is skipped below, with a warning.

    # KC_CLI_PASSWORD is Keycloak's supported password input. A private
    # ephemeral config file holds the resulting session token.
    "$KCADM" config credentials \
      --server http://keycloak.keycloak.svc.cluster.local:8080 \
      --realm master --user "$KC_ADMIN_USERNAME" \
      --config /tmp/kcadm.config >/dev/null

    # This is the entire mutation allowlist. Query errors and duplicate IDs
    # abort the hook; neither may be interpreted as an absent client.
    # Arguments are positional: client_id, optional secret env var, display
    # name, origin, callback path, logout path, optional required scope list.
    # An empty secret env var creates a public PKCE client; a non-empty one
    # creates a confidential client.
    # The origin and the OIDC callback
    # path are per entry, never constants inside this function: Penpot's
    # callback is /api/auth/oidc/callback, which is NOT the portal's
    # /auth/callback, and a shared constant would rewrite the portal's.
    reconcile_client() {
      client_id=$1 secret_var=$2 display_name=$3 origin=$4
      callback=$5 logout_path=$6
      required_scopes=${7:-"profile email groups"}
      secret_value=
      if [ -n "$secret_var" ]; then
        # jq reads the secret, not the shell: $secret_var (the NAME) goes into
        # argv and the value comes back out of jq's own environment. The value
        # never becomes a process argument of anything: --arg is handed the
        # name only, and handing it the value instead would put the secret in
        # every argument list. A coreutils environment reader would do the same
        # job, but it is used nowhere else in this repository and cannot be
        # assumed present in the Keycloak image, where its absence would abort
        # the hook under set -e. jq is already a hard dependency below; if it
        # were missing this hook could not work at all, so this adds no new way
        # to fail.
        secret_value=$("$JQ" -nr --arg env_name "$secret_var" 'env[$env_name]')
      fi
      clients_json=$("$KCADM" get clients -r homelab \
        -q clientId="$client_id" --fields id,clientId \
        --config /tmp/kcadm.config)
      client_uuid=$(printf '%s' "$clients_json" | "$JQ" -er \
        --arg client_id "$client_id" \
        '[.[] | select(.clientId == $client_id)] |
         if length == 0 then ""
         elif length == 1 then .[0].id
         else error("duplicate client ID: " + $client_id) end')

      if [ -n "$secret_var" ]; then
        desired_json=$("$JQ" -n \
          --arg client_id "$client_id" \
          --arg name "$display_name" \
          --arg redirect "${origin}${callback}" \
          --arg origin "$origin" \
          --arg logout "${origin}${logout_path}" \
          --arg env_name "$secret_var" \
          '{clientId: $client_id,
            name: $name,
            protocol: "openid-connect",
            enabled: true,
            publicClient: false,
            clientAuthenticatorType: "client-secret",
            standardFlowEnabled: true,
            implicitFlowEnabled: false,
            directAccessGrantsEnabled: false,
            serviceAccountsEnabled: false,
            redirectUris: [$redirect],
            webOrigins: [$origin],
            attributes: {"post.logout.redirect.uris": $logout},
            secret: env[$env_name]}')
      else
        desired_json=$("$JQ" -n \
          --arg client_id "$client_id" \
          --arg name "$display_name" \
          --arg redirect "${origin}${callback}" \
          --arg origin "$origin" \
          --arg logout "${origin}${logout_path}" \
          '{clientId: $client_id,
            name: $name,
            protocol: "openid-connect",
            enabled: true,
            publicClient: true,
            clientAuthenticatorType: "none",
            standardFlowEnabled: true,
            implicitFlowEnabled: false,
            directAccessGrantsEnabled: false,
            serviceAccountsEnabled: false,
            redirectUris: [$redirect],
            webOrigins: [$origin],
            attributes: {
              "post.logout.redirect.uris": $logout,
              "pkce.code.challenge.method": "S256"
            }}')
      fi

      # Project only fields this hook owns. Keycloak adds server-side fields
      # and other operators may set unrelated client fields. Never print the
      # secret-bearing response or desired body during comparison.
      canonical() {
        "$JQ" -cS '
          del(.secret) |
          {clientId, name, protocol, enabled, publicClient,
           clientAuthenticatorType, standardFlowEnabled,
           implicitFlowEnabled, directAccessGrantsEnabled,
           serviceAccountsEnabled, redirectUris, webOrigins,
           attributes: {"post.logout.redirect.uris":
                        .attributes["post.logout.redirect.uris"],
                       "pkce.code.challenge.method":
                        .attributes["pkce.code.challenge.method"]}}
        '
      }
      desired_public=$(printf '%s' "$desired_json" | canonical)

      if [ -z "$client_uuid" ]; then
        if ! printf '%s' "$desired_json" | "$KCADM" create clients -r homelab \
            --config /tmp/kcadm.config -f - >/dev/null 2>&1; then
          echo "$client_id client create failed" >&2
          exit 1
        fi
        echo "created $client_id client"
        clients_json=$("$KCADM" get clients -r homelab \
          -q clientId="$client_id" --fields id,clientId \
          --config /tmp/kcadm.config)
        client_uuid=$(printf '%s' "$clients_json" | "$JQ" -er \
          --arg client_id "$client_id" \
          '[.[] | select(.clientId == $client_id)] |
           if length == 1 then .[0].id
           else error("created client lookup was not unique") end')
      else
        current_json=$("$KCADM" get "clients/$client_uuid" -r homelab \
          --config /tmp/kcadm.config)
        current_public=$(printf '%s' "$current_json" | canonical)
        current_secret=
        if [ -n "$secret_var" ]; then
          current_secret_json=$("$KCADM" get "clients/$client_uuid/client-secret" \
            -r homelab --config /tmp/kcadm.config)
          current_secret=$(printf '%s' "$current_secret_json" | "$JQ" -r '.value // ""')
        fi
        if [ "$current_public" = "$desired_public" ] && \
           [ "$current_secret" = "$secret_value" ]; then
          echo "$client_id client already current"
        else
          # --merge retains unrelated client fields. This body carries no
          # defaultClientScopes, so client scopes are not touched here at
          # all: the explicit scope loop below is their only owner, and it
          # adds what is missing rather than replacing the whole mapping.
          if ! printf '%s' "$desired_json" | "$KCADM" update "clients/$client_uuid" \
              -r homelab --config /tmp/kcadm.config --merge -f - >/dev/null 2>&1; then
            echo "$client_id client update failed" >&2
            exit 1
          fi
          echo "updated $client_id client"
        fi
      fi

      # Client scope mappings are a separate Keycloak resource. Add only the
      # required defaults; preserve any other scopes operators attached.
      current_scopes=$("$KCADM" get "clients/$client_uuid/default-client-scopes" \
        -r homelab --config /tmp/kcadm.config)
      available_scopes=
      for scope_name in $required_scopes; do
        if printf '%s' "$current_scopes" | "$JQ" -e \
            --arg name "$scope_name" 'any(.[]; .name == $name)' >/dev/null; then
          continue
        fi
        if [ -z "$available_scopes" ]; then
          available_scopes=$("$KCADM" get client-scopes -r homelab \
            --config /tmp/kcadm.config)
        fi
        scope_uuid=$(printf '%s' "$available_scopes" | "$JQ" -er \
          --arg name "$scope_name" \
          '[.[] | select(.name == $name)] |
           if length == 1 then .[0].id
           else error("required client scope missing or duplicated") end')
        if ! "$KCADM" update "clients/$client_uuid/default-client-scopes/$scope_uuid" \
            -r homelab --config /tmp/kcadm.config >/dev/null 2>&1; then
          echo "$client_id default scope update failed" >&2
          exit 1
        fi
        current_scopes=$("$KCADM" get "clients/$client_uuid/default-client-scopes" \
          -r homelab --config /tmp/kcadm.config)
        if ! printf '%s' "$current_scopes" | "$JQ" -e \
            --arg name "$scope_name" 'any(.[]; .name == $name)' >/dev/null; then
          echo "$client_id default scope verification failed" >&2
          exit 1
        fi
      done
      # Verify the complete required set, not merely the most recent add.
      for scope_name in $required_scopes; do
        if ! printf '%s' "$current_scopes" | "$JQ" -e \
            --arg name "$scope_name" 'any(.[]; .name == $name)' >/dev/null; then
          echo "$client_id default scope verification failed" >&2
          exit 1
        fi
      done
    }

    reconcile_public_client() {
      client_id=$1 display_name=$2 origin=$3 callback=$4 logout_path=$5
      reconcile_client "$client_id" "" "$display_name" "$origin" "$callback" "$logout_path"
    }

    # The realm seed explicitly declares client scopes, which suppresses
    # Keycloak's built-in scope population. Reconcile the exact Keycloak 26.7.4
    # basic/roles representations before attaching them to the TLE clients.
    # This also repairs realms imported before these scopes were required.
    ensure_client_scope() {
      scope_name=$1 desired_json=$2
      scopes_json=$("$KCADM" get client-scopes -r homelab \
        --config /tmp/kcadm.config)
      scope_count=$(printf '%s' "$scopes_json" | "$JQ" -r \
        --arg name "$scope_name" '[.[] | select(.name == $name)] | length')
      if [ "$scope_count" -gt 1 ]; then
        echo "$scope_name client scope is duplicated" >&2
        exit 1
      fi
      if [ "$scope_count" -eq 0 ]; then
        if ! printf '%s' "$desired_json" | "$KCADM" create client-scopes \
            -r homelab --config /tmp/kcadm.config -f - >/dev/null 2>&1; then
          echo "$scope_name client scope create failed" >&2
          exit 1
        fi
        scopes_json=$("$KCADM" get client-scopes -r homelab \
          --config /tmp/kcadm.config)
        scope_count=$(printf '%s' "$scopes_json" | "$JQ" -r \
          --arg name "$scope_name" '[.[] | select(.name == $name)] | length')
        if [ "$scope_count" -ne 1 ]; then
          echo "$scope_name client scope verification failed" >&2
          exit 1
        fi
      fi
    }

    basic_scope=$("$JQ" -n '
      {name: "basic",
       description: "OpenID Connect scope for add all basic claims to the token",
       protocol: "openid-connect",
       attributes: {
         "include.in.token.scope": "false",
         "display.on.consent.screen": "false"
       },
       protocolMappers: [
         {name: "auth_time", protocol: "openid-connect",
          protocolMapper: "oidc-usersessionmodel-note-mapper",
          consentRequired: false,
          config: {
            "user.session.note": "AUTH_TIME",
            "introspection.token.claim": "true",
            "userinfo.token.claim": "true",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "auth_time",
            "jsonType.label": "long"
          }},
         {name: "sub", protocol: "openid-connect",
          protocolMapper: "oidc-sub-mapper", consentRequired: false,
          config: {
            "introspection.token.claim": "true",
            "access.token.claim": "true"
          }}
       ]}')
    roles_scope=$("$JQ" -n '
      {name: "roles",
       description: "OpenID Connect scope for add user roles to the access token",
       protocol: "openid-connect",
       attributes: {
         "include.in.token.scope": "false",
         "consent.screen.text": "${rolesScopeConsentText}",
         "display.on.consent.screen": "true"
       },
       protocolMappers: [
         {name: "client roles", protocol: "openid-connect",
          protocolMapper: "oidc-usermodel-client-role-mapper",
          consentRequired: false,
          config: {
            "user.attribute": "foo",
            "introspection.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "resource_access.${client_id}.roles",
            "jsonType.label": "String", multivalued: "true"
          }},
         {name: "audience resolve", protocol: "openid-connect",
          protocolMapper: "oidc-audience-resolve-mapper",
          consentRequired: false,
          config: {
            "introspection.token.claim": "true",
            "access.token.claim": "true"
          }},
         {name: "realm roles", protocol: "openid-connect",
          protocolMapper: "oidc-usermodel-realm-role-mapper",
          consentRequired: false,
          config: {
            "user.attribute": "foo",
            "introspection.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "realm_access.roles",
            "jsonType.label": "String", multivalued: "true"
          }}
       ]}')

    reconcile_client homelab-portal PORTAL_CLIENT_SECRET "Homelab Portal" \
      https://portal.taildf6cd4.ts.net /auth/callback /auth/logout
    # Penpot does expose POST /api/logout, but nothing a browser can be
    # redirected to, and Keycloak's post.logout.redirect.uris is a browser
    # GET. Hence the empty path, giving the trailing "/" that lands on the
    # application root rather than a logout route.
    if [ -n "${PENPOT_CLIENT_SECRET:-}" ]; then
      reconcile_client penpot PENPOT_CLIENT_SECRET "Penpot" \
        https://penpot.taildf6cd4.ts.net /api/auth/oidc/callback /
    else
      echo "WARNING: penpot client skipped: Secret keycloak-penpot-client is" \
        "not projected yet. Re-sync the keycloak Application after the" \
        "penpot Application's first sync." >&2
    fi
    ensure_client_scope basic "$basic_scope"
    ensure_client_scope roles "$roles_scope"
    reconcile_client tle-admin-dev TLE_ADMIN_DEV_CLIENT_SECRET "The Last Exam Admin (dev)" \
      https://tle-dev-operator.taildf6cd4.ts.net /auth/callback / \
      "profile email groups basic roles"
    reconcile_client tle-admin-prod TLE_ADMIN_PROD_CLIENT_SECRET "The Last Exam Admin (prod)" \
      https://tle-prod-operator.taildf6cd4.ts.net /auth/callback / \
      "profile email groups basic roles"
    reconcile_public_client hermes-dashboard "Hermes Agent" \
      https://hermes.taildf6cd4.ts.net /auth/callback /
    /bin/sh /tle-role-reconciler/reconcile-tle-admin-roles.sh
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-client-registration
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # A fresh reconcile is ~200 sequential kcadm JVM invocations at ~8s each
  # (~26 minutes): 4 clients plus 67 roles and 3 bulk composite updates on
  # each of the two TLE clients. Steady-state runs need ~45 calls (~6 min).
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        job: keycloak-client-registration
    spec:
      serviceAccountName: keycloak
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-verified-jq
          # The upstream jq image is FROM scratch and cannot run cp itself.
          # Kubernetes 1.36 image volumes expose its static binary read-only.
          image: "quay.io/keycloak/keycloak:26.7.4@sha256:\
            82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c"
          command:
            - /bin/sh
            - -ec
            - |
              printf '%s  %s\n' \
                b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f \
                /jq-image/jq | sha256sum -c - >/dev/null
              cp /jq-image/jq /tools/jq
              chmod 0755 /tools/jq
          volumeMounts:
            - name: jq-image
              mountPath: /jq-image
              readOnly: true
            - name: tools
              mountPath: /tools
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: reconcile
          image: "quay.io/keycloak/keycloak:26.7.4@sha256:\
            82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c"
          command: [/bin/sh, /scripts/reconcile.sh]
          env:
            - name: KC_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_CLI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: PORTAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-portal-client
                  key: clientSecret
            # Optional: projected by the later penpot Application; the
            # script skips the penpot client while it is absent.
            - name: PENPOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-penpot-client
                  key: clientSecret
                  optional: true
            - name: TLE_ADMIN_DEV_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-tle-admin-dev-client
                  key: clientSecret
            - name: TLE_ADMIN_PROD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-tle-admin-prod-client
                  key: clientSecret
            # The generated role reconciler accepts exactly this ordered
            # allowlist. The client registrations themselves are added in the
            # same Job below before the reconciler runs.
            - name: TLE_ADMIN_CLIENT_IDS
              value: tle-admin-dev tle-admin-prod
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tle-admin-role-reconciler
              mountPath: /tle-role-reconciler
              readOnly: true
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: work
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: script
          configMap:
            name: keycloak-client-registration
        - name: tle-admin-role-reconciler
          configMap:
            name: keycloak-tle-admin-role-reconciliation
        - name: jq-image
          image:
            # Official 1.8.2 multi-platform manifest digest. The amd64
            # binary is also checked against upstream's release SHA-256.
            reference: "ghcr.io/jqlang/jq:1.8.2@sha256:\
              b9c68867e5766576263a222e91db3de422d802069c7af70440e667a95344e486"
            pullPolicy: IfNotPresent
        - name: tools
          emptyDir: {}
        - name: work
          emptyDir: {}
