# Keycloak's admin, database, and portal-client credentials use one
# VaultAuth -- the vso-keycloak-read policy grants all three paths, so no second
# identity is needed here. The `databases` half of this phase's wiring is a
# different ServiceAccount in a different namespace; it lives in
# database-job.yaml, because a VaultAuth's ServiceAccount must reside in the
# consuming Secret's namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: keycloak
spec:
  # The in-cluster Service, not the tailnet URL. A VaultConnection is
  # per-namespace; `databases` has its own, created by PostgreSQL.
  address: http://vault.vault.svc.cluster.local:8200
  # skipTLSVerify is required by the CRD even when the address is http,
  # where it has no effect.
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: keycloak
  namespace: keycloak
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # role must match the Vault role written by
    # platform/vault/configure-vault.sh, and audiences must match that
    # role's `audience=`. A mismatch in either is a permission denial
    # naming neither side.
    role: vso-keycloak
    serviceAccount: keycloak
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  vaultAuthRef: keycloak
  mount: homelab
  type: kv-v2
  path: keycloak
  refreshAfter: 60s
  destination:
    name: keycloak-admin
    create: true
    transformation:
      # No templates here, so Vault's own username/password key names reach
      # the Secret verbatim; the Deployment reads them by those names.
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  vaultAuthRef: keycloak
  mount: homelab
  type: kv-v2
  path: keycloak-db
  refreshAfter: 60s
  destination:
    name: keycloak-db
    create: true
    transformation:
      excludeRaw: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-portal-client
  namespace: keycloak
spec:
  vaultAuthRef: keycloak
  mount: homelab
  type: kv-v2
  path: keycloak-portal
  refreshAfter: 60s
  destination:
    name: keycloak-portal-client
    create: true
    transformation:
      excludeRaw: true
