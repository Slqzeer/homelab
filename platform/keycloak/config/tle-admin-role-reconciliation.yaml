apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-tle-admin-role-reconciliation
  namespace: keycloak
data:
  reconcile-tle-admin-roles.sh: |
    #!/bin/sh
    # Reconcile TLE admin client roles in the Keycloak "homelab" realm.
    #
    # Generated by generate.py from The Last Exam's role manifest
    #   (manifest_version 1, registry schema 1.3,
    #    64 capabilities, composites: support=14, operator=44, admin=64).
    # Do not edit this file by hand; regenerate it from the vendored manifest.
    #
    # This script owns roles and role-composite membership on exactly
    # tle-admin-dev and tle-admin-prod. It never reads or mutates realm roles,
    # users, groups, realm settings, default realm roles, or another client.
    set -eu

    : "${KC_ADMIN_USERNAME:?missing admin username}"
    : "${KC_CLI_PASSWORD:?missing admin password}"
    : "${TLE_ADMIN_CLIENT_IDS:?missing TLE admin client IDs}"
    KCADM=${KCADM:-/opt/keycloak/bin/kcadm.sh}
    JQ=${JQ:-/tools/jq}
    REALM=homelab
    WORK=$(mktemp -d)
    trap 'rm -rf "$WORK"' EXIT

    if [ "$TLE_ADMIN_CLIENT_IDS" != "tle-admin-dev tle-admin-prod" ]; then
      echo "unexpected TLE admin client allowlist" >&2
      exit 2
    fi

    CAPABILITIES='
    admin.auth.api_keys.manage|TLE capability (write): auth-administration
    admin.auth.keys.rotate|TLE capability (write): auth-administration
    admin.auth.kill_switch|TLE capability (write): auth-administration
    admin.auth.read|TLE capability (read): auth-administration
    admin.auth.sessions.read|TLE capability (read): auth-administration
    admin.auth.sessions.revoke|TLE capability (write): auth-administration
    admin.game.match.terminate|TLE capability (write): game-pod-administration
    admin.game.read|TLE capability (read): game-pod-administration
    admin.game.snapshot.read|TLE capability (read): game-pod-administration
    admin.gamemaster.capacity.write|TLE capability (write): game-master-administration
    admin.gamemaster.pod.drain|TLE capability (write): game-master-administration
    admin.gamemaster.read|TLE capability (read): game-master-administration
    admin.gateway.policy.write|TLE capability (write): gateway-security-operations
    admin.gateway.read|TLE capability (read): gateway-security-operations
    admin.k8s.drain|TLE capability (write): kubernetes-operations
    admin.k8s.logs.read|TLE capability (read): kubernetes-operations
    admin.k8s.read|TLE capability (read): kubernetes-operations
    admin.k8s.restart|TLE capability (write): kubernetes-operations
    admin.k8s.scale|TLE capability (write): kubernetes-operations
    admin.lobby.moderate|TLE capability (write): lobby-administration
    admin.lobby.read|TLE capability (read): lobby-administration
    admin.lobby.session.disconnect|TLE capability (write): lobby-administration
    admin.matchmaking.queue.intervene|TLE capability (write): matchmaking-administration
    admin.matchmaking.read|TLE capability (read): matchmaking-administration
    admin.matchmaking.replay|TLE capability (write): matchmaking-administration
    admin.metadata.activate|TLE capability (write): metadata-administration
    admin.metadata.dependency.write|TLE capability (write): metadata-administration
    admin.metadata.entity.create|TLE capability (write): metadata-administration
    admin.metadata.entity.delete|TLE capability (write): metadata-administration
    admin.metadata.entity.update|TLE capability (write): metadata-administration
    admin.metadata.publish|TLE capability (write): metadata-administration
    admin.metadata.read|TLE capability (read): metadata-administration
    admin.metadata.retire|TLE capability (write): metadata-administration
    admin.metadata.validate|TLE capability (write): metadata-administration
    admin.nats.consumer.manage|TLE capability (write): nats-administration
    admin.nats.read|TLE capability (read): nats-administration
    admin.nats.replay|TLE capability (write): nats-administration
    admin.notification.preference.write|TLE capability (write): notification-administration
    admin.notification.read|TLE capability (read): notification-administration
    admin.notification.replay|TLE capability (write): notification-administration
    admin.notification.template.write|TLE capability (write): notification-administration
    admin.player.economy.adjust|TLE capability (write): player-administration
    admin.player.inventory.adjust|TLE capability (write): player-administration
    admin.player.progression.adjust|TLE capability (write): player-administration
    admin.player.read|TLE capability (read): player-administration
    admin.quest.compensation.resolve|TLE capability (write): quest-administration
    admin.quest.control.write|TLE capability (write): quest-administration
    admin.quest.definition.activate|TLE capability (write): quest-administration
    admin.quest.definition.create|TLE capability (write): quest-administration
    admin.quest.definition.delete|TLE capability (write): quest-administration
    admin.quest.definition.publish|TLE capability (write): quest-administration
    admin.quest.definition.update|TLE capability (write): quest-administration
    admin.quest.migration.execute|TLE capability (write): quest-administration
    admin.quest.quarantine.replay|TLE capability (write): quest-administration
    admin.quest.read|TLE capability (read): quest-administration
    admin.security.rate_limit.write|TLE capability (write): gateway-security-operations
    admin.social.guild.manage|TLE capability (write): social-administration
    admin.social.moderate|TLE capability (write): social-administration
    admin.social.outbox.replay|TLE capability (write): social-administration
    admin.social.read|TLE capability (read): social-administration
    admin.timeline.read|TLE capability (read): timeline-administration
    admin.timeline.replay|TLE capability (write): timeline-administration
    admin.valkey.evict|TLE capability (write): valkey-administration
    admin.valkey.read|TLE capability (read): valkey-administration
    '
    BUNDLES=$(printf '%s\n' \
    'support|Player support and moderation: reads player-facing state, revo'\
    'kes player sessions, moderates lobby and social.' \
    'operator|Day-to-day live operations: support plus infrastructure reads'\
    ', player corrections, queue and match interventions, content drafting '\
    'and replays.' \
    'admin|Platform owner: every operator capability, including key rotatio'\
    'n, kill switch, publishing and activation, destructive infrastructure '\
    'actions and policy changes.'
    )
    MEMBERS='
    support|admin.auth.read
    support|admin.auth.sessions.read
    support|admin.auth.sessions.revoke
    support|admin.game.read
    support|admin.lobby.moderate
    support|admin.lobby.read
    support|admin.matchmaking.read
    support|admin.metadata.read
    support|admin.notification.read
    support|admin.player.read
    support|admin.quest.read
    support|admin.social.moderate
    support|admin.social.read
    support|admin.timeline.read
    operator|admin.auth.read
    operator|admin.auth.sessions.read
    operator|admin.auth.sessions.revoke
    operator|admin.game.match.terminate
    operator|admin.game.read
    operator|admin.game.snapshot.read
    operator|admin.gamemaster.capacity.write
    operator|admin.gamemaster.read
    operator|admin.gateway.read
    operator|admin.k8s.logs.read
    operator|admin.k8s.read
    operator|admin.lobby.moderate
    operator|admin.lobby.read
    operator|admin.lobby.session.disconnect
    operator|admin.matchmaking.queue.intervene
    operator|admin.matchmaking.read
    operator|admin.matchmaking.replay
    operator|admin.metadata.dependency.write
    operator|admin.metadata.entity.create
    operator|admin.metadata.entity.update
    operator|admin.metadata.read
    operator|admin.metadata.validate
    operator|admin.nats.read
    operator|admin.nats.replay
    operator|admin.notification.preference.write
    operator|admin.notification.read
    operator|admin.notification.replay
    operator|admin.player.economy.adjust
    operator|admin.player.inventory.adjust
    operator|admin.player.progression.adjust
    operator|admin.player.read
    operator|admin.quest.compensation.resolve
    operator|admin.quest.control.write
    operator|admin.quest.definition.create
    operator|admin.quest.definition.update
    operator|admin.quest.quarantine.replay
    operator|admin.quest.read
    operator|admin.social.guild.manage
    operator|admin.social.moderate
    operator|admin.social.outbox.replay
    operator|admin.social.read
    operator|admin.timeline.read
    operator|admin.timeline.replay
    operator|admin.valkey.read
    admin|admin.auth.api_keys.manage
    admin|admin.auth.keys.rotate
    admin|admin.auth.kill_switch
    admin|admin.auth.read
    admin|admin.auth.sessions.read
    admin|admin.auth.sessions.revoke
    admin|admin.game.match.terminate
    admin|admin.game.read
    admin|admin.game.snapshot.read
    admin|admin.gamemaster.capacity.write
    admin|admin.gamemaster.pod.drain
    admin|admin.gamemaster.read
    admin|admin.gateway.policy.write
    admin|admin.gateway.read
    admin|admin.k8s.drain
    admin|admin.k8s.logs.read
    admin|admin.k8s.read
    admin|admin.k8s.restart
    admin|admin.k8s.scale
    admin|admin.lobby.moderate
    admin|admin.lobby.read
    admin|admin.lobby.session.disconnect
    admin|admin.matchmaking.queue.intervene
    admin|admin.matchmaking.read
    admin|admin.matchmaking.replay
    admin|admin.metadata.activate
    admin|admin.metadata.dependency.write
    admin|admin.metadata.entity.create
    admin|admin.metadata.entity.delete
    admin|admin.metadata.entity.update
    admin|admin.metadata.publish
    admin|admin.metadata.read
    admin|admin.metadata.retire
    admin|admin.metadata.validate
    admin|admin.nats.consumer.manage
    admin|admin.nats.read
    admin|admin.nats.replay
    admin|admin.notification.preference.write
    admin|admin.notification.read
    admin|admin.notification.replay
    admin|admin.notification.template.write
    admin|admin.player.economy.adjust
    admin|admin.player.inventory.adjust
    admin|admin.player.progression.adjust
    admin|admin.player.read
    admin|admin.quest.compensation.resolve
    admin|admin.quest.control.write
    admin|admin.quest.definition.activate
    admin|admin.quest.definition.create
    admin|admin.quest.definition.delete
    admin|admin.quest.definition.publish
    admin|admin.quest.definition.update
    admin|admin.quest.migration.execute
    admin|admin.quest.quarantine.replay
    admin|admin.quest.read
    admin|admin.security.rate_limit.write
    admin|admin.social.guild.manage
    admin|admin.social.moderate
    admin|admin.social.outbox.replay
    admin|admin.social.read
    admin|admin.timeline.read
    admin|admin.timeline.replay
    admin|admin.valkey.evict
    admin|admin.valkey.read
    '

    lines() { printf '%s\n' "$1" | grep -v '^$'; }
    same_file() { [ "$(cat "$1")" = "$(cat "$2")" ]; }

    "$KCADM" config credentials \
      --server http://keycloak.keycloak.svc.cluster.local:8080 \
      --realm master --user "$KC_ADMIN_USERNAME" \
      --config "$WORK/kcadm.config" >/dev/null

    kc() { "$KCADM" "$@" -r "$REALM" --config "$WORK/kcadm.config"; }
    client_uuid() {
      client_id=$1
      clients=$(kc get clients -q "clientId=$client_id" --fields id,clientId)
      printf '%s' "$clients" | "$JQ" -er --arg client_id "$client_id" '
        [.[] | select(.clientId == $client_id)] |
        if length == 1 then .[0].id
        elif length == 0 then error("missing client ID: " + $client_id)
        else error("duplicate client ID: " + $client_id) end'
    }
    role_names() { "$JQ" -r '.[].name' "$WORK/all-roles.json" | sort; }
    roles_dump() { kc get "clients/$1/roles" > "$WORK/all-roles.json"; }
    composite_names() {
      kc get "clients/$1/roles/$2/composites" | "$JQ" -r '.[].name' | sort
    }
    members_json() {
      # $1 is a file with one role name per line. Print a JSON array of the
      # matching {id, name} bodies from the last roles dump, so one POST or
      # DELETE carries a whole bundle's membership delta. A single kcadm JVM
      # costs ~8s wall, so per-member calls cannot finish inside the Job
      # deadline; Keycloak accepts an array here. Fail closed when a name is
      # missing: a short array would silently converge the wrong membership.
      "$JQ" -R -s --slurpfile all "$WORK/all-roles.json" '
        split("\n") | map(select(length > 0)) as $want |
        [$all[0][] | select(.name as $n | $want | index($n)) | {id, name}] |
        if length == ($want | length) then .
        else error("role lookup incomplete") end' "$1"
    }
    ensure_role() {
      client_uuid=$1 role_name=$2 description=$3
      if grep -Fxq "$role_name" "$WORK/have-roles"; then return; fi
      "$JQ" -n --arg name "$role_name" --arg description "$description" \
        '{name: $name, description: $description}' |
        kc create "clients/$client_uuid/roles" -f - >/dev/null
    }
    reconcile_client() {
      client_id=$1
      client_uuid=$(client_uuid "$client_id")
      lines "$CAPABILITIES" | cut -d'|' -f1 | sort > "$WORK/want-capabilities"
      lines "$BUNDLES" | cut -d'|' -f1 | sort > "$WORK/want-bundles"
      sort "$WORK/want-capabilities" "$WORK/want-bundles" > "$WORK/want-roles"
      roles_dump "$client_uuid"
      role_names > "$WORK/have-roles"

      { lines "$CAPABILITIES"; lines "$BUNDLES"; } |
        while IFS='|' read -r name description; do
          ensure_role "$client_uuid" "$name" "$description"
        done

      # The dump above predates the creates: refresh it so member bodies and
      # the have-roles baseline reflect server truth.
      roles_dump "$client_uuid"
      role_names > "$WORK/have-roles"

      while IFS= read -r bundle; do
        lines "$MEMBERS" | grep -F "${bundle}|" | cut -d'|' -f2 |
          sort > "$WORK/want-$bundle"
        composite_names "$client_uuid" "$bundle" > "$WORK/have-$bundle"
        grep -Fxv -f "$WORK/have-$bundle" "$WORK/want-$bundle" > "$WORK/missing-$bundle" || true
        if [ -s "$WORK/missing-$bundle" ]; then
          members_json "$WORK/missing-$bundle" |
            kc create "clients/$client_uuid/roles/$bundle/composites" -f - >/dev/null
        fi
        composite_names "$client_uuid" "$bundle" > "$WORK/have-$bundle"
        grep -Fxv -f "$WORK/want-$bundle" "$WORK/have-$bundle" > "$WORK/stale-$bundle" || true
        if [ -s "$WORK/stale-$bundle" ]; then
          members_json "$WORK/stale-$bundle" |
            kc delete "clients/$client_uuid/roles/$bundle/composites" -f - >/dev/null
        fi
      done < "$WORK/want-bundles"

      roles_dump "$client_uuid"
      role_names > "$WORK/have-roles"
      grep -Fxv -f "$WORK/want-roles" "$WORK/have-roles" > "$WORK/stale-roles" || true
      while IFS= read -r name; do
        [ -n "$name" ] || continue
        kc delete "clients/$client_uuid/roles/$name" >/dev/null
      done < "$WORK/stale-roles"

      roles_dump "$client_uuid"
      role_names > "$WORK/have-roles"
      same_file "$WORK/want-roles" "$WORK/have-roles" || {
        echo "$client_id roles differ from manifest" >&2
        exit 1
      }
      while IFS= read -r bundle; do
        composite_names "$client_uuid" "$bundle" > "$WORK/have-$bundle"
        same_file "$WORK/want-$bundle" "$WORK/have-$bundle" || {
          echo "$client_id composite $bundle differs from manifest" >&2
          exit 1
        }
      done < "$WORK/want-bundles"
    }

    for client_id in $TLE_ADMIN_CLIENT_IDS; do
      reconcile_client "$client_id"
    done
