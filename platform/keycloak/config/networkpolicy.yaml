# Keycloak is reachable only from its selected tailnet proxy, the metrics
# scraper, its registration Job, and the two named OIDC consumer pods.
# Egress is unchanged so Keycloak can still reach PostgreSQL and DNS.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-tailnet
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              # The shared "ingress" ProxyGroup pool. Pool pods serve every
              # tailnet hostname, so they carry the pool's labels rather than
              # per-Ingress ones (infrastructure/ingress/config/proxygroup.yaml).
              tailscale.com/managed: "true"
              tailscale.com/parent-resource-type: proxygroup
              tailscale.com/parent-resource: ingress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-metrics
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              # prometheus-agent, not prometheus: agent mode since 2026-10-05.
              app.kubernetes.io/name: prometheus-agent
              operator.prometheus.io/name: monitoring-kube-prometheus-prometheus
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-registration
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              job: keycloak-client-registration
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-oidc-consumers
  namespace: keycloak
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: homelab-portal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nextcloud
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nextcloud
        # The backend, not the MCP server: it is what exchanges the code for a
        # token and reads JWKS. Chart 1.11.3 labels the backend pod
        # app.kubernetes.io/name: penpot-backend (penpot.backendSelectorLabels);
        # a `penpot` selector would match no pod and deny silently.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: penpot
          podSelector:
            matchLabels:
              app.kubernetes.io/name: penpot-backend
      ports:
        - protocol: TCP
          port: 8080
