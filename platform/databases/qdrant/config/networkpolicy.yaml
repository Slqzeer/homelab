# The namespace-wide default deny is owned by PostgreSQL, the databases
# namespace anchor. Qdrant opens only its client APIs to the shared Tailscale
# ingress ProxyGroup. Port 6335 is intentionally absent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: qdrant-tailnet
  namespace: databases
spec:
  podSelector:
    matchLabels:
      app: qdrant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: ingress
              tailscale.com/parent-resource-type: proxygroup
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
