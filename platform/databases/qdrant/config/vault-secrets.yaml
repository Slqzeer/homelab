# Qdrant admin API key: Vault KV -> VSO -> Secret -> process environment.
# Namespace `databases` already has the shared VaultConnection named `vault`.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qdrant
  namespace: databases
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: qdrant
  namespace: databases
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-qdrant
    serviceAccount: qdrant
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: qdrant-credentials
  namespace: databases
spec:
  vaultAuthRef: qdrant
  mount: homelab
  type: kv-v2
  path: qdrant
  refreshAfter: 300s
  rolloutRestartTargets:
    - kind: StatefulSet
      name: qdrant
  destination:
    name: qdrant-credentials
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        api-key:
          text: '{{ get .Secrets "api-key" }}'
