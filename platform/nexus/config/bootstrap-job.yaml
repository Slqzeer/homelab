# Phase 21's configuration, in git rather than in a web UI.
#
# Repositories, users, realms and connectors are rows in Nexus's own database,
# not Kubernetes objects. Configured by hand, the entire substance of phase 21
# would live inside a PVC where git cannot see it, and a rebuild would be a
# restore rather than a reconcile.
#
# An Argo CD Sync HOOK, not a plain Job. A Job is immutable, so re-applying an
# unchanged one does nothing at all -- a changed repository definition would
# never reach the cluster, and the idempotency check in the spec's verification
# list would be untestable. BeforeHookCreation deletes the previous Job so each
# sync genuinely re-runs this, and leaves the completed Job in place afterwards
# so its log can still be read.
#
# Re-running is safe because every write below is a reconcile: the script
# probes for each object and PUTs when it already exists. After the first run
# /nexus-data/admin.password no longer exists, so the script authenticates with
# the Vault password instead of the boot-generated one.
#
# Every endpoint, body and status code the script uses was observed against
# sonatype/nexus3:3.96.1 and is recorded in platform/nexus/rest-schemas.md.
# That file is the authority; do not "correct" a payload here from upstream
# documentation without re-probing, because several documented endpoints do not
# exist on this build.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nexus-bootstrap
  namespace: artifacts
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Two attempts, not the default six. Every failure mode here is either
  # permanent (a schema mismatch) or slow (Nexus not up yet, which the wait
  # loop already covers), and six retries only delays the diagnosis.
  backoffLimit: 2
  # The wall-clock backstop the script's own loops are not. Every curl below
  # carries --connect-timeout and --max-time, so a hung JVM cannot block a
  # single call forever -- but the wait loop bounds ITERATIONS, not elapsed
  # time, and a server that accepts the connection and stalls on every probe
  # would still burn 60 * (10 s timeout + 5 s sleep). This is a Sync hook: a
  # Job that never ends stalls the entire Argo CD sync. 900 s kills it instead,
  # and DeadlineExceeded on the Job is itself the diagnosis.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: nexus
      securityContext:
        # Must match the Deployment's: this Job reads a file the Nexus process
        # created as uid 200 on the same volume.
        runAsNonRoot: true
        runAsUser: 200
        runAsGroup: 200
        fsGroup: 200
        # NOT the default (Always). With Always the kubelet recursively chowns
        # the whole 20Gi blob store every time this pod starts -- which is
        # every Argo CD sync -- while Nexus is serving from that same volume.
        # OnRootMismatch checks the top-level directory only and skips the walk
        # when it already matches, which it always will after the Deployment
        # has created it. The Deployment carries the same setting, so the
        # "securityContext must match" constraint still holds.
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: bootstrap
          # The Nexus image itself, purely because it already carries curl and
          # the exact version this configuration was validated against. Pinned
          # to the same tag as the Deployment on purpose -- the REST schema is
          # version-specific, and rest-schemas.md section 5 documents an
          # endpoint that exists on this build and not in the vendor's docs.
          image: sonatype/nexus3:3.96.1
          # /bin/sh, NOT /bin/bash. The unsuffixed 3.96.1 tag is Alpine and
          # ships no bash at all -- `docker exec ... bash` exits 127 on it
          # (rest-schemas.md section 2). The script is POSIX sh for BusyBox
          # ash: no arrays, no [[ ]], no process substitution, and `set -eu`
          # without pipefail.
          command: ["/bin/sh", "/script/bootstrap.sh"]
          env:
            - name: NEXUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexus-admin
                  key: password
          volumeMounts:
            - name: script
              mountPath: /script
            - name: data
              # The SAME ReadWriteOnce claim the Deployment holds. Legal here
              # because RWO restricts concurrent use to one NODE, not one pod,
              # and this cluster has one node. Read-only: this Job must never
              # write to Nexus's state directory.
              mountPath: /nexus-data
              readOnly: true
            - name: tmp
              # The script's credential scratch files land here rather than in
              # the image's /tmp, so they live and die with this pod and never
              # touch the Nexus PVC.
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: script
          configMap:
            name: nexus-bootstrap-script
        - name: data
          persistentVolumeClaim:
            claimName: nexus-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-bootstrap-script
  namespace: artifacts
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
data:
  bootstrap.sh: |
    #!/bin/sh
    # Configures Nexus over its REST API. Idempotent: safe to re-run on every
    # Argo CD sync, which is exactly what the Sync hook causes.
    #
    # POSIX sh only -- see the command: comment on the Job. `set -eu` without
    # -o pipefail, which is not POSIX.
    #
    # Every curl carries --connect-timeout and --max-time. Without them a JVM
    # that accepts the TCP connection and then never answers blocks curl
    # forever, and this Job is a Sync hook: it would stall the whole sync.
    # Because a timeout makes curl exit non-zero, every status capture is
    # written as `CODE=$(curl ...) || CODE=000` -- under `set -eu` a bare
    # assignment from a failing command substitution would abort the script
    # with no message at all, which is the failure mode the timeouts are meant
    # to remove, not introduce.
    set -eu

    NEXUS=http://nexus.artifacts.svc:8081
    # The Docker root connector, opened by docker.httpPort in the docker-proxy
    # body below. This is the route the design actually consumes: containerd
    # reaches it through nodePort 30082. The path-based route on 8081 has
    # curl-only evidence behind it and nothing depends on it, so the anonymous
    # check at the end asks the port that matters.
    NEXUS_DOCKER=http://nexus.artifacts.svc:8082
    BOOTPW=/nexus-data/admin.password

    # Credentials reach curl through --config/-K and request bodies through
    # --data-binary @file, never as arguments. A password on a command line is
    # visible in `ps` to anything sharing the pod's PID namespace -- the rule
    # platform/vault/configure-vault.sh and the Vault unsealer already follow.
    AUTHFILE=$(mktemp)
    PWBODY=$(mktemp)
    BODY=$(mktemp)
    EULA=$(mktemp)
    OUT=$(mktemp)
    # A second response buffer, because $OUT is reused: the 400-retry path in
    # reconcile() would otherwise overwrite the create's validation errors with
    # the retry PUT's response, and a genuinely malformed body would fail with
    # the wrong message attached.
    OUT400=$(mktemp)
    chmod 600 "$AUTHFILE" "$PWBODY"
    trap 'rm -f "$AUTHFILE" "$PWBODY" "$BODY" "$EULA" "$EULA.new" "$OUT" \
      "$OUT400"' EXIT

    echo "==> waiting for the REST API"
    # An Argo CD Sync hook can start before the Deployment has finished
    # rolling, so this loop absorbs the whole cold start. Measured cold start
    # is 38 s (rest-schemas.md section 3), so 60 * 5 s is ample.
    #
    # /status/writable exists on this build and needs no authentication --
    # StatusResource.class in nexus-api-rest-common-3.96.1-01.jar carries an
    # isWritable method annotated @GET @Path("/writable") with no
    # @RequiresAuthentication. Do not read more into it than that: the class
    # injects no service, so isWritable returns 200 as soon as JAX-RS is
    # wired. It is a liveness signal like /status, NOT a genuine writability
    # check, and it is used here only because it is the more specific of two
    # equivalent endpoints.
    #
    # A counted loop rather than `seq 1 60` purely for readability; seq does
    # exist in this image at /usr/bin/seq.
    #
    # A 404 is discriminated from a timeout on purpose. If a future image drops
    # /writable, waiting the full 300 s and then failing would report "Nexus
    # never came up" for an endpoint rename; switching to /status on the spot
    # reports the truth and costs one iteration.
    PROBE=/service/rest/v1/status/writable
    READY=no
    CODE=000
    I=0
    while [ "$I" -lt 60 ]; do
      CODE=$(curl -s -o /dev/null -w '%{http_code}' \
        --connect-timeout 5 --max-time 10 "$NEXUS$PROBE") || CODE=000
      if [ "$CODE" = 200 ]; then
        READY=yes
        break
      fi
      if [ "$CODE" = 404 ] && [ "$PROBE" != /service/rest/v1/status ]; then
        echo "    $PROBE is absent on this build; using /status instead"
        PROBE=/service/rest/v1/status
        continue
      fi
      I=$((I + 1))
      sleep 5
    done

    if [ "$READY" != yes ]; then
      echo "    REST API NEVER ANSWERED on $PROBE (last status $CODE)"
      exit 1
    fi
    echo "    REST API is up ($PROBE -> $CODE)"

    echo "==> selecting credentials"
    # Setting nexus.security.randompassword=false would make the first-boot
    # credential the publicly documented admin/admin123. That is what most
    # automation does, and its failure mode is bad: if this Job never runs,
    # that known credential stays live indefinitely on a tailnet-published
    # service. Reading the boot-generated file has no such window, and it
    # supplies the idempotency signal for free -- Nexus deletes the file when
    # the password changes, so *file present* means first run and *file
    # absent* means reconcile. It works only because RWO is a per-NODE
    # constraint and this is a single-node cluster; spec section 9 records
    # this as the one element that would break on a second node.
    if [ -f "$BOOTPW" ]; then
      echo "    first run: boot password present"
      printf 'user = "admin:%s"\n' "$(cat "$BOOTPW")" > "$AUTHFILE"
      ROTATE=yes
    else
      echo "    already provisioned: using the Vault password"
      printf 'user = "admin:%s"\n' "$NEXUS_PASSWORD" > "$AUTHFILE"
      ROTATE=no
    fi

    echo "==> accepting the Community Edition EULA"
    # The disclaimer text must be echoed back EXACTLY as the GET returned it,
    # so it is read from the instance rather than hardcoded here. That also
    # makes this survive a version bump that reworded it. Without an accepted
    # EULA, Community Edition refuses to fetch or upload any component.
    #
    # sed, not python3/jq -- neither interpreter exists in this image. sed is
    # BusyBox, so the pattern uses [[:space:]] and no GNU-only extensions.
    # The quoted key "accepted" is deliberate: the disclaimer string itself
    # contains the literal text accepted:false, which this pattern must not
    # match, and provably does not (rest-schemas.md section 2).
    #
    # This GET is the first authenticated call in the script, so it is where a
    # wrong credential surfaces. It reports the status rather than dying
    # silently, because 401 here is the most likely first-live-run failure and
    # "the Vault password does not match" is a very different fix from
    # "Nexus is broken".
    CODE=$(curl -s -o "$EULA" -w '%{http_code}' -K "$AUTHFILE" \
      --connect-timeout 5 --max-time 30 \
      "$NEXUS/service/rest/v1/system/eula") || CODE=000
    if [ "$CODE" != 200 ]; then
      echo "    EULA GET FAILED ($CODE)"
      echo "    401 means the admin credential is wrong: on a first run the"
      echo "    boot file, otherwise the Vault value in Secret nexus-admin."
      exit 1
    fi
    if grep -q '"accepted"[[:space:]]*:[[:space:]]*false' "$EULA"; then
      FIRST_ACCEPT=yes
    else
      FIRST_ACCEPT=no
    fi
    sed 's/"accepted"[[:space:]]*:[[:space:]]*false/"accepted" : true/' \
      "$EULA" > "$EULA.new"
    # Assert the transformation, do not assume it. FIRST_ACCEPT is computed
    # with the same pattern the sed uses, so on a future build that reformats
    # this field BOTH would miss together: the unmodified document would be
    # re-POSTed, Nexus would answer 500, and the tolerated-re-POST branch
    # below would log "already accepted" while the EULA stayed unaccepted and
    # CE silently stopped accepting components. Checking the OUTPUT for a true
    # value breaks that symmetry.
    if ! grep -q '"accepted"[[:space:]]*:[[:space:]]*true' "$EULA.new"; then
      echo "    EULA DOCUMENT NOT UNDERSTOOD: no accepted:true after the sed."
      echo "    The field was probably reformatted by a version bump; re-probe"
      echo "    it and update the pattern in this script and rest-schemas.md."
      exit 1
    fi
    CODE=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X POST \
      -H 'Content-Type: application/json' --data-binary @"$EULA.new" \
      --connect-timeout 5 --max-time 30 \
      "$NEXUS/service/rest/v1/system/eula") || CODE=000
    if [ "$CODE" = 204 ]; then
      echo "    accepted ($CODE)"
    elif [ "$FIRST_ACCEPT" = no ]; then
      # Acceptance is one-way: POSTing the document back with accepted:false
      # returns 500, so this branch can only ever re-send `true`. That re-POST
      # was never exercised on the probe, and a no-op re-accept returning
      # something other than 204 is not a reason to fail a sync. Reaching here
      # means the document already said true AND the sed guard above passed.
      echo "    already accepted; re-POST returned $CODE (tolerated)"
    else
      echo "    EULA NOT ACCEPTED ($CODE): $(cat "$OUT")"
      exit 1
    fi

    if [ "$ROTATE" = yes ]; then
      echo "==> rotating the admin password to the Vault value"
      # text/plain, not JSON: this endpoint takes the bare password as the
      # body. The body goes through --data-binary @file, never -d "$PASSWORD",
      # so the credential never becomes an argv entry. After this succeeds
      # Nexus deletes /nexus-data/admin.password, which is what makes the
      # branch above a reliable first-run signal.
      printf '%s' "$NEXUS_PASSWORD" > "$PWBODY"
      CODE=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X PUT \
        -H 'Content-Type: text/plain' --data-binary @"$PWBODY" \
        --connect-timeout 5 --max-time 30 \
        "$NEXUS/service/rest/v1/security/users/admin/change-password") \
        || CODE=000
      case "$CODE" in
        200|204) echo "    rotated ($CODE)" ;;
        *)
          # The status only, NEVER $OUT. This is the one request in the script
          # whose body IS the new password, and a server that echoed the
          # submitted value back in an error would put it in the Job log,
          # where it would outlive the pod. Every other failure branch prints
          # its response body; this one must not.
          echo "    ROTATION FAILED ($CODE) -- response body withheld: it can"
          echo "    contain the submitted password. Inspect it by hand if the"
          echo "    status is not enough."
          exit 1
          ;;
      esac
      printf 'user = "admin:%s"\n' "$NEXUS_PASSWORD" > "$AUTHFILE"
      : > "$PWBODY"
    fi

    # Helper: GET to probe, then POST if absent and PUT if present.
    #
    # It is NOT "POST and treat a conflict as success". Verified on this build
    # (rest-schemas.md sections 4 and 5), a duplicate create returns 400, not
    # 409, and 400 is indistinguishable from a genuine schema rejection by
    # status alone -- so a conflict-tolerant POST either fails every re-run or
    # swallows real errors. Probing first also makes this a true reconcile: a
    # changed body in git reaches an existing object through the PUT.
    #
    # Success codes are per-endpoint arguments because they genuinely differ:
    # repositories create with 201 and update with 204, while the cleanup
    # policy does both with 200.
    #
    # $1 label  $2 probe path  $3 create path  $4 update path
    # $5 create success code  $6 update success code  $7 body file
    reconcile() {
      _label=$1
      _probe=$2
      _create=$3
      _update=$4
      _okc=$5
      _oku=$6
      _body=$7
      _had400=no

      _code=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" \
        --connect-timeout 5 --max-time 30 "$NEXUS$_probe") || _code=000
      if [ "$_code" = 200 ]; then
        _verb=updated
        _want=$_oku
        _code=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X PUT \
          -H 'Content-Type: application/json' --data-binary @"$_body" \
          --connect-timeout 5 --max-time 30 "$NEXUS$_update") || _code=000
      else
        _verb=created
        _want=$_okc
        _code=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X POST \
          -H 'Content-Type: application/json' --data-binary @"$_body" \
          --connect-timeout 5 --max-time 30 "$NEXUS$_create") || _code=000
        if [ "$_code" = 400 ]; then
          # The probe said absent and the server says 400. Two causes look
          # identical here: the name is already taken (the probe GET was
          # wrong) or the body is genuinely malformed. Retrying as an update
          # tells them apart -- a taken name succeeds, a bad body is rejected
          # again and this function fails.
          #
          # The 400 response is copied out FIRST because $OUT is about to be
          # overwritten by the retry, and that body holds the validation
          # errors that say which of the two it was.
          cp "$OUT" "$OUT400"
          _had400=yes
          echo "    $_label: create refused 400, retrying as an update"
          _verb=updated
          _want=$_oku
          _code=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X PUT \
            -H 'Content-Type: application/json' --data-binary @"$_body" \
            --connect-timeout 5 --max-time 30 "$NEXUS$_update") || _code=000
        fi
      fi

      if [ "$_code" != "$_want" ]; then
        echo "    $_label: UNEXPECTED $_code, wanted $_want: $(cat "$OUT")"
        if [ "$_had400" = yes ]; then
          echo "    $_label: the create was refused 400 with:" \
            "$(cat "$OUT400")"
        fi
        return 1
      fi
      echo "    $_label: $_verb ($_code)"
    }

    echo "==> docker bearer token realm"
    # A fresh instance carries only ["NexusAuthenticatingRealm"], so this PUT
    # is required, not optional. The endpoint replaces the whole active list,
    # which is why the authenticating realm is repeated here.
    #
    # NexusAuthorizingRealm is deliberately ABSENT: it is not in
    # /security/realms/available and including it 400s the entire call with
    # "Unknown realmIds". Nexus adds it to the active configuration itself.
    #
    # 204 was observed. 200 is accepted too, for the same reason the anonymous
    # PUT below accepts both: re-running these PUTs was never tested, and
    # failing every future sync over a 200/204 difference on a no-op would
    # break the one hard idempotency requirement in the spec.
    CODE=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X PUT \
      -H 'Content-Type: application/json' \
      -d '["NexusAuthenticatingRealm","DockerToken"]' \
      --connect-timeout 5 --max-time 30 \
      "$NEXUS/service/rest/v1/security/realms/active") || CODE=000
    case "$CODE" in
      200|204) echo "    active realms set ($CODE)" ;;
      *)
        echo "    REALM PUT FAILED ($CODE): $(cat "$OUT")"
        echo "    Without DockerToken active, containerd cannot pull."
        exit 1
        ;;
    esac

    echo "==> enabling anonymous access"
    # Anonymous access is DISABLED on a fresh 3.96.1 instance, so without this
    # the k3s mirror could never pull. The stock `anonymous` user already
    # carries nx-repository-view-*-*-read and -browse, so no role editing.
    #
    # NexusAuthorizingRealm IS correct here and its absence above is NOT a
    # contradiction: this field names the anonymous SUBJECT's realm, which is
    # unrelated to the available-realms list the call above validates against.
    # Do not "fix" one to match the other.
    cat > "$BODY" <<'JSON'
    {
      "enabled": true,
      "userId": "anonymous",
      "realmName": "NexusAuthorizingRealm"
    }
    JSON
    CODE=$(curl -s -o "$OUT" -w '%{http_code}' -K "$AUTHFILE" -X PUT \
      -H 'Content-Type: application/json' --data-binary @"$BODY" \
      --connect-timeout 5 --max-time 30 \
      "$NEXUS/service/rest/v1/security/anonymous") || CODE=000
    case "$CODE" in
      200|204) echo "    anonymous access enabled ($CODE)" ;;
      *)
        echo "    ANONYMOUS ENABLE FAILED ($CODE): $(cat "$OUT")"
        exit 1
        ;;
    esac

    echo "==> cleanup policy docker-proxy-cleanup"
    # Created BEFORE the repository that names it: a reference to a policy
    # that does not exist is rejected. That ordering is the one thing in the
    # sequence that was proven by rejection rather than inferred.
    #
    # This is not housekeeping. Community Edition stops accepting new
    # components at 40,000 and says nothing -- it PAUSES rather than erroring,
    # so a proxy that has silently stopped caching looks exactly like one that
    # is merely slow. A Docker proxy accrues one component per cached tag.
    # Nexus creates and maintains the task that enforces this policy itself.
    #
    # /service/rest/internal/, not /service/rest/v1/. The v1 path the vendor
    # documents returns 404 on this build and is absent from its own
    # swagger.json; the internal path is what the product's UI calls. Its
    # success code is 200 for both create and update, not 201.
    #
    # criteriaLastDownloaded is in DAYS. Sending 2592000 would mean ~7000
    # years and nothing would ever be evicted; the server validates no range.
    #
    # The notes string is byte-identical to the one in rest-schemas.md section
    # 5 so the two files stay diffable.
    cat > "$BODY" <<'JSON'
    {
      "name": "docker-proxy-cleanup",
      "format": "docker",
      "notes": "Phase 21: keeps the CE 40000-component cap out of reach. Spec section 6.2.",
      "criteriaLastDownloaded": 30
    }
    JSON
    reconcile docker-proxy-cleanup \
      /service/rest/internal/cleanup-policies/docker-proxy-cleanup \
      /service/rest/internal/cleanup-policies \
      /service/rest/internal/cleanup-policies/docker-proxy-cleanup \
      200 200 "$BODY"

    echo "==> repository raw-hosted"
    cat > "$BODY" <<'JSON'
    {
      "name": "raw-hosted",
      "online": true,
      "storage": {
        "blobStoreName": "default",
        "strictContentTypeValidation": true,
        "writePolicy": "ALLOW"
      },
      "cleanup": {"policyNames": []},
      "component": {"proprietaryComponents": false},
      "raw": {"contentDisposition": "ATTACHMENT"}
    }
    JSON
    reconcile raw-hosted \
      /service/rest/v1/repositories/raw/hosted/raw-hosted \
      /service/rest/v1/repositories/raw/hosted \
      /service/rest/v1/repositories/raw/hosted/raw-hosted \
      201 204 "$BODY"

    echo "==> repository docker-proxy"
    # docker.httpPort 8082 IS the connector -- there is no separate object to
    # create, and the Service already publishes that container port on
    # nodePort 30082 for containerd. forceBasicAuth false routes Docker
    # clients through the Bearer Token realm instead of HTTP basic auth,
    # which is what lets containerd pull anonymously.
    cat > "$BODY" <<'JSON'
    {
      "name": "docker-proxy",
      "online": true,
      "storage": {
        "blobStoreName": "default",
        "strictContentTypeValidation": true
      },
      "cleanup": {"policyNames": ["docker-proxy-cleanup"]},
      "proxy": {
        "remoteUrl": "https://registry-1.docker.io",
        "contentMaxAge": 1440,
        "metadataMaxAge": 1440
      },
      "negativeCache": {"enabled": true, "timeToLive": 1440},
      "httpClient": {"blocked": false, "autoBlock": true},
      "docker": {
        "v1Enabled": false,
        "forceBasicAuth": false,
        "httpPort": 8082
      },
      "dockerProxy": {"indexType": "HUB", "cacheForeignLayers": false}
    }
    JSON
    reconcile docker-proxy \
      /service/rest/v1/repositories/docker/proxy/docker-proxy \
      /service/rest/v1/repositories/docker/proxy \
      /service/rest/v1/repositories/docker/proxy/docker-proxy \
      201 204 "$BODY"

    echo "==> verifying anonymous docker read"
    # The question the k3s mirror depends on, asked in a way that has a true
    # answer, on the port the mirror actually uses.
    #
    # The obvious check -- GET /v2/ -- returns 401 BY DESIGN: with
    # forceBasicAuth false the Bearer Token realm answers the registry ping
    # with a token challenge, exactly as Docker Hub does. Gating on it would
    # fail a correctly configured system, so /v2/ is not used as a health or
    # readiness signal anywhere in this phase. A manifest fetch is the
    # endpoint that actually carries content, and it was observed returning
    # 200 to an unauthenticated client. No credentials here on purpose: that
    # is the whole point of the check.
    #
    # 8082, not the path-based route on 8081. containerd reaches the root
    # connector through nodePort 30082, and that is the route with real-client
    # evidence behind it (rest-schemas.md section 7). The connector is opened
    # by the repository created moments ago, so the first attempts may well be
    # refused -- hence the retry, which turns "not open yet" into a real
    # answer instead of a permanent "inconclusive".
    CODE=000
    J=0
    while [ "$J" -lt 12 ]; do
      CODE=$(curl -s -o /dev/null -w '%{http_code}' \
        --connect-timeout 5 --max-time 30 \
        "$NEXUS_DOCKER/v2/library/alpine/manifests/3.20") || CODE=000
      case "$CODE" in
        200|401|403) break ;;
      esac
      J=$((J + 1))
      sleep 5
    done
    case "$CODE" in
      200)
        echo "    anonymous read OK"
        ;;
      401|403)
        echo "    ANONYMOUS READ REFUSED ($CODE) -- the mirror will not work"
        exit 1
        ;;
      *)
        # Not an authorization answer. The first fetch of this manifest goes
        # upstream to Docker Hub, so an egress failure lands here, as does a
        # connector that never opened. Both are different faults from the one
        # this check exists to catch, and neither should fail the sync -- but
        # this line means the mirror is UNVERIFIED, so read it as a warning.
        echo "    anonymous read inconclusive ($CODE), not an auth refusal"
        echo "    the mirror is unverified; check port 8082 and egress"
        ;;
    esac

    echo "==> done"
