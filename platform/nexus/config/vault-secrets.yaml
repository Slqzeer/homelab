# Nexus's credential path: Vault KV -> VSO -> Secret.
#
# All four objects live in `artifacts` and that is a requirement, not a
# preference: the VaultAuth CRD states its ServiceAccount "must reside in the
# consuming secret's namespace". This namespace therefore gets its own
# ServiceAccount, VaultConnection, VaultAuth and VaultStaticSecret rather than
# reusing the ones in `vault` or `databases`.
---
# The identity Vault trusts. Its name must match bound_service_account_names
# in platform/vault/configure-vault.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus
  namespace: artifacts
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: artifacts
spec:
  # Plain HTTP in-cluster: single node, so pod traffic never leaves the host.
  # skipTLSVerify is required by the CRD even when the address is http, where
  # it has no effect.
  address: http://vault.vault.svc:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: nexus
  namespace: artifacts
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # role and audiences must both match platform/vault/configure-vault.sh.
    # A mismatch in either is a permission denial that names neither side,
    # while Argo CD reports everything Synced.
    role: vso-nexus
    serviceAccount: nexus
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: nexus-admin
  namespace: artifacts
spec:
  vaultAuthRef: nexus
  mount: homelab
  type: kv-v2
  path: nexus
  refreshAfter: 300s
  destination:
    name: nexus-admin
    create: true
    transformation:
      # Placement matches the precedent in platform/databases/redis/config/
      # vault-secrets.yaml and platform/registry/config/vault-secrets.yaml:
      # the CRD defines excludeRaw under destination.transformation, not
      # under spec directly. spec is a structural schema, so an unknown
      # field there is pruned silently rather than rejected -- the Secret
      # would still be created, Argo CD would still report Healthy, and it
      # would carry a _raw key anyway, which is exactly the gap this is
      # meant to close. The two VaultStaticSecrets that still carry _raw are
      # platform/databases/postgres/config/vault-secrets.yaml and
      # platform/vault-secrets-operator/config/vault-secrets.yaml; retrofitting
      # them is deliberately out of scope for this phase.
      excludeRaw: true
