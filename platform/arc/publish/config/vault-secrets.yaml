# The GitHub App credential for this scale set: Vault KV -> VSO -> Secret
# `arc-github-app` (keys github_app_id, github_app_installation_id,
# github_app_private_key). The scale set's githubConfigSecret names it; the
# ARC controller reads it. Job pods never mount it, and the runner Role has
# no get/list on Secrets (rbac.yaml).
#
# The ServiceAccount, role and audience must match
# platform/vault/configure-vault.sh (role vso-arc).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-github-app
  namespace: arc-publish
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: arc-publish
spec:
  address: http://vault.vault.svc:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: arc-github-app
  namespace: arc-publish
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-arc
    serviceAccount: arc-github-app
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: arc-github-app
  namespace: arc-publish
spec:
  vaultAuthRef: arc-github-app
  mount: homelab
  type: kv-v2
  path: arc-github-app
  refreshAfter: 300s
  destination:
    name: arc-github-app
    create: true
