apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: hermes-dashboard
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: hermes-dashboard
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-dashboard-tailnet
  namespace: hermes-dashboard
spec:
  podSelector:
    matchLabels:
      app: hermes-dashboard-relay
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-dashboard-host
  namespace: hermes-dashboard
spec:
  podSelector:
    matchLabels:
      app: hermes-dashboard-relay
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 9119
