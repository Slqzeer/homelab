# Native Hermes dashboard relay: tailnet -> this pod -> the dashboard process
# on the k3s node. The dashboard remains beside the gateway so it can use the
# existing ~/.hermes state without a privileged hostPath mount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-dashboard-relay
  namespace: hermes-dashboard
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;
      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }
      # Log the path only: OAuth callbacks carry sensitive query parameters.
      log_format json escape=json '{"time":"$time_iso8601","method":"$request_method",'
                                  '"path":"$uri","status":$status,"upstream_s":"$upstream_response_time"}';
      access_log /dev/stdout json;
      server {
        listen 8080;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location / {
          proxy_pass http://10.42.0.1:9119;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
          proxy_connect_timeout 3s;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-dashboard-relay
  namespace: hermes-dashboard
  labels:
    app: hermes-dashboard-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-dashboard-relay
  template:
    metadata:
      labels:
        app: hermes-dashboard-relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: "docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine@sha256:\
            15c994d10d6d78658721c3bcafff14cb281fba2a4bdf9d5ba92c416a472516e3"
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: hermes-dashboard-relay
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-dashboard
  namespace: hermes-dashboard
  labels:
    app: hermes-dashboard-relay
spec:
  selector:
    app: hermes-dashboard-relay
  ports:
    - name: http
      port: 80
      targetPort: http
