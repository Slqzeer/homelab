        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: internal-admin-gateway
          image: >-
            ghcr.io/the-last-exam/internal-admin-gateway:v0.0.2@sha256:1048cd10d5c7859169231876e20e76329f56a23b6e05ef0cec61db1a41ac4736
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8100
          envFrom:
            - configMapRef:
                name: tle-dev-internal-admin-gateway-config
          env:
            # v0.0.2 accepts only staging or production; tle-dev is staging.
            - name: ADMIN_GATEWAY_ENV
              value: staging
            - name: ADMIN_GATEWAY_LISTEN_ADDR
              value: ":8100"
            - name: AUDIT_WRITER_URL
              value: >-
                http://tle-dev-admin-audit-writer.tle-admin-dev.svc.cluster.local:8095
            - name: PROJECTION_WRITER_URL
              value: >-
                http://tle-dev-projection-writer.tle-admin-dev.svc.cluster.local:8120
            - name: OPERATOR_SESSION_ADAPTER
              value: keycloak
            - name: KEYCLOAK_ISSUER_URL
              value: https://keycloak.taildf6cd4.ts.net/realms/homelab
            - name: KEYCLOAK_INTERNAL_BASE_URL
              value: >-
                http://keycloak.keycloak.svc.cluster.local:8080/realms/homelab
            - name: KEYCLOAK_CLIENT_ID
              value: tle-admin-dev
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tle-admin-dev-oidc-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_REDIRECT_URL
              value: >-
                https://tle-dev-operator.taildf6cd4.ts.net/auth/callback
            - name: CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: tle-admin-dev-misc-secrets
                  key: CSRF_SECRET
            - name: LOG_LEVEL
              value: info
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-internal-admin-gateway
  namespace: tle-admin-dev
  annotations:
    # After every tle-dev wave: nothing there depends on admin, so admin
    # health (pending #45) must not gate player-facing rollouts.
    argocd.argoproj.io/sync-wave: "4"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-internal-admin-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
