# TLE admin workloads (issue #53, split from #43).
#
# The retired manifests used the logical `tle-admin` namespace. In this
# environment that isolation boundary is `tle-admin-dev`; it is deliberately
# separate from the player-facing `tle-dev` namespace. A default-deny baseline
# lands here; issue #45 adds the explicit cross-namespace NetworkPolicies.
# Deployments and HPAs sync in wave 4, after every tle-dev wave.
#
# Images are pinned from The-Last-Exam/server release v0.0.2, publish-images
# run 40263029044 (artifact image-record-v0.0.2/images.json).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-admin-audit-writer
  namespace: tle-admin-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-admin-audit-writer
  namespace: tle-admin-dev
  labels:
    app: tle-dev-admin-audit-writer
    app-group: tle-dev-admin-service
spec:
  selector:
    app: tle-dev-admin-audit-writer
  ports:
    - name: http
      port: 8095
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-admin-audit-writer
  namespace: tle-admin-dev
  annotations:
    # After every tle-dev wave: nothing there depends on admin, so admin
    # health (pending #45) must not gate player-facing rollouts.
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: tle-dev-admin-audit-writer
    app-group: tle-dev-admin-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tle-dev-admin-audit-writer
  template:
    metadata:
      labels:
        app: tle-dev-admin-audit-writer
        app-group: tle-dev-admin-service
        metrics: tle-admin-dev
    spec:
      serviceAccountName: tle-dev-admin-audit-writer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin-audit-writer
          image: >-
            ghcr.io/the-last-exam/admin-audit-writer:v0.0.2@sha256:7c0da00a399b089cf4387cc8474395a6c27729397a292792eb09b479b3f48078
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: tle-dev-admin-audit-writer-config
          env:
            - name: AUDIT_WRITER_ENV
              value: dev
            - name: AUDIT_WRITER_PORT
              value: "8095"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-admin-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-admin-dev-data-secrets
                  key: DATABASE_PASSWORD
            - name: LOG_LEVEL
              value: info
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-admin-audit-writer
  namespace: tle-admin-dev
  annotations:
    # After every tle-dev wave: nothing there depends on admin, so admin
    # health (pending #45) must not gate player-facing rollouts.
    argocd.argoproj.io/sync-wave: "4"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-admin-audit-writer
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
