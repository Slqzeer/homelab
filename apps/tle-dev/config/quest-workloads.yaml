  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: tle-dev-quest-seed-baseline
        app-group: tle-dev-service
        app.kubernetes.io/part-of: tle-dev-quest
    spec:
      serviceAccountName: tle-dev-quest-rollout
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quest-seed-baseline
          image: >-
            ghcr.io/the-last-exam/quest-service:v0.0.2@sha256:3dc4bf8f9226efb06695c292c67031073ad7b4f13872bc2748547145b7b1ac26
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/quest-seed-baseline
          args:
            - production
          envFrom:
            - configMapRef:
                name: tle-dev-quest-service-config
            - configMapRef:
                name: tle-dev-quest-runtime
          env:
            - name: QUEST_ROLE
              value: quest-evaluator
            - name: QUEST_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: QUEST_DATABASE_USER
            - name: QUEST_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: QUEST_DATABASE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
