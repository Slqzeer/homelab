# Private GHCR pull credentials for TLE dev workloads.
#
# The credential value stays in Vault at homelab/ghcr. VSO projects only the
# docker config into this namespace; application Deployments reference it
# through the kustomization patch, while dynamically created game pods inherit
# it from the default ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-registry
  namespace: tle-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-dev-registry
  namespace: tle-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-ghcr
    serviceAccount: tle-dev-registry
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: tle-dev
spec:
  vaultAuthRef: tle-dev-registry
  mount: homelab
  type: kv-v2
  path: ghcr
  refreshAfter: 300s
  destination:
    name: ghcr-pull
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        ".dockerconfigjson":
          text: |
            {"auths":{"ghcr.io":{
              "username":{{ get .Secrets "username" | toJson }},
              "password":{{ get .Secrets "password" | toJson }}
            }}}
---
# Game Master creates game pods dynamically. They use the namespace's default
# identity, so it must carry the same pull credential as declarative workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: tle-dev
imagePullSecrets:
  - name: ghcr-pull
