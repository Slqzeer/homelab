# NOTE: no `namespace:` field here on purpose. Objects in this
# kustomization land outside the destination namespace (the postgres-job
# ServiceAccount/VaultAuth/VaultStaticSecret/Job state `namespace:
# databases`, the keycloak ingress rule states `namespace: keycloak`, and
# the admin workloads and projections state `namespace: tle-admin-dev`).
# Kustomize rewrites even explicit namespaces, so a default here would
# silently move those objects into tle-dev (same trap as
# platform/keycloak, which keeps cross-namespace objects in a separate
# kustomization). In-namespace objects inherit the Application's
# destination namespace (tle-dev) at apply time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault-secrets.yaml
  - registry-credentials.yaml
  - networkpolicy.yaml
  - edge-config.yaml
  - service-config.yaml
  - datastores.yaml
  - jetstream-bootstrap.yaml
  - postgres-job.yaml
  - workloads.yaml
  - admin-secrets.yaml
  - admin-networkpolicy.yaml
  - admin-workloads.yaml
  - quest-workloads.yaml
  - game-master.yaml
  - game-pod-environment.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
