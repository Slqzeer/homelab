# TLE service datastore addresses (issue #50).
#
# One ConfigMap per service keeps address ownership aligned with each future
# Deployment's envFrom/configMapKeyRef. These values contain no userinfo;
# database, Valkey, and NATS credentials are delivered separately by VSO.
# The-Last-Exam/server v0.0.1 contains the split-credential loaders from #114.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tle-dev-admin-audit-writer-config
  namespace: tle-dev
data:
  DATABASE_URL: "postgres://postgres.databases:5432/tle_dev"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tle-dev-auth-service-config
  namespace: tle-dev
data:
  DATABASE_URL: "postgres://postgres.databases:5432/tle_dev"
  NATS_URL: "nats://tle-dev-nats.tle-dev.svc.cluster.local:4222"
  VALKEY_URL: "redis://tle-dev-valkey.tle-dev.svc.cluster.local:6379"
---
