            # item, docs/runbooks/tle-dev-recovery.md); this address will
            # not resolve until that follow-up lands. See Risks.
            - name: MINIO_ENDPOINT
              value: "tle-dev-minio.tle-dev.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "metadata-bundles"
            - name: MINIO_USE_SSL
              value: "false"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: METADATA_DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: METADATA_DATABASE_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tle-dev-misc-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
