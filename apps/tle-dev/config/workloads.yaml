        - name: social-service
          image: >-
            ghcr.io/the-last-exam/social-service:v0.0.2@sha256:9342d0e713b708938282a76fd9886bac249ddb309c2628a23e9fe3ab51a01e7f
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9080
          envFrom:
            - configMapRef:
                name: tle-dev-social-service-config
          env:
            - name: SOCIAL_ENV
              value: "dev"
            - name: SOCIAL_PORT
              value: "8080"
            - name: SOCIAL_GRPC_PORT
              value: "9080"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_PASSWORD
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
