# TLE core service workloads (issue #52, split from #43).
#
# The seven player/support-facing services from the retired manifests
# (server commit 63566e15): auth-service, lobby-service,
# matchmaking-service, metadata-service, notification-service,
# player-service, social-service. Other services from config-keys.json
# (game-master, game-service, projection-writer, quest-service,
# admin-audit-writer, internal-admin-gateway, internal-ops-gateway,
# wsterminator) are NOT onboarded here; they are separate follow-up work.
#
# Images: pinned tag@digest from The-Last-Exam/server release v0.0.2
# (gh run 40263029044's images.json). Every Deployment uses the same
# release so the pinned auth-service and metadata-service JWT public key
# below (edge-config.yaml's auth-jwt-ed25519-public-key-pem) matches the
# auth-service private half seeded for that release.
#
# Every service's HTTP port is overridden to 8080 below (its *_PORT env
# var), regardless of its .env.example default (auth-service defaults to
# 3000, matchmaking to 8091, etc.): this lets one NetworkPolicy port
# (tle-dev-edge-to-services, port 8080) cover every service uniformly
# instead of one rule per service's distinct default port. gRPC ports
# (50051/9090/9091/9080) stay at their documented defaults since nothing
# in this namespace assumes a single gRPC port.
#
# Non-secret datastore addresses come from service-config.yaml's
# per-service ConfigMaps (issue #50); do not add other keys there --
# tests/test_tle_datastore_config.py asserts those ConfigMaps contain
# exactly the datastore address keys. Every other required non-secret
# key (ports, *_ENV, tunables) is a literal container env value below.
# Database user/password pairs come from tle-dev-data-secrets
# (vault-secrets.yaml), mapped per service onto the plain DATABASE_USER /
# DATABASE_PASSWORD names each service's code reads.
#
# Known gaps (tracked as Risks in PR #52, not blocking static validation):
#   - matchmaking-service's GAME_MASTER_GRPC_ADDR points at a
#     game-master Service that does not exist yet (not in this issue's
#     scope); matchmaking will fail readiness in a live cluster until
#     game-master is onboarded in a follow-up ticket.
#   - metadata-service's MINIO_ENDPOINT points at a MinIO Service that
#     does not exist yet -- this is the pre-existing "open" object
#     storage item already flagged in docs/runbooks/tle-dev-recovery.md.
---
# ------------------------------- auth-service -------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
  labels:
    app: tle-dev-auth-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-auth-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
  labels:
    app: tle-dev-auth-service
    app-group: tle-dev-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-auth-service
  template:
    metadata:
      labels:
        app: tle-dev-auth-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-auth-service
      automountServiceAccountToken: false
      # AUTH_SERVICE_SHUTDOWN_TIMEOUT_SECONDS defaults to 20; keep this above it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: >-
            ghcr.io/the-last-exam/auth-service:v0.0.2@sha256:189309e7eba8f3683c20324f77f5920ceab8ac330b527eaea2d261fea2d6c463
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tle-dev-auth-service-config
          env:
            - name: AUTH_SERVICE_PORT
              value: "8080"
            - name: AUTH_SERVICE_GRPC_PORT
              value: "50051"
            - name: AUTH_JWT_ED25519_PUBLIC_KEY_PEM
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-jwt-ed25519-public-key-pem
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_PASSWORD
            - name: AUTH_SIGNING_STORE_KEY
              valueFrom:
                secretKeyRef:
                  name: tle-dev-auth-secrets
                  key: AUTH_SIGNING_STORE_KEY
            - name: AUTH_JWT_ED25519_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: tle-dev-auth-secrets
                  key: AUTH_JWT_ED25519_PRIVATE_KEY_PEM
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-auth-service
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
