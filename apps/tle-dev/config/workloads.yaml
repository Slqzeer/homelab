# ------------------------------ player-service --------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-player-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-player-service
  namespace: tle-dev
  labels:
    app: tle-dev-player-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-player-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-player-service
  namespace: tle-dev
  labels:
    app: tle-dev-player-service
    app-group: tle-dev-service
spec:
  # v0.0.3 (as v0.0.2) holds a durable push consumer with no queue group, and NATS allows
  # it one subscriber: a surged pod exits with "consumer is already bound to
  # a subscription" while the old one keeps it, stalling every rollout.
  # Recreate releases it before the new pod subscribes (as projection-writer).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tle-dev-player-service
  template:
    metadata:
      labels:
        app: tle-dev-player-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-player-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: player-service
          image: >-
            ghcr.io/the-last-exam/player-service:v0.0.6@sha256:4192249dd75159c2effbbb7b8f13422b2a37b689cf05f946fde0e898d3bac075
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: tle-dev-player-service-config
          env:
            - name: PLAYER_ENV
              value: "dev"
            - name: PLAYER_PORT
              value: "8080"
            - name: PLAYER_GRPC_PORT
              value: "9090"
            - name: SOCIAL_GRPC_ADDR
              value: "tle-dev-social-service.tle-dev.svc.cluster.local:9080"
            # Starter loadout provisioning (The-Last-Exam/server#263):
            # required from v0.0.3. The token is the one
            # metadata-service enforces (METADATA_GRPC_INTERNAL_TOKEN).
            - name: PLAYER_METADATA_SERVICE_BASE_URL
              value: "http://tle-dev-metadata-service.tle-dev.svc.cluster.local:8080"
            - name: PLAYER_METADATA_GRPC_ADDR
              value: "tle-dev-metadata-service.tle-dev.svc.cluster.local:9091"
            - name: PLAYER_METADATA_GRPC_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tle-dev-misc-secrets
                  key: METADATA_GRPC_INTERNAL_TOKEN
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_PASSWORD
          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-player-service
  namespace: tle-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-player-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ------------------------------ social-service ---------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-social-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-social-service
  namespace: tle-dev
  labels:
    app: tle-dev-social-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-social-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9080
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-social-service
  namespace: tle-dev
  labels:
    app: tle-dev-social-service
    app-group: tle-dev-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tle-dev-social-service
  template:
    metadata:
      labels:
        app: tle-dev-social-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-social-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Match the pinned distroless image's nonroot identity.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: social-service
          image: >-
            ghcr.io/the-last-exam/social-service:v0.0.6@sha256:6ba379e473fbc89892dc36423d63cf4f8f727c3c23108c09650bea9e84f16aa8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9080
          envFrom:
            - configMapRef:
                name: tle-dev-social-service-config
          env:
            - name: SOCIAL_ENV
              value: "dev"
            - name: SOCIAL_PORT
              value: "8080"
            - name: SOCIAL_GRPC_PORT
              value: "9080"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_PASSWORD
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
