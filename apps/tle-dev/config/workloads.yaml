# TLE core service workloads (issue #52, split from #43).
#
# The seven player/support-facing services from the retired manifests
# (server commit 63566e15): auth-service, lobby-service,
# matchmaking-service, metadata-service, notification-service,
# player-service, social-service. Other services from config-keys.json
# (game-service, projection-writer, admin-audit-writer,
# internal-admin-gateway, internal-ops-gateway) are declared separately.
# Wsterminator is declared in wsterminator.yaml. Quest roles are declared in
# quest-workloads.yaml. Game
# Master is declared in game-master.yaml because its
# single-writer, RBAC, PDB and network contract differ from this file's
# scalable service workload pattern.
#
# Images: pinned tag@digest from The-Last-Exam/server release v0.0.6
# (gh run 45821177224's images.json). Every Deployment uses the same
# release so the pinned auth-service and metadata-service JWT public key
# below (edge-config.yaml's auth-jwt-ed25519-public-key-pem) matches the
# auth-service private half seeded for that release.
#
# Every service's HTTP port is overridden to 8080 below (its *_PORT env
# var), regardless of its .env.example default (auth-service defaults to
# 3000, matchmaking to 8091, etc.): this lets one NetworkPolicy port
# (tle-dev-edge-to-services, port 8080) cover every service uniformly
# instead of one rule per service's distinct default port. gRPC ports
# (50051/9090/9091/9080) stay at their documented defaults since nothing
# in this namespace assumes a single gRPC port.
#
# Non-secret datastore addresses come from service-config.yaml's
# per-service ConfigMaps (issue #50); do not add other keys there --
# tests/test_tle_datastore_config.py asserts those ConfigMaps contain
# exactly the datastore address keys. Every other required non-secret
# key (ports, *_ENV, tunables) is a literal container env value below.
# Database user/password pairs come from tle-dev-data-secrets
# (vault-secrets.yaml), mapped per service onto the plain DATABASE_USER /
# DATABASE_PASSWORD names each service's code reads.
---
# ------------------------------- auth-service -------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
  labels:
    app: tle-dev-auth-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-auth-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
  labels:
    app: tle-dev-auth-service
    app-group: tle-dev-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-auth-service
  template:
    metadata:
      annotations:
        homelab.io/jwks-config-revision: split-jwks-v1
      labels:
        app: tle-dev-auth-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-auth-service
      automountServiceAccountToken: false
      # AUTH_SERVICE_SHUTDOWN_TIMEOUT_SECONDS defaults to 20; keep this above it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: >-
            ghcr.io/the-last-exam/auth-service:v0.0.6@sha256:f7ad32c2c56d2ff870c48386f6720633bca7964434c91d2fd4c7f003c086e214
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tle-dev-auth-service-config
          env:
            - name: AUTH_SERVICE_PORT
              value: "8080"
            - name: AUTH_SERVICE_GRPC_PORT
              value: "50051"
            - name: KEYCLOAK_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: keycloak-issuer
            - name: KEYCLOAK_OPERATOR_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: keycloak-operator-client-id
            - name: KEYCLOAK_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: keycloak-jwks-uri
            - name: AUTH_JWT_ED25519_PUBLIC_KEY_PEM
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-jwt-ed25519-public-key-pem
            # Player access-token iss/aud (The-Last-Exam/server#261); the
            # gateway and quest-service require the same pair.
            - name: AUTH_TOKEN_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-token-issuer
            - name: AUTH_TOKEN_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-token-audience
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: DATABASE_PASSWORD
            - name: AUTH_SIGNING_STORE_KEY
              valueFrom:
                secretKeyRef:
                  name: tle-dev-auth-secrets
                  key: AUTH_SIGNING_STORE_KEY
            # Issue #63: encrypts player TOTP secrets at rest
            # (The-Last-Exam/server#230). Required from v0.0.3, which fails
            # startup unless it decodes to exactly 32 bytes. Generated by
            # configure-vault.sh.
            - name: AUTH_TOTP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: tle-dev-auth-secrets
                  key: AUTH_TOTP_ENCRYPTION_KEY
            - name: AUTH_JWT_ED25519_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: tle-dev-auth-secrets
                  key: AUTH_JWT_ED25519_PRIVATE_KEY_PEM
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-auth-service
  namespace: tle-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-auth-service
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ------------------------------ lobby-service -------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-lobby-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-lobby-service
  namespace: tle-dev
  labels:
    app: tle-dev-lobby-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-lobby-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-lobby-service
  namespace: tle-dev
  labels:
    app: tle-dev-lobby-service
    app-group: tle-dev-service
spec:
  # Four durable push consumers with no queue group (lobby-notification,
  # -party, -social, -game-match): NATS allows each one subscriber, so a
  # surged pod exits with "consumer is already bound to a subscription".
  # Recreate releases them first (as player-service and projection-writer).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tle-dev-lobby-service
  template:
    metadata:
      labels:
        app: tle-dev-lobby-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-lobby-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The pinned distroless image owns /home/nonroot as 65532:65532.
        # Overriding only its UID makes the default working directory
        # unsearchable and turns an absent optional .env.dev into EACCES.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lobby-service
          image: >-
            ghcr.io/the-last-exam/lobby-service:v0.0.6@sha256:1f6ecab5314e02cd39d2f9d1865347eb69bf7d161b7e5b4e7a7ea11a651dbbbe
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tle-dev-lobby-service-config
          env:
            - name: LOBBY_ENV
              value: "dev"
            - name: LOBBY_PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-lobby-service
  namespace: tle-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-lobby-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# --------------------------- matchmaking-service -----------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-matchmaking-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-matchmaking-service
  namespace: tle-dev
  labels:
    app: tle-dev-matchmaking-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-matchmaking-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-matchmaking-service
  namespace: tle-dev
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: tle-dev-matchmaking-service
    app-group: tle-dev-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-matchmaking-service
  template:
    metadata:
      labels:
        app: tle-dev-matchmaking-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-matchmaking-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Match the pinned distroless image's nonroot identity.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # matchmaking-service v0.0.3 (as v0.0.2) dials Valkey once in valkey.NewClient and
      # keeps that error forever (cache/client.go initErr), so it never turns
      # ready if the first dial lands before the NetworkPolicy controller
      # admits the new pod IP, which is a few seconds after start. Init
      # containers share the pod IP, so wait here until Valkey answers. Drop
      # this once the service retries its Valkey client.
      initContainers:
        - name: wait-for-valkey
          image: >-
            valkey/valkey:9.0.1@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until valkey-cli -h tle-dev-valkey.tle-dev.svc.cluster.local \
                -p 6379 PING 2>/dev/null | grep -qx PONG; do
                echo "waiting for valkey"; sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: matchmaking-service
          image: >-
            ghcr.io/the-last-exam/matchmaking-service:v0.0.6@sha256:8c7830fa234257ede7929fb72d14fd31764801a9eec02f42b74712deb48c7806
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tle-dev-matchmaking-service-config
          env:
            - name: MATCHMAKING_ENV
              value: "dev"
            - name: MATCHMAKING_PORT
              value: "8080"
            - name: MATCHMAKING_BRACKET_WIDTH
              value: "200"
            - name: MATCHMAKING_BRACKET_EXPANSION_RATE
              value: "50"
            - name: MATCHMAKING_BRACKET_EXPANSION_INTERVAL
              value: "30s"
            - name: MATCHMAKING_GUILD_AFFINITY_WEIGHT
              value: "10"
            - name: MATCHMAKING_POOL_EXHAUSTED_RETRY_INITIAL_BACKOFF
              value: "5s"
            - name: MATCHMAKING_POOL_EXHAUSTED_RETRY_MAX_BACKOFF
              value: "1m"
            - name: MATCHMAKING_HELD_GROUP_LEASE_TTL
              value: "30s"
            - name: MATCHMAKING_HELD_GROUP_RETRY_INTERVAL
              value: "2s"
            - name: MATCHMAKING_RETRY_GAME_MODE_IDS
              value: "ranked"
            - name: PARTY_RESOLVE_SUBJECT
              value: "party.resolve"
            - name: PARTY_RESOLVE_TIMEOUT
              value: "2s"
            - name: SOCIAL_GRPC_TIMEOUT
              value: "750ms"
            - name: SOCIAL_GRPC_ADDR
              value: "tle-dev-social-service.tle-dev.svc.cluster.local:9080"
            - name: GAME_MASTER_GRPC_ADDR
              value: "tle-dev-game-master.tle-dev.svc.cluster.local:9100"
            - name: GAME_MASTER_MATCHMAKING_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: tle-dev-misc-secrets
                  key: GAME_MASTER_MATCHMAKING_CREDENTIAL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tle-dev-matchmaking-service
  namespace: tle-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tle-dev-matchmaking-service
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ----------------------------- metadata-service ------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-metadata-service
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-metadata-service
  namespace: tle-dev
  labels:
    app: tle-dev-metadata-service
    app-group: tle-dev-service
spec:
  selector:
    app: tle-dev-metadata-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9091
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-metadata-service
  namespace: tle-dev
  annotations:
    # Wave 2: after the wave-1 metadata baseline hook, which runs the packaged
    # migrations. v0.0.3 serves metadata from PostgreSQL only (no MinIO,
    # The-Last-Exam/server#305), so it no longer has to be the last wave.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: tle-dev-metadata-service
    app-group: tle-dev-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-metadata-service
  template:
    metadata:
      labels:
        app: tle-dev-metadata-service
        app-group: tle-dev-service
    spec:
      serviceAccountName: tle-dev-metadata-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Match the pinned distroless image's nonroot identity.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: metadata-service
          image: >-
            ghcr.io/the-last-exam/metadata-service:v0.0.6@sha256:7971666fe62dc497e3184f938f6631dd30e35ae994921a3e4e273815cf12fab4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: tle-dev-metadata-service-config
          env:
            # Issue #59: this is the production Metadata Service deployment,
            # so METADATA_ENV must not be "dev" -- "dev" is the server's
            # explicit local-development escape hatch that accepts gRPC
            # callers even without METADATA_GRPC_INTERNAL_TOKEN. The token
            # below is already non-empty, so the gRPC internal-token
            # interceptor already rejects unauthenticated callers; this value
            # also satisfies The-Last-Exam/server#200's upcoming startup
            # check once a release containing it is deployed.
            - name: METADATA_ENV
              value: "prod"
            - name: METADATA_PORT
              value: "8080"
            - name: METADATA_GRPC_PORT
              value: "9091"
            - name: METADATA_JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-jwt-ed25519-public-key-pem
            # No MinIO: from v0.0.3 metadata is served from PostgreSQL only
            # (The-Last-Exam/server#305, ADR #245; issue #96).
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: METADATA_DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tle-dev-data-secrets
                  key: METADATA_DATABASE_PASSWORD
            - name: METADATA_GRPC_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tle-dev-misc-secrets
                  key: METADATA_GRPC_INTERNAL_TOKEN
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
