# TLE dev secret delivery (issue #2, ticket 2).
#
# Secret names come from apps/tle-dev/deploy-info/config-keys.json
# (secret: true). Non-secret keys live in edge-config.yaml / workload env,
# never here. Every VaultStaticSecret sets excludeRaw: true and projects
# only the keys its consumers need.
#
# Vault-side prerequisites (configure-vault.sh extension, see runbook):
#   policies vso-tle-dev-auth, vso-tle-dev-data, vso-tle-dev-misc and
#   kubernetes roles vso-tle-dev-auth, vso-tle-dev-data, vso-tle-dev-misc
#   bound to ServiceAccounts tle-dev-auth, tle-dev-data, tle-dev-misc.
# Rotation: auth signing keys rotate via the #4 flow (operator token);
#   all other keys restart consumers through rolloutRestartTargets below.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: tle-dev
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-dev-auth
  namespace: tle-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-dev-auth
    serviceAccount: tle-dev-auth
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-dev-data
  namespace: tle-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-dev-data
    serviceAccount: tle-dev-data
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-dev-misc
  namespace: tle-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-dev-misc
    serviceAccount: tle-dev-misc
    audiences:
      - vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-auth
  namespace: tle-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-data
  namespace: tle-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-misc
  namespace: tle-dev
---
# auth-service secrets (config-keys.json: auth-service, secret keys) plus
# the #4 rotation settings (issuer / operator client id are non-secret and
# live in edge-config.yaml; no client secret is needed for JWKS fetch).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-dev-auth
  namespace: tle-dev
spec:
  vaultAuthRef: tle-dev-auth
  mount: homelab
  type: kv-v2
  path: tle-dev/auth
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: tle-dev-auth-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        DATABASE_URL:
          text: '{{ get .Secrets "DATABASE_URL" }}'
        AUTH_JWT_ED25519_PRIVATE_KEY_PEM:
          text: '{{ get .Secrets "AUTH_JWT_ED25519_PRIVATE_KEY_PEM" }}'
        AUTH_JWT_ED25519_STAGED_PRIVATE_KEY_PEM:
          text: '{{ get .Secrets "AUTH_JWT_ED25519_STAGED_PRIVATE_KEY_PEM" }}'
        APPLE_PRIVATE_KEY:
          text: '{{ get .Secrets "APPLE_PRIVATE_KEY" }}'
        APPLE_CLIENT_SECRET_OVERRIDE:
          text: '{{ get .Secrets "APPLE_CLIENT_SECRET_OVERRIDE" }}'
        DISCORD_CLIENT_SECRET:
          text: '{{ get .Secrets "DISCORD_CLIENT_SECRET" }}'
        GOOGLE_CLIENT_SECRET:
          text: '{{ get .Secrets "GOOGLE_CLIENT_SECRET" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-auth-service
    - kind: Deployment
      name: tle-dev-edge
---
# Database URLs for every service that stores state (config-keys.json:
# admin-audit-writer, metadata-service, notification-service,
# player-service, projection-writer, quest-service, social-service).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-dev-data
  namespace: tle-dev
spec:
  vaultAuthRef: tle-dev-data
  mount: homelab
  type: kv-v2
  path: tle-dev/data
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: tle-dev-data-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        DATABASE_URL:
          text: '{{ get .Secrets "DATABASE_URL" }}'
        QUEST_DATABASE_URL:
          text: '{{ get .Secrets "QUEST_DATABASE_URL" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-player-service
    - kind: Deployment
      name: tle-dev-social-service
    - kind: Deployment
      name: tle-dev-metadata-service
    - kind: Deployment
      name: tle-dev-notification-service
    - kind: Deployment
      name: tle-dev-quest-service
---
# Remaining secret keys: object storage, push credentials, webhook signing,
# internal tokens, CSRF secret.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-dev-misc
  namespace: tle-dev
spec:
  vaultAuthRef: tle-dev-misc
  mount: homelab
  type: kv-v2
  path: tle-dev/misc
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: tle-dev-misc-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        MINIO_ACCESS_KEY:
          text: '{{ get .Secrets "MINIO_ACCESS_KEY" }}'
        MINIO_SECRET_KEY:
          text: '{{ get .Secrets "MINIO_SECRET_KEY" }}'
        NOTIFICATION_APNS_PRIVATE_KEY:
          text: '{{ get .Secrets "NOTIFICATION_APNS_PRIVATE_KEY" }}'
        NOTIFICATION_FCM_CREDENTIALS_JSON:
          text: '{{ get .Secrets "NOTIFICATION_FCM_CREDENTIALS_JSON" }}'
        NOTIFICATION_WEBHOOK_SIGNING_SECRET:
          text: '{{ get .Secrets "NOTIFICATION_WEBHOOK_SIGNING_SECRET" }}'
        METADATA_GRPC_INTERNAL_TOKEN:
          text: '{{ get .Secrets "METADATA_GRPC_INTERNAL_TOKEN" }}'
        CSRF_SECRET:
          text: '{{ get .Secrets "CSRF_SECRET" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-metadata-service
    - kind: Deployment
      name: tle-dev-notification-service
    - kind: Deployment
      name: tle-dev-admin-gateway
