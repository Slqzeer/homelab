# TLE-local Valkey + NATS (issue #2, ticket 4).
#
# Single-node dev scope: 1 replica each, local-path PVCs. Valkey runs
# append-only (cache/state the services address via VALKEY_ADDR); NATS runs
# JetStream on its PVC (bus via NATS_URL). Both are reconstructible, not
# durable: recreation replays from Postgres/upstream. Shared `databases`
# Redis is untouched. Both Services are cluster-local only; no Ingress ever
# points at them. Resource numbers follow the repo's measure-after-rollout
# rule; the runbook records idle/peak after rollout.
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-valkey
  namespace: tle-dev
  labels:
    app: tle-dev-valkey
spec:
  selector:
    app: tle-dev-valkey
  ports:
    - name: client
      port: 6379
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tle-dev-valkey
  namespace: tle-dev
spec:
  serviceName: tle-dev-valkey
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-valkey
  template:
    metadata:
      labels:
        app: tle-dev-valkey
    spec:
      serviceAccountName: tle-dev-valkey
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: >-
            valkey/valkey:9.0.1@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: client
              containerPort: 6379
          args:
            - valkey-server
            - --appendonly
            - "yes"
            - --save
            - "60 1"
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: client
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-valkey
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-nats
  namespace: tle-dev
  labels:
    app: tle-dev-nats
    metrics: tle-dev
spec:
  selector:
    app: tle-dev-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: metrics
      port: 9000
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tle-dev-nats
  namespace: tle-dev
spec:
  serviceName: tle-dev-nats
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-nats
  template:
    metadata:
      labels:
        app: tle-dev-nats
        metrics: tle-dev
    spec:
      serviceAccountName: tle-dev-nats
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: >-
            nats:2.11.6-alpine@sha256:7dec3f8f1ff181975dbdfc0d903d2a9724659648294dbc2ebb2fa3a294d573a6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: client
              containerPort: 4222
            - name: metrics
              containerPort: 8222
          # --http_port, not --monitor: nats-server has no --monitor flag and
          # exits printing its usage text (CrashLoopBackOff, 1544 restarts
          # by 2026-10-05). The monitor binds the client address (0.0.0.0).
          # store_dir is the PVC root: nats-server appends jetstream/ itself,
          # so this stores in /data/jetstream.
          args:
            - --jetstream
            - --store_dir=/data
            - --http_port=8222
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: client
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /connz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-nats
  namespace: tle-dev
