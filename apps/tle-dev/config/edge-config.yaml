# Dedicated TLE dev edge configuration (issue #2, ticket 6).
#
# Decision (issue #2 acceptance): the edge is a dedicated Deployment in
# tle-dev (image below, pinned per release in the runbook), NOT the
# k3s-bundled Traefik. Traefik stays for in-cluster HTTP only and carries
# no tailnet traffic. Rationale: TLE ADR-0002 (this repo owns the edge),
# the server#4 path-prefix rule, and the README wave-gating lesson.
#
# Sources (pinned copies in ../deploy-info/):
#   identity-headers.json -> strip.headers (exact blank set, Traefik-style)
#     + strip.prefixes (JWT plugin strips whole families on protected routes;
#     Traefik cannot match prefixes, so public routes rely on headers alone).
#   public-routes.json -> routes: one player route per entry; /auth/admin/*,
#     support, dev, health and metrics routes are never exposed (server#7
#     generator refuses them; #4 forbids /auth/admin/* via Ingress, so the
#     player Ingress lists path prefixes, never a catch-all).
#   config-keys.json -> non-secret service endpoints below; secret keys are
#     in Vault (vault-secrets.yaml).
# Image: pinned per release as tag@digest (images.json is not in git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tle-dev-edge-config
  namespace: tle-dev
data:
  strip-headers.json: |
    {
      "source": "edge/API-gateway/plugin/headers.go",
      "headers": [
        "X-Actor-Id",
        "X-Actor-Scope",
        "X-Admin-Env",
        "X-Admin-Scopes",
        "X-Admin-Session-Id",
        "X-Admin-User-Id",
        "X-Auth-Exp",
        "X-Auth-Risk",
        "X-Auth-Scope",
        "X-Auth-Scopes",
        "X-Auth-Session-Id",
        "X-Auth-Sub",
        "X-Authenticated-Player-Id",
        "X-Authenticated-User-Id",
        "X-Internal-Auth",
        "X-Internal-Service",
        "X-Internal-Token",
        "X-Internal-User",
        "X-Ops-Env",
        "X-Ops-Scopes",
        "X-Ops-Session-Id",
        "X-Ops-User-Id",
        "X-Player-Id",
        "X-Player-Role",
        "X-Rate-Limit-Profile",
        "X-User-Id"
      ],
      "prefixes": [
        "X-Actor-",
        "X-Admin-",
        "X-Auth-",
        "X-Internal-",
        "X-Ops-"
      ]
    }
  # #4 rotation authorization (non-secret half; secrets via VSO).
  # auth-service verifies operator (Keycloak, RS256) tokens against
  # keycloak-jwks-uri. The gateway never sees operator tokens (TLE ADR-0001).
  keycloak-issuer: "https://keycloak.taildf6cd4.ts.net/realms/homelab"
  keycloak-operator-client-id: "tle-admin-dev"
  keycloak-jwks-uri: >-
    http://keycloak.keycloak.svc.cluster.local:8080/realms/homelab/protocol/openid-connect/certs
  # Gateway player-token JWKS (#99): auth-service publishes the Ed25519 keys
  # that sign player access tokens. Kept apart from keycloak-jwks-uri so
  # neither consumer can repoint the other. The gateway reads it as
  # AUTH_JWKS_URI (The-Last-Exam/server#261).
  auth-jwks-uri: >-
    http://tle-dev-auth-service.tle-dev.svc.cluster.local:8080/.well-known/jwks.json
  # Player access-token iss/aud (The-Last-Exam/server#261). auth-service mints
  # them (AUTH_TOKEN_ISSUER/AUDIENCE); the gateway and quest-service require
  # them. These are the server defaults, pinned so the three never drift.
  auth-token-issuer: "tle-auth-service"
  auth-token-audience: "tle-player-api"
  # In-cluster service endpoints (non-secret; ports from config-keys.json).
  auth-service-url: "http://tle-dev-auth-service.tle-dev.svc.cluster.local:8080"
  lobby-service-url: "http://tle-dev-lobby-service.tle-dev.svc.cluster.local:8080"
  matchmaking-service-url: "http://tle-dev-matchmaking-service.tle-dev.svc.cluster.local:8080"
  metadata-service-url: "http://tle-dev-metadata-service.tle-dev.svc.cluster.local:8080"
  notification-service-url: "http://tle-dev-notification-service.tle-dev.svc.cluster.local:8080"
  player-service-url: "http://tle-dev-player-service.tle-dev.svc.cluster.local:8080"
  quest-service-url: "http://tle-dev-quest-service.tle-dev.svc.cluster.local:8080"
  social-service-url: "http://tle-dev-social-service.tle-dev.svc.cluster.local:8080"
  wsterminator-url: "http://tle-dev-wsterminator.tle-dev.svc.cluster.local:8080"
  nats-url: "nats://tle-dev-nats.tle-dev.svc.cluster.local:4222"
  valkey-addr: "tle-dev-valkey.tle-dev.svc.cluster.local:6379"
  postgres-host: "postgres.databases.svc.cluster.local"
  # Ed25519 JWT verification key (config-keys.json: AUTH_JWT_ED25519_PUBLIC_KEY_PEM,
  # secret: false, and METADATA_JWT_PUBLIC_KEY for metadata-service). The
  # services parse an SPKI PEM, so a bare hex key fails with "invalid key
  # format". It is the public half of Vault homelab/tle-dev/auth
  # AUTH_JWT_ED25519_PRIVATE_KEY_PEM; rotate both together.
  auth-jwt-ed25519-public-key-pem: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEA5J2fZ545EorGhDOkzivGwszmqyzhP65nArvVWuQdoHo=
    -----END PUBLIC KEY-----
---
# Edge Deployment pinned to the published release image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tle-dev-edge
  namespace: tle-dev
  labels:
    app: tle-dev-edge
    metrics: tle-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tle-dev-edge
  template:
    metadata:
      annotations:
        homelab.io/jwks-config-revision: split-jwks-v1
      labels:
        app: tle-dev-edge
        metrics: tle-dev
    spec:
      serviceAccountName: tle-dev-edge
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # api-gateway v0.0.5 retries its first JWKS load and answers /readyz
      # with 503 until it succeeds (The-Last-Exam/server#328), so the
      # readiness probe below keeps the edge out of the Service until
      # auth-service publishes its keys; no init wait is needed.
      containers:
        - name: edge
          image: >-
            ghcr.io/the-last-exam/api-gateway:v0.0.5@sha256:670b5441c8c082c3cf5e9d3d1af538bfffeb3b5a0deb5c83aa526722eb99e900
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9000
          env:
            # Player access tokens are verified against auth-service
            # (The-Last-Exam/server#261); the gateway never sees operator
            # (Keycloak) tokens.
            - name: AUTH_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-jwks-uri
            - name: AUTH_TOKEN_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-token-issuer
            - name: AUTH_TOKEN_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: tle-dev-edge-config
                  key: auth-token-audience
          volumeMounts:
            - name: edge-config
              mountPath: /etc/tle-edge
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: edge-config
          configMap:
            name: tle-dev-edge-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-dev-edge
  namespace: tle-dev
---
apiVersion: v1
kind: Service
metadata:
  name: tle-dev-edge
  namespace: tle-dev
  labels:
    app: tle-dev-edge
    metrics: tle-dev
spec:
  selector:
    app: tle-dev-edge
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9000
      targetPort: metrics
