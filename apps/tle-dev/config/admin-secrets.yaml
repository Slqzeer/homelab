# Namespace-local Vault projections for the TLE dev admin boundary.
# Secret values remain in the existing TLE and Keycloak Vault paths; this file
# projects only the keys required by the four workloads in admin-workloads.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: tle-admin-dev
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-admin-dev-data
  namespace: tle-admin-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-admin-dev-data
  namespace: tle-admin-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-admin-dev-data
    serviceAccount: tle-admin-dev-data
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-admin-dev-data
  namespace: tle-admin-dev
spec:
  vaultAuthRef: tle-admin-dev-data
  mount: homelab
  type: kv-v2
  path: tle-dev/data
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: tle-admin-dev-data-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        DATABASE_USER:
          text: "tle_dev"
        DATABASE_PASSWORD:
          text: '{{ get .Secrets "password" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-admin-audit-writer
    - kind: Deployment
      name: tle-dev-projection-writer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-admin-dev-misc
  namespace: tle-admin-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-admin-dev-misc
  namespace: tle-admin-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-admin-dev-misc
    serviceAccount: tle-admin-dev-misc
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-admin-dev-misc
  namespace: tle-admin-dev
spec:
  vaultAuthRef: tle-admin-dev-misc
  mount: homelab
  type: kv-v2
  path: tle-dev/misc
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: tle-admin-dev-misc-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        CSRF_SECRET:
          text: '{{ get .Secrets "CSRF_SECRET" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-internal-admin-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-admin-dev-oidc
  namespace: tle-admin-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-admin-dev-oidc
  namespace: tle-admin-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-admin-dev-oidc
    serviceAccount: tle-admin-dev-oidc
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-admin-dev-oidc
  namespace: tle-admin-dev
spec:
  vaultAuthRef: tle-admin-dev-oidc
  mount: homelab
  type: kv-v2
  path: tle-admin-dev-client
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: tle-admin-dev-oidc-secrets
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        KEYCLOAK_CLIENT_SECRET:
          text: '{{ get .Secrets "clientSecret" }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: tle-dev-internal-admin-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tle-admin-dev-registry
  namespace: tle-admin-dev
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: tle-admin-dev-registry
  namespace: tle-admin-dev
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-tle-admin-dev-ghcr
    serviceAccount: tle-admin-dev-registry
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: tle-admin-dev-ghcr-pull
  namespace: tle-admin-dev
spec:
  vaultAuthRef: tle-admin-dev-registry
  mount: homelab
  type: kv-v2
  path: ghcr
  refreshAfter: 300s
  destination:
    name: ghcr-pull
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        ".dockerconfigjson":
          text: |
            {"auths":{"ghcr.io":{
              "username":{{ get .Secrets "username" | toJson }},
              "password":{{ get .Secrets "password" | toJson }}
            }}}
