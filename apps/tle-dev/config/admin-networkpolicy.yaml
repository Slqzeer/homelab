# Safe baseline for the tle-admin-dev boundary. Issue #45 adds the selected,
# port-specific ingress and egress needed by these workloads; unspecified flows
# remain denied throughout that follow-up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tle-admin-dev
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: tle-admin-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Issue #45: the selected flows. Peers are named per workload, never by
# namespace alone, and every cross-namespace grant has its matching ingress
# rule on the far side (networkpolicy.yaml and the postgres fence). The
# service configuration is authoritative:
# only endpoints the v0.0.2 workloads are configured to call are opened.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-dns
  namespace: tle-admin-dev
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-audit-writer-egress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-admin-audit-writer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-projection-writer-egress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-projection-writer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tle-dev
          podSelector:
            matchLabels:
              app: tle-dev-nats
      ports:
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-admin-gateway-egress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-internal-admin-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tle-dev-admin-audit-writer
      ports:
        - protocol: TCP
          port: 8095
    - to:
        - podSelector:
            matchLabels:
              app: tle-dev-projection-writer
      ports:
        - protocol: TCP
          port: 8120
    # Operator-session store.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tle-dev
          podSelector:
            matchLabels:
              app: tle-dev-valkey
      ports:
        - protocol: TCP
          port: 6379
    # KEYCLOAK_INTERNAL_BASE_URL (OIDC code exchange and JWKS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-ops-gateway-egress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-internal-ops-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: tle-dev-admin-audit-writer
      ports:
        - protocol: TCP
          port: 8095
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tle-dev
          podSelector:
            matchLabels:
              app: tle-dev-valkey
      ports:
        - protocol: TCP
          port: 6379
    # AUTH_CONTROL_URL and MATCHMAKING_CONTROL_URL (HTTP only; no gRPC, #51).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tle-dev
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - tle-dev-auth-service
                  - tle-dev-matchmaking-service
      ports:
        - protocol: TCP
          port: 8080
    # GAME_MASTER_CONTROL_URL.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tle-dev
          podSelector:
            matchLabels:
              app: tle-dev-game-master
      ports:
        - protocol: TCP
          port: 8082
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-audit-writer-ingress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-admin-audit-writer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - tle-dev-internal-admin-gateway
                  - tle-dev-internal-ops-gateway
      ports:
        - protocol: TCP
          port: 8095
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-projection-writer-ingress
  namespace: tle-admin-dev
spec:
  podSelector:
    matchLabels:
      app: tle-dev-projection-writer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: tle-dev-internal-admin-gateway
      ports:
        - protocol: TCP
          port: 8120
---
# Operator access is tailnet-only: the Tailscale proxies, never player edge.
# No tailnet Ingress exposes the gateways yet; this admits it when it lands.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tle-admin-dev-gateways-tailnet
  namespace: tle-admin-dev
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - tle-dev-internal-admin-gateway
          - tle-dev-internal-ops-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
      ports:
        - protocol: TCP
          port: 8100
        - protocol: TCP
          port: 8110
