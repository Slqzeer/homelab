# The application package owns ServiceAccount/homelab-portal. This source
# supplies only the site-specific Vault connection, identity, and projection.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: portal
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: homelab-portal
  namespace: portal
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-portal
    serviceAccount: homelab-portal
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-portal
  namespace: portal
spec:
  vaultAuthRef: homelab-portal
  mount: homelab
  type: kv-v2
  path: portal
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: homelab-portal-secrets
    create: true
    transformation:
      # Templates add keys; explicitly exclude every raw Vault key so this
      # projection cannot silently widen if the backing path grows.
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        oidc-client-secret:
          text: '{{ get .Secrets "oidc-client-secret" }}'
        session-current-key:
          text: '{{ get .Secrets "session-current-key" }}'
  # The process reads both values only at startup.
  rolloutRestartTargets:
    - kind: Deployment
      name: homelab-portal
---
# GHCR pull credential for the private portal image. Same rendering as
# platform/registry/config/vault-secrets.yaml: the kubelet requires a
# dockerconfigjson Secret whose only key is `.dockerconfigjson`.
# Uses the existing homelab-portal VaultAuth above, whose role
# (vso-portal) is granted homelab/data/ghcr in configure-vault.sh.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ghcr-pull
  namespace: portal
spec:
  vaultAuthRef: homelab-portal
  mount: homelab
  type: kv-v2
  path: ghcr
  refreshAfter: 300s
  destination:
    name: ghcr-pull
    create: true
    type: kubernetes.io/dockerconfigjson
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        ".dockerconfigjson":
          text: |
            {"auths":{"ghcr.io":{
              "username":{{ get .Secrets "username" | toJson }},
              "password":{{ get .Secrets "password" | toJson }}
            }}}
