# The application package owns ServiceAccount/homelab-portal. This source
# supplies only the site-specific Vault connection, identity, and projection.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: portal
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: homelab-portal
  namespace: portal
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-portal
    serviceAccount: homelab-portal
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homelab-portal
  namespace: portal
spec:
  vaultAuthRef: homelab-portal
  mount: homelab
  type: kv-v2
  path: portal
  refreshAfter: 60s
  destination:
    name: homelab-portal-secrets
    create: true
    transformation:
      # Templates add keys; explicitly exclude every raw Vault key so this
      # projection cannot silently widen if the backing path grows.
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        oidc-client-secret:
          text: '{{ get .Secrets "oidc-client-secret" }}'
        session-current-key:
          text: '{{ get .Secrets "session-current-key" }}'
  # The process reads both values only at startup.
  rolloutRestartTargets:
    - kind: Deployment
      name: homelab-portal
