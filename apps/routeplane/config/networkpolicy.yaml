# Fence around the relay. Default-deny both directions; every flow below
# names a party and a port.
#
# Parties: tailnet proxy -> relay 8080; relay -> the dashboard process on the
# node, at the node's pod-network address 10.42.0.1:8765 (cni0, where the
# routeplane-dashboard user service binds). No DNS: the upstream is an IP.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: routeplane
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: routeplane
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routeplane-tailnet
  namespace: routeplane
spec:
  podSelector:
    matchLabels:
      app: routeplane-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: routeplane-dashboard-host
  namespace: routeplane
spec:
  podSelector:
    matchLabels:
      app: routeplane-relay
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - protocol: TCP
          port: 8765
