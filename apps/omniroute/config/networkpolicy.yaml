# Fence around OmniRoute. Default-deny both directions; every flow below
# names a party and a port.
#
# Parties: tailnet proxy -> OmniRoute 20128 (dashboard + /v1 API, API key
# required); OmniRoute -> DNS; OmniRoute -> egress proxy 3128
# (platform/egress-proxy), which is the ONLY way to the internet: LLM
# provider HTTPS goes through it via HTTPS_PROXY and its domain allowlist.
#
# Future in-cluster callers (Hermes, worker Jobs) get their own ingress rule
# here when they exist.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: omniroute
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: omniroute
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-dns
  namespace: omniroute
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-tailnet
  namespace: omniroute
spec:
  podSelector:
    matchLabels:
      app: omniroute
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/managed: "true"
      ports:
        - protocol: TCP
          port: 20128
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniroute-egress-proxy
  namespace: omniroute
spec:
  podSelector:
    matchLabels:
      app: omniroute
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: egress
          podSelector:
            matchLabels:
              app: egress-proxy
      ports:
        - protocol: TCP
          port: 3128
