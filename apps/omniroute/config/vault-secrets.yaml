# OmniRoute's credentials come only from Vault (homelab/omniroute, seeded by
# platform/vault/configure-vault.sh). Nothing here is a default: there is no
# CHANGEME fallback. If the projection is missing the pod does not start.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omniroute
  namespace: omniroute
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: omniroute
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: omniroute
  namespace: omniroute
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-omniroute
    serviceAccount: omniroute
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: omniroute
  namespace: omniroute
spec:
  vaultAuthRef: omniroute
  mount: homelab
  type: kv-v2
  path: omniroute
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: omniroute-secrets
    create: true
    transformation:
      # Explicitly exclude every raw key so the projection cannot widen if the
      # Vault path grows; only the four templated keys below exist.
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        admin-password:
          text: '{{ get .Secrets "admin-password" }}'
        jwt-secret:
          text: '{{ get .Secrets "jwt-secret" }}'
        api-key-secret:
          text: '{{ get .Secrets "api-key-secret" }}'
        storage-encryption-key:
          text: '{{ get .Secrets "storage-encryption-key" }}'
  # All four are read at process start (the admin password by the init
  # container on every start), so a rotation in Vault rolls the Deployment.
  rolloutRestartTargets:
    - kind: Deployment
      name: omniroute
