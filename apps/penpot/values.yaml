# Penpot site values for chart penpot 1.11.3 (appVersion 2.18.3).
#
# Only site integration lives here. Every credential arrives by VSO
# projection from Vault, so no value below is a secret and this file is
# safe to read in a diff.
#
# The chart pins images as repository:tag with no digest field, so images
# are not digest-pinnable through values. The digests actually deployed are
# recorded in docs/runbooks/penpot-recovery.md.

config:
  # The tailnet name the browser uses, and what Penpot puts in its own
  # absolute links and OIDC redirects.
  publicUri: "https://penpot.taildf6cd4.ts.net"

  # enable-login-with-oidc: Keycloak is the way in.
  # enable-login-with-password stays on as a recovery route that is not
  #   advertised on the login page.
  # enable-registration is deliberately OFF: no self-service sign-up.
  # enable-admin-console is deliberately OFF: a fifth deployment on port
  #   3000 that a personal installation does not need.
  # enable-mcp renders the MCP server. It is required -- see the ingress
  #   comment in environments/homelab/apps/penpot.yaml for why the MCP
  #   endpoint is reached through this same hostname.
  # Every token needs an enable-/disable- prefix; Penpot silently ignores
  # anything else, so a typo is a no-op rather than an error.
  flags: >-
    enable-login-with-password
    disable-email-verification
    enable-login-with-oidc
    enable-mcp

  # PENPOT_SECRET_KEY, from Vault. Rotating it invalidates all sessions.
  existingSecret: penpot-secrets
  secretKeys:
    apiSecretKey: api-secret-key

  # The shared PostgreSQL in `databases`, own database and role created by
  # the Job in apps/penpot/config/postgres-job.yaml.
  #
  # Only usernameKey and passwordKey are set. With postgresqlUriKey empty
  # the chart builds `postgresql://host:port/database` -- no credentials
  # in the URI -- and reads the two credentials from the Secret separately.
  postgresql:
    host: postgres.databases.svc.cluster.local
    port: 5432
    database: penpot
    existingSecret: penpot-secrets
    secretKeys:
      usernameKey: postgres-username
      passwordKey: postgres-password
      postgresqlUriKey: ""

  # The shared Redis in `databases`. It runs with requirepass, so a host and
  # port are not enough: the chart needs one fully-formed URI including the
  # password, which is why redisUriKey is set rather than a bare host.
  #
  # VSO renders that URI from the shared Redis password (Vault
  # homelab/redis) into its own Secret, penpot-redis: two VaultStaticSecrets
  # cannot own one destination Secret, so it is not a penpot-secrets key.
  #
  # Database index 3, not 0. This Redis is shared, and Penpot's websocket
  # coordination keys must not collide with another consumer's.
  redis:
    host: redis.databases.svc.cluster.local
    port: "6379"
    database: "3"
    existingSecret: penpot-redis
    secretKeys:
      redisUriKey: redis-uri

# No global.postgresqlEnabled or global.valkeyEnabled: both are external.
# The chart hard-fails if either is true.

backend:
  # backend.extraEnvs, NOT config.extraEnvs. The chart injects
  # config.extraEnvs into all five components, so an OIDC client secret
  # placed there would also be handed to the MCP server and the exporter.
  #
  # The endpoint split is not optional. A pod cannot resolve
  # keycloak.taildf6cd4.ts.net through cluster DNS, so the browser-facing
  # authorization endpoint uses the tailnet name while the backend's token,
  # userinfo and JWKS endpoints use the in-cluster Service. Keycloak derives
  # a token's `iss` from the host used to reach it, so a mismatch here shows
  # up as an ID token validation failure -- verify login live before
  # publishing the portal entry.
  extraEnvs:
    - name: PENPOT_OIDC_CLIENT_ID
      value: penpot
    - name: PENPOT_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: penpot-secrets
          key: oidc-client-secret
    - name: PENPOT_OIDC_BASE_URI
      value: "https://keycloak.taildf6cd4.ts.net/auth/realms/homelab/"
    - name: PENPOT_OIDC_AUTH_URI
      value: >-
        https://keycloak.taildf6cd4.ts.net/auth/realms/homelab/protocol/openid-connect/auth
    - name: PENPOT_OIDC_TOKEN_URI
      value: >-
        http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/homelab/protocol/openid-connect/token
    - name: PENPOT_OIDC_USER_URI
      value: >-
        http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/homelab/protocol/openid-connect/userinfo
    - name: PENPOT_OIDC_JWKS_URI
      value: >-
        http://keycloak.keycloak.svc.cluster.local:8080/auth/realms/homelab/protocol/openid-connect/certs
    # Required because the backend reaches Keycloak at a hostname that
    # autodiscovery would not otherwise permit.
    - name: PENPOT_SSRF_ALLOWED_HOSTS
      value: >-
        keycloak.keycloak.svc.cluster.local keycloak.taildf6cd4.ts.net
    - name: PENPOT_OIDC_SCOPES
      value: "openid profile email"
    - name: PENPOT_OIDC_NAME_ATTR
      value: preferred_username
    - name: PENPOT_OIDC_EMAIL_ATTR
      value: email

# Uploaded images and SVG clips. The component's only volume, and the
# reason homelab.io/state is durable.
persistence:
  assets:
    enabled: true
    storageClass: local-path
    size: 5Gi
