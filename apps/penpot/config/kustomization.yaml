# NOTE: no `namespace:` field here on purpose. Three objects in this
# kustomization land outside the destination namespace: the postgres-job
# ServiceAccount/VaultAuth/VaultStaticSecret/Job state `namespace:
# databases`, and the keycloak client projection states `namespace:
# keycloak`. Kustomize rewrites even explicit namespaces, so a default here
# would silently move those objects into penpot -- the same trap as
# apps/tle-dev/config. In-namespace objects inherit the Application's
# destination namespace (penpot) at apply time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vault-secrets.yaml
  - networkpolicy.yaml
  - postgres-job.yaml
