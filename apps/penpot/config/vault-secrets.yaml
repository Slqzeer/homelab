# Penpot's credentials come only from Vault. Nothing here is a default and
# there is no CHANGEME fallback: if a projection is missing, the chart's
# secretKeyRef has nothing to read and the pod does not start.
#
# Vault-side prerequisites, created by platform/vault/configure-vault.sh:
#   policy vso-penpot-read, policy vso-penpot-db-read
#   role  vso-penpot    bound to ServiceAccount penpot    in namespace penpot,
#                       carrying vso-penpot-read AND the existing vso-redis-read
#   role  vso-penpot-db bound to ServiceAccount penpot-db in namespace databases
#
# ServiceAccount penpot is VSO's Vault identity and nothing else's. The
# chart's pods run as their own ServiceAccount, penpot-workload (see
# serviceAccount in apps/penpot/values.yaml), so no Penpot pod can log in
# to Vault as vso-penpot, and the chart does not render this object twice.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: penpot
  namespace: penpot
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault
  namespace: penpot
spec:
  address: http://vault.vault.svc.cluster.local:8200
  skipTLSVerify: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: penpot
  namespace: penpot
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso-penpot
    serviceAccount: penpot
    audiences:
      - vault
---
# The values the chart reads. Every key here is named by apps/penpot/values.yaml.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: penpot
  namespace: penpot
spec:
  vaultAuthRef: penpot
  mount: homelab
  type: kv-v2
  path: penpot
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: penpot-secrets
    create: true
    transformation:
      # Explicitly exclude every raw key so the projection cannot widen if the
      # Vault path grows; only the four templated keys below exist.
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        postgres-username:
          text: '{{ get .Secrets "postgres-username" }}'
        postgres-password:
          text: '{{ get .Secrets "postgres-password" }}'
        api-secret-key:
          text: '{{ get .Secrets "api-secret-key" }}'
        oidc-client-secret:
          text: '{{ get .Secrets "oidc-client-secret" }}'
  # All four are read at process start, so a rotation in Vault rolls the
  # Deployments that reference penpot-secrets (chart 1.11.3 renders the
  # backend and the exporter with it; the frontend and mcp do not). Note what
  # is NOT here: the MCP key. Penpot issues it after the first interactive
  # login and shows it once, so it cannot be projected before it exists; it
  # lives in Vault for the AI client to read, and no pod consumes it.
  rolloutRestartTargets:
    - kind: Deployment
      name: penpot-backend
    - kind: Deployment
      name: penpot-exporter
---
# Penpot's Redis URI, rendered here and not stored in Vault. The shared Redis
# has one requirepass, at homelab/redis (key `password`); this renders it the
# same way platform/databases/redis/config/vault-secrets.yaml renders
# requirepass.conf. Database index 3 keeps Penpot's keys apart from the other
# tenants of that instance. Vault role vso-penpot reads homelab/redis through
# the existing vso-redis-read policy (platform/vault/configure-vault.sh).
#
# This is a second VaultStaticSecret with its own destination Secret because
# two VaultStaticSecrets cannot own one destination. The chart reads it as
# penpot-redis (apps/penpot/values.yaml) in the backend, exporter and mcp.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: penpot-redis
  namespace: penpot
spec:
  vaultAuthRef: penpot
  mount: homelab
  type: kv-v2
  path: redis
  refreshAfter: 300s
  hmacSecretData: true
  destination:
    name: penpot-redis
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        redis-uri:
          text: 'redis://:{{ get .Secrets "password" }}@redis.databases.svc.cluster.local:6379/3'
  rolloutRestartTargets:
    - kind: Deployment
      name: penpot-backend
    - kind: Deployment
      name: penpot-exporter
    - kind: Deployment
      name: penpot-mcp
---
# The OIDC client secret for the `penpot` Keycloak client, consumed by the
# PostSync hook in platform/keycloak/config/client-registration.yaml.
#
# This object states `namespace: keycloak` on purpose and is the reason this
# kustomization omits a `namespace:` default: a VaultAuth's ServiceAccount
# must reside in the consuming Secret's namespace, and that Secret belongs to
# Keycloak's namespace, not Penpot's.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-penpot-client
  namespace: keycloak
spec:
  vaultAuthRef: keycloak
  mount: homelab
  type: kv-v2
  path: penpot-client
  refreshAfter: 300s
  hmacSecretData: true
  # The hook reads it on each run; no rollout target, because the consumer is
  # a Job, not a Deployment.
  destination:
    name: keycloak-penpot-client
    create: true
    transformation:
      excludeRaw: true
      excludes:
        - ".*"
      templates:
        clientSecret:
          text: '{{ get .Secrets "clientSecret" }}'
