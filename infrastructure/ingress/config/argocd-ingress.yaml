# Argo CD on the tailnet at https://argocd.taildf6cd4.ts.net
#
# This Ingress lives here, NOT in bootstrap/argocd/values.yaml, and that is
# deliberate. Argo CD self-manages at sync-wave -1, and Argo CD reports an
# Ingress as Progressing until status.loadBalancer.ingress is populated.
# Only this operator populates it, and it installs at wave 2 -- which root
# would never reach while still waiting on wave -1. The Ingress would block
# installation of the controller that unblocks the Ingress. Keeping it out
# of Argo CD's own release lets wave -1 go Healthy unconditionally.
#
# Every Ingress in this repository lives here, at wave 21, for the same
# reason: nothing else should ever wait on ingress health to sync.
#
# TLS terminates at the Tailscale proxy with a real Let's Encrypt
# certificate. The hop from proxy to argocd-server is plain HTTP inside the
# cluster, which is why configs.params."server.insecure" stays true.
#
# This Ingress gets its own dedicated proxy rather than sharing the
# "ingress" ProxyGroup from Task 5. Tailscale Services -- the mechanism a
# ProxyGroup uses to publish a per-Ingress hostname -- proved unroutable
# on this tailnet even after autoApprovers was applied: DNS resolved the
# VIP, but `tailscale ping` reported "no matching peer" and the VIP itself
# was unreachable from two separate machines, while the proxy's own
# tailnet device IP refused the connection cleanly instead of timing out.
# A dedicated proxy registers as an ordinary tailnet device and never
# touches the Service layer, so it sidesteps the failure. It still
# references the ProxyClass from Task 5 so the pod stays memory-bounded.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    tailscale.com/proxy-class: homelab
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 80
  tls:
    # Short name only. Becomes argocd.taildf6cd4.ts.net via MagicDNS.
    - hosts:
        - argocd
