apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-dashboard
  namespace: hermes-dashboard
  annotations:
    tailscale.com/proxy-group: ingress
    portal.homelab.io/enabled: "true"
    portal.homelab.io/name: Hermes Agent
    portal.homelab.io/description: Native Hermes configuration, sessions and agent dashboard
    portal.homelab.io/category: Infrastructure
    portal.homelab.io/icon: generic
    portal.homelab.io/access: groups
    portal.homelab.io/groups: homelab-admins
    portal.homelab.io/order: "70"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hermes-dashboard
      port:
        number: 80
  tls:
    - hosts:
        - hermes
