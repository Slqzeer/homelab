# Vault UI on the tailnet at https://vault.taildf6cd4.ts.net
#
# Backend is the vault-ui Service on 8200, which the chart creates when
# ui.enabled is true. TLS terminates at the Tailscale proxy with a real
# Let's Encrypt certificate; the hop to vault-ui is plain HTTP inside the
# cluster, matching the posture used for Argo CD.
#
# The proxy-group annotation is NOT decorative: without it a tailscale
# Ingress gets a dedicated, unbounded proxy pod of its own (chart default is
# `resources: {}`) instead of joining the bounded shared pool.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: vault
  annotations:
    tailscale.com/proxy-group: ingress
    portal.homelab.io/enabled: "true"
    portal.homelab.io/name: Vault
    portal.homelab.io/description: Secret management and recovery operations
    portal.homelab.io/category: Infrastructure
    portal.homelab.io/icon: vault
    portal.homelab.io/access: groups
    portal.homelab.io/groups: homelab-admins
    portal.homelab.io/order: "10"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: vault-ui
      port:
        number: 8200
  tls:
    # Short name only. Becomes vault.taildf6cd4.ts.net via MagicDNS.
    - hosts:
        - vault
