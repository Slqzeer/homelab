# Penpot on the tailnet at https://penpot.taildf6cd4.ts.net
#
# The frontend Service only. The backend (6060), exporter (6061) and MCP
# server (4401/4402) are cluster-local by design and deliberately absent.
#
# This one Ingress also carries the MCP endpoint. Clients connect to
# https://penpot.taildf6cd4.ts.net/mcp/stream?userToken=<MCP_KEY>, which the
# frontend proxies to the MCP server. The MCP server authenticates nobody on
# its own, so giving it a tailnet route of its own would publish
# unauthenticated read/write access to every design file. There is
# deliberately no second Ingress here, and no penpot-mcp route in this file.
#
# Published in the Homelab Portal only after Keycloak login, and the refusal
# of password login and self-registration, were verified on the live cluster.
#
# The backend Service is `penpot` (the chart's frontend Service), not
# `penpot-frontend`: that string is the frontend pods' selector label.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: penpot
  namespace: penpot
  annotations:
    tailscale.com/proxy-group: ingress
    # `authenticated`, not `public`: Penpot is a design tool holding real
    # work and Keycloak is its only sign-in path. It sets no
    # portal.homelab.io/groups, which the validator rejects for non-group
    # access.
    #
    # icon is `generic`, not `penpot`: the portal's known icon set is
    # {argocd, generic, grafana, keycloak, kubernetes, prometheus, tailscale,
    # vault} and the portal excludes metadata it does not recognise. A future
    # Penpot glyph means adding it to that set and to the test.
    #
    # order 60 follows Keycloak's 50, placing Penpot after the identity and
    # infrastructure entries.
    portal.homelab.io/enabled: "true"
    portal.homelab.io/name: Penpot
    portal.homelab.io/description: Open-source design platform with MCP access
    portal.homelab.io/category: Design
    portal.homelab.io/icon: generic
    portal.homelab.io/access: authenticated
    portal.homelab.io/order: "60"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: penpot
      port:
        name: http
  tls:
    # Short name only. Becomes penpot.taildf6cd4.ts.net via MagicDNS.
    - hosts:
        - penpot
