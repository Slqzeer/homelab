# Grafana on the tailnet at https://grafana.taildf6cd4.ts.net
#
# In infrastructure/ingress/config, at wave 21, AHEAD of the Grafana it
# points at (wave 23). Every Ingress in this repository lives here for the
# reason argocd-ingress.yaml sets out: nothing should ever wait on ingress
# health to sync. An Ingress whose backend does not exist yet is valid and
# harmless -- it simply has nothing to route to until wave 23 lands.
#
# A dedicated proxy rather than the shared ProxyGroup, for the reason
# argocd-ingress.yaml records at length: Tailscale Services proved
# unroutable on this tailnet. It still references the ProxyClass so the pod
# stays memory-bounded.
#
# There is deliberately NO Ingress for Prometheus, and none for Loki either.
# Neither has authentication of any kind -- Prometheus exposes an admin API,
# Loki exposes a delete surface -- and
# infrastructure/networking/policy.hujson is currently a single
# {"src": ["*"], "dst": ["*"], "ip": ["*"]} grant, so publishing either
# would hand that surface to every device on the tailnet. Reach them with a
# port-forward; the commands are in observability/monitoring/README.md and
# observability/logging/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    tailscale.com/proxy-class: homelab
    portal.homelab.io/enabled: "true"
    portal.homelab.io/name: Grafana
    portal.homelab.io/description: Dashboards and operational metrics
    portal.homelab.io/category: Observability
    portal.homelab.io/icon: grafana
    portal.homelab.io/access: groups
    portal.homelab.io/groups: homelab-admins,homelab-users
    portal.homelab.io/order: "30"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: monitoring-grafana
      port:
        number: 80
  tls:
    # Short name only. Becomes grafana.taildf6cd4.ts.net via MagicDNS.
    - hosts:
        - grafana
