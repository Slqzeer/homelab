# routeplane tracking dashboard on the tailnet at https://routeplane.taildf6cd4.ts.net
#
# Read-only, but it shows Hermes prompts and failure excerpts and has NO login of
# its own: the tailnet is the only gate. Published in the Homelab Portal at the
# owner's request (2026-10-09) and listed for homelab-admins only, like Argo CD
# and Vault. The portal's access setting hides the link; it does not protect the
# target. Put a Keycloak login in front before widening it.
# Served by the shared "ingress" ProxyGroup like every other Ingress here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: routeplane
  namespace: routeplane
  annotations:
    tailscale.com/proxy-group: ingress
    portal.homelab.io/enabled: "true"
    portal.homelab.io/name: routeplane
    portal.homelab.io/description: Hermes task chains, worker health and recurring failures
    portal.homelab.io/category: Infrastructure
    portal.homelab.io/icon: generic
    portal.homelab.io/access: groups
    portal.homelab.io/groups: homelab-admins
    portal.homelab.io/order: "70"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: routeplane
      port:
        number: 80
  tls:
    # Short name only. Becomes routeplane.taildf6cd4.ts.net via MagicDNS.
    - hosts:
        - routeplane
